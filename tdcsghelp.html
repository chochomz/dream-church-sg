<head>

<title>목장 이야기 사용설명서</title>
<script>
(function () {
  /* [보안] 우클릭 · 드래그 · 선택 · 개발자도구/소스보기/저장 단축키 차단 (로그인/통행증 리다이렉트 없음) */
  var stop = function (e) { e.preventDefault(); return false; };
  document.addEventListener("contextmenu", stop, true);
  document.addEventListener("dragstart", stop, true);
  document.addEventListener("selectstart", stop, true);
  window.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase(), c = e.keyCode || e.which, m = e.ctrlKey || e.metaKey;
    if (c === 123 || k === "f12" ||
        (m && (e.shiftKey || e.altKey) && "ijckuIJCKU".indexOf(k) > -1) ||
        (m && (k === "u" || k === "s" || k === "p"))) { e.preventDefault(); e.stopPropagation(); return false; }
  }, true);
})();
</script>
<style>
:root{
  --green:#3B5D50; --green-soft:#E8F0EC; --navy:#163172; --rose:#C81E45;
  --paper:#FBFAF7; --ink:#25302B; --mute:#6B7770; --line:#DCE5E0; --gold:#F4E7C5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--ink);overflow:hidden;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media print{body{display:none}}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:14px 18px 10px;background:#fff;border-bottom:1px solid var(--line)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.go-app-btn{font:inherit;font-size:12px;font-weight:800;color:var(--green);background:var(--green-soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap}
header p{font-size:12.5px;color:var(--mute);margin-top:3px}
.steps{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.steps .cap{font-size:13px;font-weight:800;color:var(--green);white-space:nowrap}
.dots{display:flex;gap:6px}
.dots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--line);cursor:pointer}
.dots button.on{background:var(--green);width:22px;border-radius:5px}
main{flex:1;overflow-y:auto;padding:16px 16px 8px;-webkit-overflow-scrolling:touch}
.lead{font-size:14.5px;line-height:1.7;color:var(--ink);margin-bottom:14px}
.lead b{color:var(--green)}
.item{margin-bottom:12px}
.tap{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:13px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.tap .ic{width:42px;height:42px;border-radius:13px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.tap .tt{flex:1;min-width:0}
.tap .tt strong{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.tap .tt span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.tap .hint{font-size:12px;font-weight:700;color:var(--rose);flex:none;animation:nudge 1.6s ease-in-out infinite}
.item.open .tap{border-color:var(--green);background:#F6FAF8}
.item.open .hint,.item.seen .hint{animation:none;color:var(--green)}
@keyframes nudge{50%{transform:translateX(3px)}}
.say{display:none;margin:8px 4px 0 18px;padding:13px 15px;background:var(--gold);border-radius:4px 16px 16px 16px;
  font-size:14px;line-height:1.75;color:#3A3322}
.item.open .say{display:block;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.say ol,.say ul{padding-left:18px;margin-top:4px}
.say li{margin-top:3px}
.react{display:flex;gap:8px;margin-bottom:14px}
.react button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 0;font:inherit;
  font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.react button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.react button.on.h{color:var(--rose);border-color:var(--rose);background:#FDF0F3}
.react button.on.t{color:#0369A1;border-color:#0369A1;background:#EEF7FD}
.react button.on.p{color:#B45309;border-color:#B45309;background:#FEF6E7}
nav{display:flex;gap:10px;padding:10px 16px 14px;background:#fff;border-top:1px solid var(--line)}
nav button{flex:1;font:inherit;font-size:14.5px;font-weight:800;padding:13px 0;border-radius:14px;border:0;cursor:pointer}
#prev{background:var(--green-soft);color:var(--green)}
#next{background:var(--green);color:#fff}
nav button[disabled]{opacity:.35}
.prog{font-size:12px;color:var(--mute);text-align:center;margin:4px 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div id="app">
  <header>
    <div class="header-top">
      <h1>목장 이야기 사용설명서</h1>
      <button type="button" class="go-app-btn" onclick="finishManual()">목장 들어가기</button>
    </div>
    <p>궁금한 곳을 살짝 눌러 보세요. 쉽게 알려 드릴게요 😊</p>
    <div class="steps" id="steps"></div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="prev">이전</button>
    <button id="next">다음</button>
  </nav>
</div>

  try{
    if(window.parent && window.parent!==window && window.parent.closeUserManualModal){
      window.parent.closeUserManualModal();
      return;
    }
  }catch(e){}
  window.location.href="index.html";
}

    say:"펜 버튼 → <b>알림 확인</b>을 누르면 그동안의 목장 소식을 한곳에서 다시 볼 수 있어요."},
   {ic:"📏",t:"용량 안내",s:"넉넉하게 쓰기 위한 약속이에요",
    say:"사진은 한 장에 <b>15MB</b>까지, 첨부 파일은 <b>1MB</b>까지, 긴글은 <b>1,500자</b>까지 쓸 수 있어요. 넘으면 친절하게 안내해 드려요."}
  ]}
];
var cur=0, seen={}, main=document.getElementById("main"), steps=document.getElementById("steps");
var prev=document.getElementById("prev"), next=document.getElementById("next");

function render(){
  var pg=pages[cur], h='<p class="lead">'+pg.lead+'</p>';
  if(pg.react){
    h+='<div class="react"><button class="h" data-r="h"><i>❤️</i>하트</button><button class="t" data-r="t"><i>👍</i>엄지</button><button class="p" data-r="p"><i>🙏</i>기도</button></div>'+
       '<div class="say" id="rsay" style="display:none;margin:-4px 0 14px;border-radius:16px"></div>';
  }
  var done=0;
  pg.items.forEach(function(it,i){ if(seen[cur+"-"+i]) done++; });
  h+='<p class="prog">살펴본 카드 '+done+' / '+pg.items.length+'</p>';
  pg.items.forEach(function(it,i){
    var k=cur+"-"+i;
    h+='<div class="item'+(seen[k]?' seen':'')+'" data-k="'+k+'"><button class="tap"><span class="ic">'+it.ic+'</span><span class="tt"><strong>'+it.t+'</strong><span>'+it.s+'</span></span><span class="hint">'+(seen[k]?'✓ 확인':'눌러 보세요')+'</span></button><div class="say">'+it.say+'</div></div>';
  });
  main.innerHTML=h; main.scrollTop=0;
  steps.innerHTML='<span class="cap">'+(cur+1)+' / '+pages.length+' · '+pg.tab+'</span><span class="dots">'+pages.map(function(p,i){return '<button aria-label="'+(i+1)+'쪽" class="'+(i===cur?'on':'')+'" data-p="'+i+'"></button>';}).join("")+'</span>';
  prev.disabled=(cur===0);
  next.textContent=(cur===pages.length-1)?"설명서 마치기":"다음";
}
var msg={
  h:["❤️ 하트","'좋아요'처럼 공감하는 마음을 전해요. 한 번 더 누르면 취소돼요."],
  t:["👍 엄지","'잘했어요, 수고했어요' 하고 칭찬하고 싶을 때 눌러 주세요."],
  p:["🙏 기도","'함께 기도할게요' 하는 마음을 전해요. 힘든 일을 나눈 이웃에게 큰 위로가 돼요."]
};
main.addEventListener("click",function(e){
  var r=e.target.closest("[data-r]");
  if(r){
    var on=r.classList.toggle("on"), box=document.getElementById("rsay"), m=msg[r.dataset.r];
    box.style.display="block";
    box.innerHTML="<b>"+m[0]+"</b><br>"+(on?m[1]:"눌렀던 마음을 거두었어요. 언제든 다시 눌러 주세요 🙂");
    return;
  }
  var it=e.target.closest(".item");
  if(!it) return;
  var wasOpen=it.classList.contains("open");
  main.querySelectorAll(".item.open").forEach(function(x){x.classList.remove("open");});
  if(!wasOpen){
    it.classList.add("open"); it.classList.add("seen"); seen[it.dataset.k]=1;
    it.querySelector(".hint").textContent="✓ 확인";
    var d=0, n=pages[cur].items.length; for(var i=0;i<n;i++) if(seen[cur+"-"+i]) d++;
    main.querySelector(".prog").textContent="살펴본 카드 "+d+" / "+n;
  }
});
steps.addEventListener("click",function(e){var b=e.target.closest("[data-p]"); if(b){cur=+b.dataset.p; render();}});
prev.addEventListener("click",function(){ if(cur>0){cur--; render();} });
next.addEventListener("click",function(){
  if(cur<pages.length-1){cur++; render();}
  else { finishManual(); }
});
render();
</script>
</body>
</html>
