    <script>
        (function() {
            var REQUIRED_TARGET = "indexdm.html";
            var isAllowed = false;
            try {
                if (!window.location || window.location.protocol === "blob:" || !window.location.href) return;
                var passRaw = sessionStorage.getItem("mokjang_dm_pass");
                if (passRaw) {
                    var pass = JSON.parse(passRaw);
                    if (pass && pass.target === REQUIRED_TARGET && pass.role === "leader" && pass.token) {
                        isAllowed = true; window.__MOKJANG_DM_VERIFIED__ = pass;
                    }
                }
                if (!isAllowed) {
                    var sr = localStorage.getItem("mokjang_user_role");
                    var sa = localStorage.getItem("mokjang_is_admin");
                    var sn = localStorage.getItem("mokjang_user_name") || "목자";
                    if (sr === "leader" || sa === "true" || sn === "목자" || sn === "관리자") {
                        isAllowed = true;
                        window.__MOKJANG_DM_VERIFIED__ = { target: REQUIRED_TARGET, role: "leader", leaderName: sn, mokjangCode: localStorage.getItem("mokjang_active_code") || "1111", mokjangShort: localStorage.getItem("mokjang_short_name") || "" };
                    }
                }
            } catch (e) { isAllowed = false; }
            if (!isAllowed) {
                try { document.documentElement.style.display = "none"; } catch (e) {}
                try { window.location.replace("index.html"); } catch (e) { window.location.href = "index.html"; }
                return;
            }
            window.addEventListener("pageshow", function(evt) {
                if (evt.persisted) {
                    try { document.documentElement.style.display = "none"; } catch (e) {}
                    window.location.replace("index.html");
                }
            });
        })();
    </script>

    <script>
        (function() {
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
            document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
            document.addEventListener('selectstart', function(e) {
                var t = e.target;
                if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable || (t.closest && t.closest('[contenteditable="true"]')))) return true;
                e.preventDefault();
                return false;
            }, true);
            window.addEventListener('keydown', function(e) {
                var key = (e.key || '').toLowerCase();
                var code = e.keyCode || e.which;
                var ctrl = e.ctrlKey || e.metaKey;
                if (code === 123 || key === 'f12') { e.preventDefault(); e.stopPropagation(); return false; }
                if (ctrl && (e.shiftKey || e.altKey) && (key === 'i' || key === 'j' || key === 'c' || key === 'k' || key === 'u' || code === 73 || code === 74 || code === 67 || code === 85)) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
                if (ctrl && (key === 'u' || key === 's' || code === 85 || code === 83)) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
            }, true);
            try {
                if (window.history && typeof window.history.replaceState === 'function' && window.location.protocol !== 'file:') {
                    var cleanPath = window.location.pathname.replace(/\/?(indexdm|index1|index2|index)\.html.*$/i, '/');
                    if (cleanPath.charAt(0) !== '/') cleanPath = '/' + cleanPath;
                    window.history.replaceState(null, document.title, cleanPath);
                }
            } catch (err) {}
        })();
    </script>

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatDate(timestamp) {
            if (!timestamp) return "";
            var d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            if (isNaN(d.getTime())) return "";
            return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

            } else {

        // [PATCH v2.0: 기존 DB(mokjang_config/main) 패스코드 및 명단 100% 추출·병합기]
        function mergeMokjangConfigData(mainData, codeData, reqCode) {
            var b = Object.assign({}, mokjangConfig, mainData || {}, codeData || {});
            if (codeData && (!Array.isArray(codeData.members) || codeData.members.length <= 1) && mainData && Array.isArray(mainData.members) && mainData.members.length > 1) {
                b.members = mainData.members.slice();
            }
            var pCode = codeData && (codeData.adminPasscode || codeData.passcode || codeData.securityCode);
            var pMain = mainData && (mainData.adminPasscode || mainData.passcode || mainData.securityCode);
            b.adminPasscode = String((pCode && pCode !== "0000") ? pCode : (pMain || pCode || verifiedPass.adminPasscode || "0000")).trim();
            b.mokjangCode = String(reqCode || b.mokjangCode || activeMokjangCode || "1111").trim();
            b.mokjangName = String(b.mokjangName || verifiedPass.mokjangShort || "").trim().replace(/^세종꿈의교회\s*/, "");
            b.leaderName = String(b.leaderName || verifiedPass.leaderName || "목자").trim();
            b.subLeaderName = String(b.subLeaderName || b.subleaderName || "").trim();
            b.subLeaders = Array.isArray(b.subLeaders) ? b.subLeaders : [];
            b.members = (Array.isArray(b.members) && b.members.length > 0) ? b.members : [b.leaderName];
            b.memberJoinedAt = b.memberJoinedAt || {};
            return b;
        }

        function setSecurityGateUnlockedUI() {
            isDataUnlocked = true;
            var u = document.getElementById("security-unlocked-data-container");
            if (u) u.classList.remove("hidden");
        }

        window.triggerDataLookup = async function() {
            try {
                await signInAnonymously(auth);
                var mSnap = await getDoc(doc(db, "mokjang_config", "main")).catch(function(){return null;});
                var cSnap = await getDoc(doc(db, "mokjang_configs", activeMokjangCode)).catch(function(){return null;});
                var mData = (mSnap && mSnap.exists()) ? mSnap.data() : null;
                var cData = (cSnap && cSnap.exists()) ? cSnap.data() : null;
                if (mData && mData.mokjangCode && !cData) {
                    var mc = String(mData.mokjangCode).trim();
                    if (/^[0-9]{4}$/.test(mc) && mc !== activeMokjangCode) {
                        activeMokjangCode = mc;
                        var alt = await getDoc(doc(db, "mokjang_configs", activeMokjangCode)).catch(function(){return null;});
                        if (alt && alt.exists()) cData = alt.data();
                    }
                }
                var mCode = (mData && mData.mokjangCode) ? String(mData.mokjangCode).trim() : "1111";
                mokjangConfig = mergeMokjangConfigData((activeMokjangCode === mCode || !cData) ? mData : null, cData, activeMokjangCode);

                isDataUnlocked = true;
                renderAdminUI();

        function renderMembersList() {
            var listEl = document.getElementById("admin-member-list");
            var countEl = document.getElementById("member-count-text");
            if (!listEl) return;
            listEl.innerHTML = "";
            var leaderName = (mokjangConfig.leaderName || "목자").trim();
            var subPrimary = (mokjangConfig.subLeaderName || "").trim();
            var subList = Array.isArray(mokjangConfig.subLeaders) ? mokjangConfig.subLeaders.filter(Boolean) : [];
            if (subPrimary && subList.indexOf(subPrimary) === -1) subList.push(subPrimary);
            var rawMembers = Array.isArray(mokjangConfig.members) ? mokjangConfig.members : [];
            var combined = [leaderName].concat(subList).concat(rawMembers.filter(function(m) { return m && m !== "1111"; }));
            var allMembers = [];
            combined.forEach(function(item) { if (item && allMembers.indexOf(item) === -1) allMembers.push(item); });
            var joinedMap = mokjangConfig.memberJoinedAt || {};
            if (countEl) countEl.textContent = String(allMembers.length);

            allMembers.forEach(function(m) {
                var isLeader = (m === leaderName);
                var isSub = (!isLeader && subList.indexOf(m) !== -1);
                var row = document.createElement("div");
                row.className = "flex items-center justify-between px-2 py-1.5 rounded-xl bg-white border border-slate-200/80 text-xs whitespace-nowrap";

                var leftDiv = document.createElement("div");
                leftDiv.className = "flex items-center space-x-1.5 flex-1 min-w-0 pr-1";
                var badge = document.createElement("span");
                if (isLeader) {
                    badge.className = "px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[9.5px] font-extrabold shrink-0";
                    badge.textContent = "목자";
                } else if (isSub) {
                    badge.className = "px-1.5 py-0.5 rounded bg-sky-100 text-sky-800 text-[9.5px] font-extrabold shrink-0";
                    badge.textContent = "부목자";
                } else {
                    badge.className = "px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 text-[9.5px] font-bold shrink-0";
                    badge.textContent = "목원";
                }
                var nameSpan = document.createElement("span");
                nameSpan.className = "font-extrabold text-slate-800 text-[13px] whitespace-nowrap";
                nameSpan.textContent = m;
                leftDiv.appendChild(badge);
                leftDiv.appendChild(nameSpan);

                var rightDiv = document.createElement("div");
                rightDiv.className = "flex items-center space-x-1 shrink-0";
                var joinTs = Number(joinedMap[m] || 0);
                var dateLabel = isLeader ? "전체기간(고정)" : (joinTs > 0 ? new Date(joinTs).toISOString().split("T")[0] + " 이후" : "전체기간 열람");

                if (!isLeader) {
                    var dateBtn = document.createElement("button");
                    dateBtn.type = "button";
                    dateBtn.className = "px-1.5 py-0.5 rounded-lg bg-slate-50 border border-slate-200 text-[10px] font-bold text-slate-600 hover:border-emerald-400 hover:text-emerald-800 whitespace-nowrap";
                    dateBtn.textContent = "📅 " + dateLabel;
                    dateBtn.onclick = function() { window.changeMemberJoinDate(m); };

                    var delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.className = "w-5 h-5 rounded-full hover:bg-rose-100 text-slate-400 hover:text-rose-600 flex items-center justify-center shrink-0";
                    delBtn.innerHTML = "<i class=\"fa-solid fa-xmark\"></i>";
                    delBtn.onclick = function() { window.removeMokjangMemberByName(m); };

                    rightDiv.appendChild(dateBtn);
                    rightDiv.appendChild(delBtn);
                } else {
                    var fixedSpan = document.createElement("span");
                    fixedSpan.className = "text-[10px] text-amber-700 font-semibold whitespace-nowrap";
                    fixedSpan.textContent = dateLabel;
                    rightDiv.appendChild(fixedSpan);

                row.appendChild(leftDiv);
                row.appendChild(rightDiv);
                listEl.appendChild(row);

        window.changeMemberJoinDate = async function(memberName) {
            if (!mokjangConfig.memberJoinedAt) mokjangConfig.memberJoinedAt = {};
            var currentTs = Number(mokjangConfig.memberJoinedAt[memberName] || 0);
            var defaultStr = currentTs > 0 ? new Date(currentTs).toISOString().split("T")[0] : new Date().toISOString().split("T")[0];
            var input = prompt("[" + memberName + "] 님의 열람 시작 기준일을 입력하세요 (예: 2026-03-30).\n기존 전체 데이터를 다 보게 하려면 비워두고 확인을 누르세요.", defaultStr);
            if (input === null) return;
            var clean = input.trim();
            if (!clean) {
                delete mokjangConfig.memberJoinedAt[memberName];
                showToast(memberName + " 님이 전체 기간 열람으로 설정되었습니다.");
            } else {
                var parsed = new Date(clean + "T00:00:00");
                if (isNaN(parsed.getTime())) { showToast("YYYY-MM-DD 형식으로 입력해 주세요."); return; }
                mokjangConfig.memberJoinedAt[memberName] = parsed.getTime();
                showToast(memberName + " 님은 " + clean + " 이후 데이터만 열람합니다.");
            }
            await persistConfigToFirestore();
            renderMembersList();
        };

        async function persistConfigToFirestore() {
            mokjangConfig.updatedAt = Date.now();
            var codeKey = String(mokjangConfig.mokjangCode || activeMokjangCode || "1111").trim();
            mokjangConfig.mokjangCode = codeKey;
            var gatePassEl = document.getElementById("admin-passcode-gate-input");
            if (gatePassEl && mokjangConfig.adminPasscode) {
                gatePassEl.value = mokjangConfig.adminPasscode;
            }
            try {
                localStorage.setItem("mokjang_config_backup_" + codeKey, JSON.stringify(mokjangConfig));
                localStorage.setItem("mokjang_config_backup", JSON.stringify(mokjangConfig));
                localStorage.setItem("mokjang_active_code", codeKey);
                var cleanShort = String(mokjangConfig.mokjangName || "").trim().replace(/^세종꿈의교회\s*/, "");
                localStorage.setItem("mokjang_short_name", cleanShort);
                localStorage.setItem("mokjang_name", cleanShort ? ("세종꿈의교회 " + cleanShort) : "세종꿈의교회");
            } catch (e) {}
            try {
                await setDoc(doc(db, "mokjang_configs", codeKey), Object.assign({}, mokjangConfig), { merge: true });
                await setDoc(doc(db, "mokjang_config", "main"), Object.assign({}, mokjangConfig), { merge: true });
            } catch (e) {
                console.warn("Firestore 설정 저장 오류:", e);
            }
        }

        window.saveMokjangConfigToFirestore = async function() {
            if (!isDataUnlocked) return;
            var newName = document.getElementById("admin-mokjang-name-input").value.trim().replace(/^세종꿈의교회\s*/, "");
            var newCode = document.getElementById("admin-mokjang-code-input").value.trim() || "1111";
            var newLeader = document.getElementById("admin-leader-name-input").value.trim() || "목자";
            var newSub = document.getElementById("admin-subleader-name-input").value.trim();
            var newPass = document.getElementById("admin-passcode-setting-input").value.trim() || "0000";
            if (!/^[0-9]{4}$/.test(newCode) || !/^[0-9]{4}$/.test(newPass)) {
                showToast("목장코드와 패스코드는 숫자 4자리여야 합니다.");
                return;
            }
            mokjangConfig.mokjangName = newName;
            mokjangConfig.mokjangCode = newCode;
            mokjangConfig.leaderName = newLeader;
            mokjangConfig.subLeaderName = newSub;
            mokjangConfig.adminPasscode = newPass;
            activeMokjangCode = newCode;
            if (!Array.isArray(mokjangConfig.members)) mokjangConfig.members = [];
            if (mokjangConfig.members.indexOf(newLeader) === -1) mokjangConfig.members.unshift(newLeader);
            if (newSub && mokjangConfig.members.indexOf(newSub) === -1) mokjangConfig.members.push(newSub);
            await persistConfigToFirestore();
            renderAdminUI();
            showToast("우리 목장 설정이 저장되었습니다.");
        };

        window.addMokjangMember = async function() {
            if (!isDataUnlocked) return;
            var nameInput = document.getElementById("new-member-name-input");
            var roleSelect = document.getElementById("new-member-role-select");
            var checked = document.querySelector("input[name=\"new-member-access-mode\"]:checked");
            var accessMode = checked ? checked.value : "all";
            var dateInput = document.getElementById("new-member-join-date");
            var name = nameInput.value.trim();
            if (!name || name.length < 2) { showToast("이름을 2자 이상 입력해 주세요."); return; }
            if (!Array.isArray(mokjangConfig.members)) mokjangConfig.members = [];
            if (!Array.isArray(mokjangConfig.subLeaders)) mokjangConfig.subLeaders = [];
            if (!mokjangConfig.memberJoinedAt) mokjangConfig.memberJoinedAt = {};
            if (mokjangConfig.members.indexOf(name) === -1) mokjangConfig.members.push(name);
            if (roleSelect.value === "subleader" && mokjangConfig.subLeaders.indexOf(name) === -1) {
                mokjangConfig.subLeaders.push(name);
                if (!mokjangConfig.subLeaderName) mokjangConfig.subLeaderName = name;
            }
            if (accessMode === "from_date" && dateInput && dateInput.value) {
                mokjangConfig.memberJoinedAt[name] = new Date(dateInput.value + "T00:00:00").getTime();
            } else {
                delete mokjangConfig.memberJoinedAt[name];
            }
            nameInput.value = "";
            await persistConfigToFirestore();
            renderMembersList();
            showToast(name + " 님이 등록되었습니다.");
        };

        window.removeMokjangMemberByName = async function(targetName) {
            if (!isDataUnlocked) return;
            mokjangConfig.members = (mokjangConfig.members || []).filter(function(m) { return m !== targetName; });
            mokjangConfig.subLeaders = (mokjangConfig.subLeaders || []).filter(function(s) { return s !== targetName; });

            if (mokjangConfig.memberJoinedAt) delete mokjangConfig.memberJoinedAt[targetName];

        };

        var exportLibsPromise = null;
        function ensurePdfLibs() {
            if (window.html2canvas && window.jspdf) return Promise.resolve();
            if (exportLibsPromise) return exportLibsPromise;
            var load = function(src) {
                return new Promise(function(res, rej) {
                    var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
                });
            };
            exportLibsPromise = Promise.all([
                load("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
                load("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
            ]);
            return exportLibsPromise;
        }

        function getFilteredPostsForCurrentMokjang() {
            return cachedMokjangPosts.filter(function(p) {
                var pCode = p.mokjangCode ? String(p.mokjangCode).trim() : "1111";
                return pCode === activeMokjangCode || (activeMokjangCode === "1111" && !p.mokjangCode);
            }).sort(function(a, b) {
                var tA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : new Date(a.createdAt || 0).getTime();
                var tB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : new Date(b.createdAt || 0).getTime();
                return tB - tA;
            });
        }

        function buildPdfCardHtml(post) {
            if (!post) return "";
            var imgs = Array.isArray(post.images) ? post.images.filter(Boolean) : (post.imageUrl ? [post.imageUrl] : []);
            var comments = Array.isArray(post.comments) ? post.comments : [];
            var captions = post.photoCaptions || {};
            var photosHtml = "";
            if (imgs.length > 0) {
                photosHtml = "<div class=\"grid grid-cols-2 gap-1.5 mt-1.5\">" + imgs.map(function(u, i) {
                    var rawCap = captions[i] !== undefined ? captions[i] : captions[String(i)];
                    var capText = typeof rawCap === "object" ? (rawCap && rawCap.text ? rawCap.text : "") : (rawCap || "");
                    var capAuthor = typeof rawCap === "object" ? (rawCap && rawCap.author ? rawCap.author : (post.author || "")) : (post.author || "");
                    var spanClass = (imgs.length === 1 || (imgs.length % 2 === 1 && i === imgs.length - 1)) ? "col-span-2" : "col-span-1";
                    return "<div class=\"" + spanClass + " border border-gray-100 rounded-xl overflow-hidden bg-gray-50\">" +
                        "<img src=\"" + u + "\" crossOrigin=\"anonymous\" class=\"w-full max-h-[180px] object-cover block mx-auto\">" +
                        (capText ? "<div class=\"px-1.5 py-1 text-[10px] text-gray-700 bg-white border-t border-gray-100\"><b>" + escapeHtml(capAuthor) + " :</b> " + escapeHtml(capText) + "</div>" : "") +
                        "</div>";
                }).join("") + "</div>";
            }
            var commentsHtml = "";
            if (comments.length > 0) {
                commentsHtml = "<div class=\"mt-2 bg-gray-50/90 rounded-xl p-2 border border-gray-100 space-y-1\">" +
                    "<div class=\"text-[10px] font-bold text-emerald-800\">목장 댓글 (" + comments.length + ")</div>" +
                    comments.map(function(c) { return "<div class=\"text-[10px] leading-snug\"><b>" + escapeHtml(c.author) + " :</b> " + escapeHtml(c.text) + " <span class=\"text-[8.5px] text-gray-400\">" + escapeHtml(c.time || "") + "</span></div>"; }).join("") +
                    "</div>";
            }
            return "<div class=\"w-full bg-white rounded-2xl border border-gray-200 p-3 text-left flex flex-col justify-between h-full shadow-2xs\">" +
                "<div><div class=\"flex items-center justify-between pb-1.5 mb-1.5 border-b border-gray-100\">" +
                "<span class=\"text-xs font-extrabold text-gray-800\">" + escapeHtml(post.author || "목장가족") + "</span>" +
                "<span class=\"text-[9.5px] text-gray-400\">" + formatDate(post.createdAt) + "</span></div>" +
                (post.content ? "<div class=\"text-xs text-gray-800 leading-relaxed whitespace-pre-wrap mb-1.5\">" + post.content + "</div>" : "") +
                "</div><div class=\"mt-auto\">" + photosHtml + commentsHtml + "</div></div>";
        }

        function renderAllPdfPreviewContent() {

        async function generatePdfBlob() {
            if (generatedAllPdfBlob) return generatedAllPdfBlob;
            await ensurePdfLibs();
            var statusBox = document.getElementById("all-pdf-status-container");
            var statusDesc = document.getElementById("all-pdf-status-desc");
            statusBox.classList.remove("hidden");
            statusDesc.textContent = "고품질 PDF 문서를 생성 중입니다...";
            var jsPDF = window.jspdf.jsPDF;
            var posts = getFilteredPostsForCurrentMokjang();
            var titleName = mokjangConfig.mokjangName ? ("세종꿈의교회 " + mokjangConfig.mokjangName) : "세종꿈의교회 꿈의 목장";

            if (currentAllPdfMode === "landscape") {
                var pdf = new jsPDF("l", "mm", "a4");
                var pageCount = Math.max(1, Math.ceil(posts.length / 2));
                for (var p = 0; p < pageCount; p++) {
                    if (p > 0) pdf.addPage();
                    var temp = document.createElement("div");
                    temp.style.cssText = "position:fixed;left:-9999px;top:0;width:1120px;background:#fff;padding:16px;";
                    temp.innerHTML = "<div class=\"flex justify-between pb-2 mb-3 border-b-2 border-emerald-800\"><h2 class=\"text-base font-bold\">" + escapeHtml(titleName) + "</h2><span class=\"text-xs font-mono\">" + (p + 1) + " / " + pageCount + "</span></div><div class=\"grid grid-cols-2 gap-4\"><div>" + buildPdfCardHtml(posts[p * 2]) + "</div><div>" + (posts[p * 2 + 1] ? buildPdfCardHtml(posts[p * 2 + 1]) : "") + "</div></div>";
                    document.body.appendChild(temp);
                    var canvas = await html2canvas(temp, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
                    temp.remove();
                    var w = 285, h = Math.min(198, (canvas.height * w) / canvas.width);
                    pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 6, 6, w, h);
                }
                generatedAllPdfFileName = "목장이야기_" + activeMokjangCode + "_가로백업.pdf";
                generatedAllPdfBlob = pdf.output("blob");
            } else {
                var pdfP = new jsPDF("p", "mm", "a4");
                var curY = 8;
                for (var i = 0; i < posts.length; i++) {
                    var tempP = document.createElement("div");
                    tempP.style.cssText = "position:fixed;left:-9999px;top:0;width:720px;background:#fff;padding:10px;";
                    tempP.innerHTML = buildPdfCardHtml(posts[i]);
                    document.body.appendChild(tempP);
                    var canvasP = await html2canvas(tempP, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
                    tempP.remove();
                    var wP = 194, hP = Math.min(275, (canvasP.height * wP) / canvasP.width);
                    if (curY + hP > 287 && i > 0) { pdfP.addPage(); curY = 8; }
                    pdfP.addImage(canvasP.toDataURL("image/jpeg", 0.92), "JPEG", 8, curY, wP, hP);
                    curY += hP + 4;
                }
                generatedAllPdfFileName = "목장이야기_" + activeMokjangCode + "_세로백업.pdf";
                generatedAllPdfBlob = pdfP.output("blob");
            }
            statusDesc.textContent = "PDF 생성이 완료되었습니다!";
            return generatedAllPdfBlob;
        }

        window.executeConfirmedAllPdfSave = async function() {
            var blob = await generatePdfBlob();
            if (!blob) return;
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a"); a.href = url; a.download = generatedAllPdfFileName; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            showToast("PDF 파일이 저장되었습니다.");
        };

        window.handleAllPdfShareClick = async function() {
            var blob = await generatePdfBlob();
            if (!blob) return;
            var file = new File([blob], generatedAllPdfFileName, { type: "application/pdf" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: "목장 이야기 PDF 백업" }); return; } catch (e) {}
            }
            window.executeConfirmedAllPdfSave();
        };

        window.handleAllPdfPrint = function() {
            var printArea = document.getElementById("print-area");
            printArea.innerHTML = document.getElementById("all-pdf-continuous-container").innerHTML;
            printArea.classList.remove("hidden");
            window.print();
            setTimeout(function() { printArea.classList.add("hidden"); printArea.innerHTML = ""; }, 500);
        };

        (async function initDmPage() {
            try {
                var localRaw = localStorage.getItem("mokjang_config_backup_" + activeMokjangCode) || localStorage.getItem("mokjang_config_backup");
                if (localRaw) {
                    var parsedLocal = JSON.parse(localRaw);
                    if (parsedLocal && typeof parsedLocal === "object") {
                        mokjangConfig = mergeMokjangConfigData(parsedLocal, parsedLocal, parsedLocal.mokjangCode || activeMokjangCode);
                        activeMokjangCode = mokjangConfig.mokjangCode || activeMokjangCode;
                    }
                }
            } catch (e) {}

            setSecurityGateUnlockedUI();
            renderAdminUI();

            try {
                await signInAnonymously(auth);
                await window.triggerDataLookup(true);

                onSnapshot(doc(db, "mokjang_config", "main"), function(snap) {
                    if (snap.exists()) {
                        var data = snap.data();
                        var docCode = String(data.mokjangCode || "1111").trim();
                        if (docCode === activeMokjangCode || activeMokjangCode === "1111") {
                            mokjangConfig = mergeMokjangConfigData(data, mokjangConfig, docCode);
                            activeMokjangCode = mokjangConfig.mokjangCode;
                            renderAdminUI();
                        }
                    }
                });

                onSnapshot(collection(db, "mokjang_posts"), function(snap) {
                    var arr = [];
                    snap.forEach(function(d) { arr.push(Object.assign({ id: d.id }, d.data())); });
                    cachedMokjangPosts = arr;
                });
            } catch (e) {
                console.warn("initDmPage 초기화 경고:", e);
            }
        })();
    </script>
</body>
</html>
