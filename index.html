<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 꿈의 목장</title>
    <!-- [모바일 속도 최적화: 외부 리소스 사전 연결 & DNS 프리페치] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B5D50'/%3E%3Cpath d='M16 7v18M10 13h12' stroke='%23ffffff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3B5D50">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%; height: 100%; max-width: 100%; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #0b0718; color: #222222;
            -webkit-tap-highlight-color: transparent; touch-action: pan-y;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        header { padding-top: max(env(safe-area-inset-top, 0px), 0px); }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes dreamShimmerSlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .dream-shimmer-text {
            background: linear-gradient(90deg, #111827 0%, #1f2937 32%, #ffffff 50%, #1f2937 68%, #111827 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: dreamShimmerSlow 7s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes swayWelcome {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-2deg) translateY(-0.5px); }
            75% { transform: rotate(2deg) translateY(0.5px); }
        }
        .animate-sway-welcome { display: inline-block; animation: swayWelcome 3.5s ease-in-out infinite; transform-origin: center center; }

        /* [IMG_1042.png 원본 이미지 100% 반영 및 십자가/목장 위치 기준 핀치 스플릿 게이트] */
        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background-color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none; transition: opacity 0.5s ease;
        }

        .gate-img-layer {
            position: absolute; inset: 0;
            /* 대문자, 소문자, 확장자 대문자까지 모두 알아서 찾도록 다중 적용! (가짜 회색 이미지 삭제) */
            background-image: url('IMG_1042.png'), url('img_1042.png'), url('IMG_1042.PNG'), url('img_1042.PNG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #gate-top { clip-path: inset(0 0 35% 0); }
        #gate-bottom { clip-path: inset(65% 0 0 0); }

        /* 십자가와 '꿈의 목장' 사이 갈라진 틈에 나타나는 아담한 로그인 박스 (테두리 및 배경 삭제) */
        #code-auth-box {
            position: absolute; left: 50%; top: 65%;
            transform: translate(-50%, -50%) scale(0.85);
            z-index: 30; opacity: 0; pointer-events: none;
            display: flex; gap: 8px; align-items: center; justify-content: center;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #feed-container { -webkit-overflow-scrolling: touch; overflow-y: auto; scrollbar-width: thin; }
        #feed-container::-webkit-scrollbar { width: 4px; }
        #feed-container::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.15); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [제스처 인증 게이트 (원본 단독 노출 + 십자가/목장 핀치 스플릿)] -->
    <div id="auth-gate">
        <!-- 상단 이미지 반쪽 (십자가 포함) -->
        <div class="gate-img-layer" id="gate-top"></div>
        <!-- 하단 이미지 반쪽 (꿈의 목장 포함) -->
        <div class="gate-img-layer" id="gate-bottom"></div>

        <!-- 갈라진 사이에 나타나는 텍스트 없는 미니 가로 로그인 창 -->
        <div id="code-auth-box">
            <input type="text" id="input-mokjang-code" oninput="checkAutoLogin()" placeholder="코드" maxlength="6" class="w-[65px] px-2 py-1.5 rounded-full bg-white border border-dashed border-gray-400 text-center text-gray-900 focus:outline-none text-[13px] font-bold">
            <input type="text" id="input-member-name" oninput="checkAutoLogin()" placeholder="이름" maxlength="6" class="w-[65px] px-2 py-1.5 rounded-full bg-white border border-dashed border-gray-400 text-center text-gray-900 focus:outline-none text-[13px] font-bold">
        </div>
    </div>

    <!-- [상단 헤더] -->
    <header class="h-[52px] shrink-0 bg-white border-b church-border shadow-2xs px-4 flex items-center justify-between w-full z-30 relative max-w-md mx-auto">
        <div class="w-8 shrink-0 flex items-center justify-start"></div>
        <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center">
            <h1 class="text-[17.5px] font-black tracking-tight leading-tight truncate whitespace-nowrap dream-shimmer-text" id="header-mokjang-title">
                세종꿈의교회 23목장
            </h1>
            <p class="text-[10px] text-gray-500 font-medium truncate whitespace-nowrap leading-none mt-0.5 animate-sway-welcome select-none" id="header-user-display">목장 가족님 환영합니다</p>
        </div>
        <div class="shrink-0 relative flex items-center justify-end w-8">
            <button onclick="openHelpModal()" class="w-7 h-7 rounded-full flex items-center justify-center church-accent church-primary-text border border-emerald-200/80 shadow-2xs text-xs font-bold" title="도움말">
                <i class="fa-solid fa-question text-xs"></i>
            </button>
        </div>
    </header>

    <!-- [메인 피드 영역] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-0.5" id="feed-container">
        <div class="w-full px-2 pt-4 pb-2 text-center space-y-2">
            <div class="bg-white rounded-2xl border church-border p-4 shadow-2xs">
                <h3 class="text-sm font-bold text-gray-800">🌿 꿈의 목장 피드</h3>
                <p class="text-xs text-gray-500 mt-1">로그인이 완료되었습니다. 따뜻한 이야기를 나눠보세요.</p>
            </div>
        </div>
    </main>

    <script>
        const authGate = document.getElementById('auth-gate');
        const gateTop = document.getElementById('gate-top');
        const gateBottom = document.getElementById('gate-bottom');
        const codeAuthBox = document.getElementById('code-auth-box');

        let initialPinchDist = 0;
        let currentProgress = 0;
        let isSuccessfullyOpen = false;

        authGate.addEventListener('touchstart', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        authGate.addEventListener('touchmove', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length === 2 && initialPinchDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = currentDist - initialPinchDist;
                currentProgress = Math.max(0, Math.min(1, diff / 120));
                updateGateTransform(currentProgress);
            }
        });

        authGate.addEventListener('touchend', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length < 2 && initialPinchDist > 0) {
                initialPinchDist = 0;
                if (currentProgress < 0.42) {
                    animateSnapBack();
                } else {
                    animateFullyOpen();
                }
            }
        });

        function updateGateTransform(progress) {
            const maxSplitPx = 35; // 딱 코드/이름 창 높이 정도만 살짝 벌어지게 수정
            const translateY = progress * maxSplitPx;

            gateTop.style.transform = `translateY(-${translateY}px)`;
            gateBottom.style.transform = `translateY(${translateY}px)`;

            codeAuthBox.style.opacity = progress;
            codeAuthBox.style.transform = `translate(-50%, -50%) scale(${0.85 + 0.15 * progress})`;
        }

        function animateSnapBack() {
            gateTop.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
            gateBottom.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
            codeAuthBox.style.transition = 'opacity 0.25s ease, transform 0.25s ease';

            currentProgress = 0;
            updateGateTransform(0);

            setTimeout(() => {
                gateTop.style.transition = 'none';
                gateBottom.style.transition = 'none';
                codeAuthBox.style.transition = 'none';
            }, 350);
        }

        function animateFullyOpen() {
            isSuccessfullyOpen = true;
            gateTop.style.transition = 'transform 0.4s ease';
            gateBottom.style.transition = 'transform 0.4s ease';
            codeAuthBox.style.transition = 'all 0.4s ease';

            const maxSplitPx = 35; // 딱 코드/이름 창 높이 정도만 살짝 벌어지게 수정
            gateTop.style.transform = `translateY(-${maxSplitPx}px)`;
            gateBottom.style.transform = `translateY(${maxSplitPx}px)`;
            codeAuthBox.style.opacity = '1';
            codeAuthBox.style.transform = 'translate(-50%, -50%) scale(1)';
            
            setTimeout(() => {
                const codeInput = document.getElementById('input-mokjang-code');
                if (codeInput) codeInput.focus();
            }, 300);
        }

        function checkAutoLogin() {
            const code = document.getElementById('input-mokjang-code').value.trim();
            const name = document.getElementById('input-member-name').value.trim();
            
            // 코드 및 이름이 각각 2글자 이상 입력되면 입장 버튼 없이 자동으로 입장
            if (code.length >= 2 && name.length >= 2) {
                handleMemberLogin(name);
            }
        }

        function handleMemberLogin(userName) {
            authGate.style.opacity = '0';
            setTimeout(() => {
                authGate.style.display = 'none';
            }, 500);

            const displayEl = document.getElementById('header-user-display');
            if (displayEl) {
                const finalName = userName || document.getElementById('input-member-name').value.trim();
                displayEl.innerHTML = `${escapeHtml(finalName)}님 <span class="text-emerald-500 font-semibold">환영합니다</span>`;
            }
        }

        function openHelpModal() {
            // 도움말 기능 (필요시 모달로 연동, 현재는 무응답 처리하여 alert 방지)
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
