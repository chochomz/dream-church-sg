<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas & jsPDF CDN (이미지 및 PDF 한 장 저장/인쇄용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Pretendard 웹폰트 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #222222;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        /* 피드 스크롤 최적화 */
        #feed-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #feed-container::-webkit-scrollbar {
            width: 4px;
        }
        #feed-container::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* 모달 터치 제어 */
        #lightbox-modal, #write-modal, #confirm-modal, #save-confirm-modal, #edit-confirm-modal, #comments-popup-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }

        /* 사진 뷰어 이미지 변환 및 두꺼운 흰색 테두리 */
        #lightbox-img {
            transition: transform 0.15s ease-out, filter 0.25s ease-in-out;
            transform-origin: center center;
            border: 3.5px solid #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        /* 사진 통합 컨테이너: 상하 여백 극단적 밀착 */
        .continuous-photo-container {
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            margin-top: 1px;
            margin-bottom: 1px;
        }
        .continuous-photo-item {
            width: 100%;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .continuous-photo-item:active {
            opacity: 0.92;
        }
        
        /* 사진 사이 구분선 */
        .photo-block-item:not(:last-child) {
            border-bottom: 1px solid #E5E7EB;
        }

        /* 사진별 연필 캡션 텍스트: 위 사진에 바짝 밀착 */
        .photo-caption-text {
            font-size: 13.5px;
            line-height: 1.4;
            color: #374151;
            padding: 2px 6px 2px 6px;
            margin-bottom: 4px;
            background: transparent;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* 오른쪽 상단 연한 연두색 슬라이드 메뉴 애니메이션 */
        .slide-menu-container {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: right center;
        }
        .menu-closed {
            opacity: 0;
            transform: translateX(12px) scale(0.92);
            pointer-events: none;
        }
        .menu-open {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        /* 인쇄 전용 스타일: 해당 포스트 외 숨김 처리 */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
                background: white;
            }
            .no-print, .no-export {
                display: none !important;
            }
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <header class="h-[48px] shrink-0 bg-white border-b church-border shadow-2xs px-3 flex items-center justify-between w-full z-30">
        <div class="flex items-center space-x-2 overflow-hidden">
            <div class="w-7 h-7 church-primary rounded-full flex items-center justify-center p-0.5 shadow-xs border border-emerald-100 overflow-hidden bg-white shrink-0">
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                    <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                    <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                    <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                    <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                </svg>
            </div>
            <div class="overflow-hidden leading-tight">
                <h1 class="text-xs font-bold text-gray-800 truncate whitespace-nowrap" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                <p class="text-[10px] text-gray-500 truncate whitespace-nowrap" id="header-user-display">목장가족 님 환영합니다</p>
            </div>
        </div>
        
        <div class="shrink-0 flex items-center space-x-2">
            <!-- 클라우드 연동 램프 -->
            <button type="button" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors focus:outline-none" title="서버 연동 상태">
                <span id="db-status-lamp" class="w-2.5 h-2.5 rounded-full bg-emerald-400 transition-all inline-block"></span>
            </button>
            <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-semibold flex items-center space-x-1.5 shadow-2xs hover:bg-emerald-100/70 active:scale-95 transition-all">
                <i class="fa-solid fa-camera text-[11px]"></i>
                <span>글쓰기</span>
            </button>
        </div>
    </header>

    <!-- [피드 메인 컨테이너] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-0.5" id="feed-container">
        <!-- 게시글 목록이 실시간으로 동적 렌더링됩니다 -->
    </main>

    <!-- [인쇄 전용 숨김 컨테이너] -->
    <div id="print-area" class="hidden"></div>

    <!-- [댓글 전용 팝업 스크린 모달] -->
    <div id="comments-popup-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex flex-col justify-end hidden">
        <div class="bg-white rounded-t-2xl w-full max-w-md mx-auto max-h-[75vh] flex flex-col shadow-2xl border-t church-border overflow-hidden">
            <div class="flex items-center justify-between px-3.5 py-3 border-b church-border shrink-0 bg-gray-50/80">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-regular fa-comment-dots church-primary-text text-sm"></i>
                    <h3 class="text-xs font-bold text-gray-800">댓글 <span id="comments-modal-count" class="text-emerald-700 font-semibold">0</span></h3>
                </div>
                <button onclick="closeCommentsModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-200 text-xs">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- 댓글 목록 스크롤 -->
            <div id="comments-modal-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs"></div>

            <!-- 하단 작성 인풋 -->
            <div class="p-2.5 border-t church-border bg-white shrink-0 flex items-center space-x-1.5">
                <input type="text" id="comments-modal-input" maxlength="200" placeholder="댓글을 입력하세요..." 
                       onkeydown="if(event.key==='Enter') addCommentFromModal()" 
                       class="flex-1 px-3 py-2 text-xs bg-gray-50 border church-border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                <button onclick="addCommentFromModal()" class="px-3.5 py-2 church-primary text-white text-xs font-semibold rounded-lg whitespace-nowrap shadow-2xs active:scale-95 transition-transform">
                    등록
                </button>
            </div>
        </div>
    </div>

    <!-- [글쓰기 / 수정 모달: 사진등록 문구 제거, 0/5장 상단 밀착, 바깥 실선 제거, +버튼 확대, 내용 테두리 단일화] -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl border church-border max-h-[88vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between pb-2 border-b church-border shrink-0">
                <h3 class="text-sm font-bold text-gray-800" id="modal-title-text"><i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <div class="space-y-2.5 flex-1 overflow-y-auto pt-2 px-0.5">
                <input type="hidden" id="editing-post-id" value="">
                
                <!-- 사진 첨부 영역: "사진 등록 (최대 5장)" 문구 삭제, 0/5장은 위로 바짝 밀착 -->
                <div class="space-y-1">
                    <div class="flex justify-end items-center text-[11px] leading-none pt-0.5">
                        <span id="image-count-indicator" class="text-gray-400 font-medium">0 / 5장</span>
                    </div>

                    <!-- 숨김 파일 인풋 -->
                    <input type="file" id="post-multi-file-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">

                    <!-- 사진 썸네일 & '+' 추가 버튼: 배경 바깥쪽 실선 제거, + 버튼 크기 확대 -->
                    <div id="selected-images-grid" class="flex flex-wrap items-center justify-center gap-2 py-1.5 bg-gray-50/60 rounded-xl border-0 min-h-[76px]"></div>
                </div>

                <!-- 내용 입력 영역: 테두리 밑에 겹치는 실선 제거 -->
                <div class="w-full pt-1" id="post-content-container">
                    <div class="flex justify-between items-center mb-1 text-[11px]">
                        <span class="font-medium text-gray-700">내용 입력</span>
                        <span id="char-count-indicator" class="text-gray-400">0 / 200자</span>
                    </div>
                    <textarea id="post-content" rows="3" maxlength="200" oninput="updateCharCount(this)" placeholder="목장 가족들과 나눌 따뜻한 이야기를 입력하세요..." 
                              class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:border-[#3B5D50] focus:ring-1 focus:ring-[#3B5D50] focus:outline-none resize-none bg-white block transition-all shadow-2xs"></textarea>
                </div>
            </div>

            <!-- 하단 고정 등록/수정 버튼 -->
            <div class="pt-2 border-t church-border shrink-0 flex justify-center">
                <button type="button" onclick="requestSavePost()" class="px-6 py-2.5 church-primary text-white rounded-xl font-semibold text-xs shadow-md active:scale-95 transition-all inline-flex items-center space-x-1.5" id="submit-btn-text">
                    <i class="fa-solid fa-check"></i>
                    <span>등록하기</span>
                </button>
            </div>
        </div>
    </div>

    <!-- [저장 확인 모달] -->
    <div id="save-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 저장</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">이 이야기를 목장 피드에 올리시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeSaveConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button onclick="executeSubmitPost()" class="py-2 church-primary text-white rounded-lg text-xs font-semibold">저장하기</button>
            </div>
        </div>
    </div>

    <!-- [수정 확인 모달: 고정 레이아웃] -->
    <div id="edit-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 수정</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">이 이야기를 수정하시겠습니까?</p>
            </div>
            <!-- 고정 요약 카드 -->
            <div id="edit-summary-card" class="bg-gray-50 rounded-lg p-2.5 text-left border border-gray-100 max-h-24 overflow-y-auto text-xs text-gray-600">
                <p id="edit-preview-text" class="line-clamp-2 text-[11px] text-gray-700"></p>
                <div id="edit-preview-thumbs" class="flex items-center space-x-1.5 mt-1.5 overflow-hidden"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeEditConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button id="edit-confirm-yes-btn" class="py-2 church-primary text-white rounded-lg text-xs font-semibold">수정하기</button>
            </div>
        </div>
    </div>

    <!-- [삭제 확인 모달: 고정 레이아웃] -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 삭제</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">정말 이 이야기를 삭제하시겠습니까?</p>
            </div>
            <!-- 고정 요약 카드 -->
            <div id="delete-summary-card" class="bg-gray-50 rounded-lg p-2.5 text-left border border-gray-100 max-h-24 overflow-y-auto text-xs text-gray-600">
                <p id="delete-preview-text" class="line-clamp-2 text-[11px] text-gray-700"></p>
                <div id="delete-preview-thumbs" class="flex items-center space-x-1.5 mt-1.5 overflow-hidden"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button id="confirm-yes-btn" class="py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-semibold">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- [라이트박스 모달: 자동조정(밝기/명도), 90도 회전, 각도/보정 저장, 흰색 테두리, 안전 줌, 좌우 사진 슬라이드] -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-between hidden p-2 select-none">
        <!-- 상단 고정 헤더 & 도구 모음 (상부 닫기 X 버튼이 이미지에 가려지지 않음) -->
        <div class="w-full flex items-center justify-between p-2 z-50 bg-black/40 backdrop-blur-xs rounded-xl">
            <span class="text-white/80 text-xs px-2 font-medium" id="lightbox-counter">1 / 1</span>
            <div class="flex items-center space-x-1.5">
                <!-- 자동 조정 버튼 (아이폰 스타일) -->
                <button type="button" id="lightbox-autofix-btn" onclick="toggleLightboxAutoFix()" class="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 active:scale-95 text-white rounded-lg text-xs font-medium flex items-center space-x-1 transition-all" title="밝기/명도/대비 자동 최적화">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                    <span>자동 조정</span>
                </button>
                <!-- 90도 회전 버튼 -->
                <button type="button" onclick="rotateLightboxImage()" class="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 active:scale-95 text-white rounded-lg text-xs font-medium flex items-center space-x-1 transition-all">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>90° 회전</span>
                </button>
                <!-- 각도 및 보정 저장 버튼 -->
                <button type="button" onclick="saveRotatedImagePermanent()" class="px-2.5 py-1.5 church-primary active:scale-95 text-white rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-md transition-all">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>저장</span>
                </button>
                <!-- 상부 닫기 X 버튼 -->
                <button onclick="closeLightbox()" class="w-7 h-7 flex items-center justify-center rounded-full bg-white/20 text-white text-sm hover:bg-white/30 transition-all ml-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- 이미지 뷰포트 (확대 시 화면을 벗어나지 않도록 overflow-hidden 적용, 좌우 스와이프 제어) -->
        <div id="lightbox-viewport" class="overflow-hidden w-full flex-1 flex items-center justify-center relative touch-none my-1">
            <!-- 좌측 슬라이드 버튼 (사진 2장 이상 시) -->
            <button type="button" id="lightbox-prev-btn" onclick="slideLightboxPrev(event)" class="absolute left-2 z-40 w-9 h-9 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center transition-all opacity-80 hover:opacity-100 hidden">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>

            <!-- 사진 엘리먼트 (약간 두꺼운 흰색 테두리 적용) -->
            <div id="lightbox-img-wrapper" class="relative max-w-[92vw] max-h-[75vh] flex items-center justify-center">
                <img id="lightbox-img" src="" alt="확대 사진" class="max-w-full max-h-[75vh] object-contain select-none pointer-events-auto">
            </div>

            <!-- 우측 슬라이드 버튼 (사진 2장 이상 시) -->
            <button type="button" id="lightbox-next-btn" onclick="slideLightboxNext(event)" class="absolute right-2 z-40 w-9 h-9 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center transition-all opacity-80 hover:opacity-100 hidden">
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>
        </div>

        <!-- 하단 확대/축소 및 슬라이드 안내 가이드바 -->
        <div class="w-full py-1.5 px-2 flex items-center justify-between text-white/60 text-[10.5px] z-50 bg-black/40 backdrop-blur-xs rounded-xl">
            <div class="flex items-center space-x-2">
                <button type="button" onclick="zoomLightbox(-0.25)" class="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-white flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
                <span id="lightbox-zoom-level" class="text-white/80 font-mono text-[11px]">100%</span>
                <button type="button" onclick="zoomLightbox(0.25)" class="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-white flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
                <button type="button" onclick="resetLightboxZoom()" class="px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-white text-[10px]">초기화</button>
            </div>
            <span class="truncate ml-2 text-right">좌우 슬라이드로 사진 넘김 • 핀치/버튼 확대</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

            storageBucket: "dream-data-146a4.firebasestorage.app",

        function processImageFile(file, callback) {
            if (!file) return callback(null);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 640;

                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressed = canvas.toDataURL('image/jpeg', 0.6);
                        callback(compressed);
                    } catch (err) {
                        console.warn("Canvas 압축 대체:", err);
                        callback(e.target.result);
                    }
                };
                img.onerror = () => callback(e.target.result);
                img.src = e.target.result;
            };
            reader.onerror = () => callback(null);
            reader.readAsDataURL(file);
        }

        window.triggerFilePicker = function() {
            if (selectedImagesList.length >= 5) {
                showNotification('사진은 최대 5장까지 선택 가능합니다.');
                return;
            }
            document.getElementById('post-multi-file-input').click();
        };

        window.handleFilesSelect = function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remaining = 5 - selectedImagesList.length;
            if (remaining <= 0) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            const toProcess = Array.from(files).slice(0, remaining);
            let done = 0;
            toProcess.forEach(file => {
                processImageFile(file, (result) => {
                    if (result) selectedImagesList.push(result);
                    done++;
                    if (done === toProcess.length) {
                        renderImagePreviews();
                        showNotification(`사진 ${done}장이 등록되었습니다.`);
                    }
                });
            });
            event.target.value = '';
        };

        window.removeSelectedImage = function(idx) {
            selectedImagesList.splice(idx, 1);
            renderImagePreviews();
        };

            const grid = document.getElementById('selected-images-grid');
            const ind = document.getElementById('image-count-indicator');
            grid.innerHTML = "";
            ind.innerText = `${selectedImagesList.length} / 5장`;

            selectedImagesList.forEach((src, idx) => {

            // '+' 추가 버튼 크기를 조금 더 크게 (w-16 h-16) 시인성 강화
            if (selectedImagesList.length < 5) {
                const addBtn = document.createElement('button');
                addBtn.type = "button";
                addBtn.onclick = triggerFilePicker;
                addBtn.className = "w-16 h-16 border-2 border-dashed border-[#3B5D50]/50 rounded-xl flex flex-col items-center justify-center text-gray-500 hover:bg-emerald-50 active:scale-95 transition-all bg-white shrink-0 shadow-2xs";

                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기`;

        window.toggleActionMenu = function(postId, event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById(`action-menu-${postId}`);
            const btn = document.getElementById(`action-btn-${postId}`);
            if (!menu) return;

            const isOpen = menu.classList.contains('menu-open');
            closeAllActionMenus();

            if (!isOpen) {
                menu.classList.remove('menu-closed');
                menu.classList.add('menu-open');
                if (btn) btn.classList.add('rotate-45', 'text-emerald-700');
            }
        };

        function closeAllActionMenus() {
            document.querySelectorAll('[id^="action-menu-"]').forEach(m => {
                m.classList.remove('menu-open');
                m.classList.add('menu-closed');
            });
            document.querySelectorAll('[id^="action-btn-"]').forEach(b => {
                b.classList.remove('rotate-45', 'text-emerald-700');

        // 스크롤 발생 시 열려 있던 모든 인라인 댓글창 자동 닫기 (입력 내용은 commentDrafts에 보존됨)
        function closeAllInlineCommentInputs() {
            document.querySelectorAll('[id^="inline-comment-row-"]').forEach(row => {
                if (!row.classList.contains('hidden')) {
                    const postId = row.id.replace('inline-comment-row-', '');
                    const input = document.getElementById(`inline-comment-input-${postId}`);
                    if (input && input.value.trim().length > 0) {

                            updatedAt: Date.now()

                    }
                    row.classList.add('hidden');
                }
            });
        }

        window.togglePhotoCaptionEditor = function(postId, photoIdx) {
            const editor = document.getElementById(`caption-editor-${postId}-${photoIdx}`);
            if (!editor) return;
            const isHidden = editor.classList.contains('hidden');
            editor.classList.toggle('hidden');
            if (isHidden) {
                const input = document.getElementById(`caption-input-${postId}-${photoIdx}`);
                if (input) input.focus();
            }
        };

        window.savePhotoCaption = async function(postId, photoIdx) {
            const input = document.getElementById(`caption-input-${postId}-${photoIdx}`);
            if (!input) return;
            const text = input.value.trim();

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const updated = { ...(post.photoCaptions || {}) };
            if (text) updated[photoIdx] = text;
            else delete updated[photoIdx];

            setDbStatus('saving');
            try {
                await updateDoc(getPostDocRef(postId), { photoCaptions: updated });
                setDbStatus('connected');
                showNotification("사진 이야기가 저장되었습니다.");
                const editor = document.getElementById(`caption-editor-${postId}-${photoIdx}`);
                if (editor) editor.classList.add('hidden');
            } catch (err) {
                console.error("사진 이야기 저장 오류:", err);
                showNotification("저장 실패: " + err.message);
                setDbStatus('error');
            }
        };

        /* 1. 이미지 한 장 저장 (PNG 다운로드) - 댓글 포함 */
        window.exportPostAsImage = async function(postId) {
            const cardEl = document.getElementById(`post-card-${postId}`);
            if (!cardEl) return;
            showNotification("게시글과 댓글 이미지를 생성 중입니다...");

            const noExportEls = cardEl.querySelectorAll('.no-export');
            noExportEls.forEach(el => el.style.display = 'none');

            try {
                const canvas = await html2canvas(cardEl, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const link = document.createElement('a');
                link.download = `목장이야기_${postId.substring(0, 6)}_${formatFileDate(new Date())}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showNotification("게시글 이미지가 댓글과 함께 저장되었습니다!");
            } catch (e) {
                console.error("이미지 저장 오류:", e);
                showNotification("이미지 저장 중 오류가 발생했습니다.");
            } finally {
                noExportEls.forEach(el => el.style.display = '');
            }
        };

        /* 2. PDF 한 장 저장 (PDF 다운로드) - 댓글 포함 */
        window.exportPostAsPdf = async function(postId) {
            const cardEl = document.getElementById(`post-card-${postId}`);
            if (!cardEl) return;
            showNotification("PDF 문서를 생성 중입니다...");

            const noExportEls = cardEl.querySelectorAll('.no-export');
            noExportEls.forEach(el => el.style.display = 'none');

            try {
                const canvas = await html2canvas(cardEl, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = 210;
                const pageHeight = 297;
                const imgWidth = pageWidth - 20;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'JPEG', 10, 10, imgWidth, Math.min(imgHeight, pageHeight - 20));
                pdf.save(`목장이야기_${postId.substring(0, 6)}_${formatFileDate(new Date())}.pdf`);
                showNotification("댓글이 포함된 PDF 저장이 완료되었습니다!");
            } catch (e) {
                console.error("PDF 저장 오류:", e);
                showNotification("PDF 생성 중 오류가 발생했습니다.");
            } finally {
                noExportEls.forEach(el => el.style.display = '');
            }
        };

        /* 3. 게시글 단독 인쇄 - 댓글 포함 */
        window.printSinglePost = function(postId) {
            const cardEl = document.getElementById(`post-card-${postId}`);
            const printArea = document.getElementById('print-area');
            if (!cardEl || !printArea) return;

            const clone = cardEl.cloneNode(true);
            const noExportEls = clone.querySelectorAll('.no-export');
            noExportEls.forEach(el => el.remove());

            printArea.innerHTML = '';
            printArea.appendChild(clone);
            printArea.classList.remove('hidden');

            window.print();

            setTimeout(() => {
                printArea.classList.add('hidden');
                printArea.innerHTML = '';
            }, 500);
        };

        function formatFileDate(d) {
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
        }

        async function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            if (!db) return;

            onSnapshot(getPostsCollection(), (snapshot) => {
                feedContainer.innerHTML = "";
                const posts = [];

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const rawImg = data.imageUrl || "";
                    const rawImgs = Array.isArray(data.images) ? data.images.join(" ") : "";
                    if (rawImg.includes("unsplash") || rawImgs.includes("unsplash")) {
                        try { deleteDoc(getPostDocRef(docSnap.id)); } catch(e) {}
                        return;
                    }
                    posts.push({ id: docSnap.id, ...data });
                });

                cachedPosts = posts;

                if (currentActivePopupPostId) {
                    renderCommentsModalList(currentActivePopupPostId);
                }

                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="h-64 flex flex-col items-center justify-center p-4 text-center">
                            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-xs border church-border mb-2.5 text-gray-300">
                                <i class="fa-solid fa-camera-retro text-xl opacity-60"></i>
                            </div>
                            <h3 class="text-xs font-bold text-gray-700">등록된 목장 이야기가 없습니다</h3>
                            <p class="text-[10px] text-gray-400 mt-1">상단의 글쓰기 버튼을 눌러 첫 소식을 나눠주세요.</p>
                        </div>
                    `;
                    return;
                }

                posts.sort((a, b) => {
                    const tA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
                    const tB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
                    return tB - tA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const thumbsCount = post.thumbsUp || 0;
                    const hasThumbed = post.thumbedUsers && post.thumbedUsers.includes(currentUser);

                    const card = document.createElement('article');
                    card.className = "w-full px-2 pt-0.5 pb-1 box-border";

                    let imgArray = [];
                    if (Array.isArray(post.images) && post.images.length > 0) {
                        imgArray = post.images.filter(img => typeof img === 'string' && img.trim().length > 0);
                    } else if (post.imageUrl && typeof post.imageUrl === 'string' && post.imageUrl.trim().length > 0) {
                        imgArray = [post.imageUrl];
                    }

                    const photoCaptions = post.photoCaptions || {};

                    let mediaSectionHtml = '';
                    if (imgArray.length > 0) {
                        const photosHtml = imgArray.map((url, i) => {
                            const caption = photoCaptions[i] || '';
                            return `

                                    <!-- 테두리 없는 깔끔한 글쓰기 창 -->
                                    <div id="caption-editor-${post.id}-${i}" class="no-export hidden p-1.5 bg-emerald-50/50 rounded-b-xl m-0.5">
                                        <div class="flex justify-between items-center mb-0.5 text-[11px] text-emerald-900 font-semibold px-0.5">
                                            <span><i class="fa-solid fa-pencil mr-1 text-[10px]"></i>이 사진 이야기 쓰기</span>
                                            <button type="button" onclick="togglePhotoCaptionEditor('${post.id}', ${i})" class="text-gray-400 hover:text-gray-600">
                                                <i class="fa-solid fa-xmark text-xs"></i>
                                            </button>
                                        </div>
                                        <textarea id="caption-input-${post.id}-${i}" rows="2" maxlength="150" placeholder="이 사진에 담긴 이야기를 입력해 보세요..." 
                                                  class="w-full p-1.5 bg-white rounded-lg border-0 text-xs focus:outline-none focus:ring-0 resize-none shadow-2xs">${escapeHtml(caption)}</textarea>
                                        <div class="flex justify-end mt-1 space-x-1.5">
                                            <button type="button" onclick="togglePhotoCaptionEditor('${post.id}', ${i})" class="px-2.5 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-600 rounded">취소</button>
                                            <button type="button" onclick="savePhotoCaption('${post.id}', ${i})" class="px-3 py-1 text-[11px] church-primary text-white font-medium rounded shadow-2xs">저장</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        mediaSectionHtml = `
                            <div class="w-full continuous-photo-container shadow-2xs">
                                ${photosHtml}
                            </div>
                        `;
                    }

                    const imagesParam = JSON.stringify(imgArray).replace(/"/g, '&quot;');
                    const commentCount = post.comments ? post.comments.length : 0;
                    const postComments = post.comments || [];

                    // 이미지 저장/PDF/인쇄 시 함께 출력될 댓글 블록
                    let commentsDisplayHtml = '';
                    if (postComments.length > 0) {
                        const items = postComments.map(c => `
                            <div class="py-1 px-1.5 border-b border-gray-100 last:border-b-0 text-[11px] flex flex-col space-y-0.5">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-gray-800 text-[10px]">${escapeHtml(c.author)}</span>
                                    <span class="text-[9px] text-gray-400">${c.time || ''}</span>
                                </div>
                                <p class="text-gray-700 text-[11px] leading-snug whitespace-pre-wrap">${escapeHtml(c.text)}</p>
                            </div>
                        `).join('');

                        commentsDisplayHtml = `
                            <div class="mt-1 pt-1 border-t border-gray-100 bg-gray-50/70 rounded-xl p-1.5">
                                <div class="flex items-center space-x-1 text-[10px] font-bold text-gray-600 mb-1 px-1">
                                    <i class="fa-regular fa-comment-dots text-emerald-700"></i>
                                    <span>목장 댓글 (${postComments.length})</span>
                                </div>
                                <div class="space-y-0.5">
                                    ${items}
                                </div>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div id="post-card-${post.id}" class="w-full bg-white rounded-2xl border church-border shadow-xs flex flex-col p-2 box-border relative">
                            <!-- 작성자 헤더 & 슬라이드 관리 메뉴 -->
                            <div class="flex items-center justify-between pb-0.5 relative">
                                <div class="flex items-center space-x-1.5">
                                    <div class="w-6 h-6 rounded-full church-accent church-primary-text flex items-center justify-center font-bold text-xs shrink-0 shadow-2xs">
                                        ${escapeHtml((post.author || 'M').charAt(0))}
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-gray-800 leading-tight">${escapeHtml(post.author || '목장가족')}</h4>
                                        <p class="text-[9px] text-gray-400 leading-none mt-0.5">${formatDate(post.createdAt)}</p>
                                    </div>
                                </div>

                                <!-- 오른쪽 상단 '+' 버튼 및 슬라이드 메뉴 -->
                                <div class="no-export relative flex items-center">
                                    <div id="action-menu-${post.id}" class="slide-menu-container menu-closed absolute right-7 bg-[#EBF5EE] border border-[#CDE5D5] text-[#244E3F] rounded-full shadow-md py-1 px-3 z-20 flex items-center space-x-2.5 whitespace-nowrap">
                                        <button onclick="requestEditPost('${post.id}', \`${escapeHtml(post.content || '')}\`, ${imagesParam})" class="text-[11px] font-semibold hover:text-[#18392D] flex items-center space-x-1 active:scale-95 transition-transform">
                                            <i class="fa-solid fa-pen text-[9px]"></i>
                                            <span>수정</span>
                                        </button>
                                        <span class="text-[#A7D1B7] text-[10px]">|</span>
                                        <button onclick="confirmDeletePost('${post.id}', \`${escapeHtml(post.content || '')}\`, ${imagesParam})" class="text-[11px] font-semibold text-rose-600 hover:text-rose-700 flex items-center space-x-1 active:scale-95 transition-transform">
                                            <i class="fa-solid fa-trash-can text-[9px]"></i>
                                            <span>삭제</span>
                                        </button>
                                    </div>

                                    <button type="button" id="action-btn-${post.id}" onclick="toggleActionMenu('${post.id}', event)" 
                                            class="w-6 h-6 rounded-full flex items-center justify-center text-gray-500 hover:text-emerald-800 hover:bg-emerald-50 transition-all font-black text-sm" title="더보기">
                                        <i class="fa-solid fa-plus transition-transform duration-200"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 본문 텍스트: 상하 여백 극단적 밀착 -->
                            ${post.content ? `
                            <div class="pt-0.5 pb-0.5 px-0.5 text-[15.5px] text-gray-800 leading-snug tracking-tight break-words overflow-wrap-anywhere whitespace-pre-wrap">
                                ${escapeHtml(post.content)}
                            </div>
                            ` : ''}

                            <!-- 사진 영역: 본문과 1px 마진으로 바짝 밀착 -->
                            ${mediaSectionHtml}

                            <!-- 마지막 사진 바로 아래 배치된 반응 버튼들 & [맞은편 단색 선형 아이콘 버튼들] -->
                            <div class="pt-1 flex items-center justify-between no-export">
                                <!-- 왼쪽: 손하트, 엄지, 댓글, + (단색 라인 스타일) -->
                                <div class="flex items-center space-x-3">
                                    <!-- 손하트 / 하트 -->
                                    <button onclick="toggleLike('${post.id}', ${hasLiked})" class="flex items-center space-x-1 ${hasLiked ? 'text-rose-500 font-semibold' : 'text-gray-500 hover:text-rose-500'} active:scale-90 transition-transform">
                                        <i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-sm"></i>
                                        <span class="text-xs">${post.likes || 0}</span>
                                    </button>

                                    <!-- 엄지척 -->
                                    <button onclick="toggleThumbsUp('${post.id}', ${hasThumbed})" class="flex items-center space-x-1 ${hasThumbed ? 'text-sky-600 font-semibold' : 'text-gray-500 hover:text-sky-600'} active:scale-90 transition-transform">
                                        <i class="${hasThumbed ? 'fa-solid' : 'fa-regular'} fa-thumbs-up text-sm"></i>
                                        <span class="text-xs">${thumbsCount}</span>
                                    </button>

                                    <!-- 댓글 팝업 열기 -->
                                    <button type="button" onclick="openCommentsModal('${post.id}')" class="flex items-center space-x-1 text-gray-500 hover:text-emerald-700 active:scale-90 transition-transform" title="댓글 열기">
                                        <i class="fa-regular fa-comment-dots text-sm"></i>
                                        <span class="text-xs">${commentCount}</span>
                                    </button>

                                    <!-- 댓글 바로 쓰기 토글 '+' (스크롤 시 닫히며 5분간 내용 보존) -->
                                    <button type="button" onclick="toggleInlineCommentInput('${post.id}')" class="w-5 h-5 rounded-full bg-gray-100 hover:bg-emerald-50 text-gray-500 hover:text-emerald-700 flex items-center justify-center text-xs font-bold active:scale-90 transition-transform" title="댓글 바로 달기">
                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                    </button>
                                </div>

                                <!-- 오른쪽(반대편): 단색 선형(라인) 아이콘 버튼 3종 -->
                                <div class="flex items-center space-x-2.5 text-gray-500">
                                    <!-- 이미지 한 장 저장 (단색 라인 액자 아이콘) -->
                                    <button type="button" onclick="exportPostAsImage('${post.id}')" 
                                            class="flex items-center text-gray-500 hover:text-emerald-700 active:scale-90 transition-transform" 
                                            title="게시글 이미지로 한 장 저장 (댓글 포함)">
                                        <i class="fa-regular fa-image text-sm"></i>
                                    </button>

                                    <!-- PDF 한 장 저장 (단색 라인 PDF 파일 아이콘) -->
                                    <button type="button" onclick="exportPostAsPdf('${post.id}')" 
                                            class="flex items-center text-gray-500 hover:text-rose-600 active:scale-90 transition-transform" 
                                            title="게시글 PDF로 한 장 저장 (댓글 포함)">
                                        <i class="fa-regular fa-file-pdf text-sm"></i>
                                    </button>

                                    <!-- 인쇄하기 (단색 라인 프린터 아이콘) -->
                                    <button type="button" onclick="printSinglePost('${post.id}')" 
                                            class="flex items-center text-gray-500 hover:text-sky-700 active:scale-90 transition-transform" 
                                            title="게시글 인쇄 (댓글 포함)">
                                        <i class="fa-solid fa-print text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 각 사진 밑 인라인 댓글 등록창 -->
                            <div id="inline-comment-row-${post.id}" class="no-export mt-1 pt-0.5 hidden">
                                <div class="flex space-x-1.5 items-center">
                                    <input type="text" id="inline-comment-input-${post.id}" maxlength="200" placeholder="따뜻한 댓글을 남겨보세요..." 
                                           oninput="handleDraftInput('${post.id}', this.value)"
                                           onkeydown="if(event.key==='Enter') addCommentInline('${post.id}')"
                                           class="flex-1 px-3 py-1.5 border church-border rounded-lg text-xs focus:outline-none focus:border-emerald-600 bg-gray-50">
                                    <button onclick="addCommentInline('${post.id}')" class="px-3 py-1.5 church-primary text-white rounded-lg text-xs font-medium whitespace-nowrap shadow-2xs">
                                        등록
                                    </button>
                                </div>
                            </div>

                            <!-- [저장/인쇄 시 온전히 포함되는 댓글 목록 블록] -->
                            ${commentsDisplayHtml}
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            }, (err) => {
                console.error("피드 스냅샷 오류:", err);
                setDbStatus('error');
            });
        }

        window.openCommentsModal = function(postId) {
            currentActivePopupPostId = postId;
            renderCommentsModalList(postId);
            document.getElementById('comments-popup-modal').classList.remove('hidden');
            setTimeout(() => {
                const input = document.getElementById('comments-modal-input');
                if (input) input.focus();
            }, 100);
        };

        window.closeCommentsModal = function() {
            currentActivePopupPostId = null;
            document.getElementById('comments-popup-modal').classList.add('hidden');
        };

        function renderCommentsModalList(postId) {
            const listEl = document.getElementById('comments-modal-list');
            const countEl = document.getElementById('comments-modal-count');
            if (!listEl) return;

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const comments = post.comments || [];
            countEl.innerText = comments.length;

            if (comments.length === 0) {
                listEl.innerHTML = `
                    <div class="py-12 text-center text-gray-400">
                        <i class="fa-regular fa-comments text-2xl mb-1.5 opacity-40"></i>
                        <p class="text-xs">아직 작성된 댓글이 없습니다.</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">첫 댓글로 사랑과 은혜를 나눠보세요!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="bg-gray-50 rounded-xl p-2.5 border border-gray-100 flex flex-col space-y-0.5">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-800 text-xs">${escapeHtml(c.author)}</span>
                        <span class="text-[9px] text-gray-400">${c.time || ''}</span>
                    </div>
                    <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap">${escapeHtml(c.text)}</p>
                </div>
            `).join('');

            setTimeout(() => { listEl.scrollTop = listEl.scrollHeight; }, 50);
        }

        window.addCommentFromModal = async function() {
            if (!currentActivePopupPostId) return;
            const input = document.getElementById('comments-modal-input');
            const text = input.value.trim();
            if (!text) return;

            await submitComment(currentActivePopupPostId, text);
            input.value = '';
        };

        // 댓글 실시간 타이핑 시 5분 만료 타이머 갱신
        window.handleDraftInput = function(postId, val) {
            commentDrafts[postId] = {
                text: val,
                updatedAt: Date.now()
            };
        };

        // '+' 버튼 토글: 열릴 때 5분 이내 작성 중이던 내용 복원, 5분 초과 시 자동 삭제
        window.toggleInlineCommentInput = function(postId) {
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (!row) return;

            const isCurrentlyHidden = row.classList.contains('hidden');

            if (isCurrentlyHidden) {
                closeAllInlineCommentInputs();
                row.classList.remove('hidden');

                const input = document.getElementById(`inline-comment-input-${postId}`);
                if (input) {
                    const draft = commentDrafts[postId];
                    if (draft) {
                        const elapsed = Date.now() - draft.updatedAt;
                        if (elapsed <= DRAFT_EXPIRE_MS) {
                            input.value = draft.text;
                        } else {
                            delete commentDrafts[postId];
                            input.value = '';
                        }
                    }
                    input.focus();
                }
            } else {
                const input = document.getElementById(`inline-comment-input-${postId}`);
                if (input && input.value.trim().length > 0) {
                    commentDrafts[postId] = {
                        text: input.value,
                        updatedAt: Date.now()
                    };
                }
                row.classList.add('hidden');
            }
        };

        window.addCommentInline = async function(postId) {
            const input = document.getElementById(`inline-comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            await submitComment(postId, text);
            input.value = '';
            delete commentDrafts[postId];
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) row.classList.add('hidden');
        };

        async function submitComment(postId, text) {
            const now = new Date();
            const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            if (!db) return;
            setDbStatus('saving');
            try {
                await updateDoc(getPostDocRef(postId), { comments: arrayUnion(commentObj) });
                setDbStatus('connected');
                showNotification("댓글이 등록되었습니다.");
            } catch (err) {
                console.error("댓글 등록 오류:", err);
                setDbStatus('error');
            }
        }

        window.toggleLike = async function(postId, hasLiked) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasLiked) {
                    await updateDoc(getPostDocRef(postId), { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("좋아요 오류:", err);
                setDbStatus('error');
            }
        };

        window.toggleThumbsUp = async function(postId, hasThumbed) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasThumbed) {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(-1), thumbedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(1), thumbedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("엄지척 오류:", err);
                setDbStatus('error');
            }
        };

        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const autoFixBtn = document.getElementById('lightbox-autofix-btn');
        const prevBtn = document.getElementById('lightbox-prev-btn');
        const nextBtn = document.getElementById('lightbox-next-btn');
        const zoomLevelText = document.getElementById('lightbox-zoom-level');

        function getPostImages(postId) {
            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return [];
            if (Array.isArray(post.images) && post.images.length > 0) {
                return post.images.filter(img => typeof img === 'string' && img.trim().length > 0);
            }
            if (post.imageUrl) return [post.imageUrl];
            return [];
        }

        window.openLightbox = function(postId, photoIdx) {
            currentLightboxPostId = postId;
            currentLightboxPhotoIdx = photoIdx;
            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;

            loadCurrentLightboxPhoto();
            lightboxModal.classList.remove('hidden');
        };

        function loadCurrentLightboxPhoto() {
            const images = getPostImages(currentLightboxPostId);
            if (images.length === 0) return;

            if (currentLightboxPhotoIdx < 0) currentLightboxPhotoIdx = 0;
            if (currentLightboxPhotoIdx >= images.length) currentLightboxPhotoIdx = images.length - 1;

            lightboxImg.src = images[currentLightboxPhotoIdx];
            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;

            updateLightboxTransform();

            // 상단 카운터 업데이트
            lightboxCounter.innerText = `${currentLightboxPhotoIdx + 1} / ${images.length}`;

            // 좌우 이동 버튼 표시 여부
            if (images.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                prevBtn.style.opacity = currentLightboxPhotoIdx === 0 ? '0.3' : '1';
                nextBtn.style.opacity = currentLightboxPhotoIdx === images.length - 1 ? '0.3' : '1';
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        function updateLightboxTransform() {
            lightboxImg.style.transform = `scale(${currentLightboxScale}) rotate(${currentLightboxRotationAngle}deg)`;
            
            // 아이폰 자동 보정 필터: 명암 대비(108%), 밝기(106%), 채도(112%) 최적화
            if (isLightboxAutoFixed) {
                lightboxImg.style.filter = "contrast(1.08) brightness(1.06) saturate(1.12)";
                autoFixBtn.classList.remove('bg-white/20');
                autoFixBtn.classList.add('bg-amber-400', 'text-gray-900', 'font-bold');
            } else {
                lightboxImg.style.filter = "none";
                autoFixBtn.classList.add('bg-white/20');
                autoFixBtn.classList.remove('bg-amber-400', 'text-gray-900', 'font-bold');
            }

            zoomLevelText.innerText = `${Math.round(currentLightboxScale * 100)}%`;
        }

        window.toggleLightboxAutoFix = function() {
            isLightboxAutoFixed = !isLightboxAutoFixed;
            updateLightboxTransform();
            showNotification(isLightboxAutoFixed ? "자동 보정(밝기/선명도)이 적용되었습니다." : "자동 보정이 해제되었습니다.");
        };

        window.rotateLightboxImage = function() {
            currentLightboxRotationAngle = (currentLightboxRotationAngle + 90) % 360;
            updateLightboxTransform();
        };

        // 상부 닫기 X 버튼 및 화면 밖을 벗어나지 않도록 안전 배율(0.8 ~ 2.5) 범위 내 확대/축소
        window.zoomLightbox = function(delta) {
            let nextScale = currentLightboxScale + delta;
            if (nextScale < 0.8) nextScale = 0.8;
            if (nextScale > 2.5) nextScale = 2.5;
            currentLightboxScale = parseFloat(nextScale.toFixed(2));
            updateLightboxTransform();
        };

        window.resetLightboxZoom = function() {
            currentLightboxScale = 1.0;
            updateLightboxTransform();
        };

        // 피드 내 좌우 사진 슬라이드 기능
        window.slideLightboxPrev = function(e) {
            if (e) e.stopPropagation();
            const images = getPostImages(currentLightboxPostId);
            if (currentLightboxPhotoIdx > 0) {
                currentLightboxPhotoIdx--;
                loadCurrentLightboxPhoto();
            } else {
                showNotification("첫 번째 사진입니다.");
            }
        };

        window.slideLightboxNext = function(e) {
            if (e) e.stopPropagation();
            const images = getPostImages(currentLightboxPostId);
            if (currentLightboxPhotoIdx < images.length - 1) {
                currentLightboxPhotoIdx++;
                loadCurrentLightboxPhoto();
            } else {
                showNotification("마지막 사진입니다.");
            }
        };

        // 모바일 터치 스와이프(좌우 넘김) 및 핀치 줌(확대/축소) 터치 이벤트 제어
        const viewport = document.getElementById('lightbox-viewport');
        if (viewport) {
            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    lightboxTouchStartX = e.touches[0].clientX;
                    lightboxTouchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // 핀치 줌 감지
                    lightboxInitialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    lightboxInitialScale = currentLightboxScale;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && lightboxInitialPinchDist > 0) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = currentDist / lightboxInitialPinchDist;
                    let nextScale = lightboxInitialScale * factor;
                    if (nextScale < 0.8) nextScale = 0.8;
                    if (nextScale > 2.5) nextScale = 2.5;
                    currentLightboxScale = parseFloat(nextScale.toFixed(2));
                    updateLightboxTransform();
                }
            }, { passive: true });

            viewport.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1 && currentLightboxScale === 1.0) {
                    const diffX = e.changedTouches[0].clientX - lightboxTouchStartX;
                    const diffY = e.changedTouches[0].clientY - lightboxTouchStartY;
                    // 좌우 스와이프 판정 (수평 이동폭이 45px 이상이고 수직 이동폭보다 클 때)
                    if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 0) {
                            window.slideLightboxPrev();
                        } else {
                            window.slideLightboxNext();
                        }
                    }
                }
                lightboxInitialPinchDist = 0;
            }, { passive: true });
        }

        window.closeLightbox = function() {
            lightboxModal.classList.add('hidden');
            currentLightboxPostId = null;
            currentLightboxPhotoIdx = null;
            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;
        };

        // 회전 각도 및 자동 보정(밝기/대비) 상태를 캔버스에 구워 영구 저장
        window.saveRotatedImagePermanent = async function() {
            if (!currentLightboxPostId || currentLightboxPhotoIdx === null) return;
            if (currentLightboxRotationAngle === 0 && !isLightboxAutoFixed) {
                showNotification("회전 각도나 자동 조정을 변경한 후 저장해 주세요.");
                return;
            }

            const post = cachedPosts.find(p => p.id === currentLightboxPostId);
            if (!post) return;

            setDbStatus('saving');
            showNotification("사진 변경 사항을 저장 중입니다...");

            try {
                const finalDataUrl = await getProcessedDataUrl(lightboxImg.src, currentLightboxRotationAngle, isLightboxAutoFixed);
                const updatedImages = [...(post.images || [post.imageUrl])];
                updatedImages[currentLightboxPhotoIdx] = finalDataUrl;

                await updateDoc(getPostDocRef(currentLightboxPostId), {
                    images: updatedImages,
                    imageUrl: updatedImages[0] || ""
                });

                setDbStatus('connected');
                showNotification("사진이 성공적으로 영구 저장되었습니다!");
                closeLightbox();
            } catch (err) {
                console.error("사진 영구 저장 실패:", err);
                showNotification("저장 실패: " + err.message);
                setDbStatus('error');
            }
        };

        function getProcessedDataUrl(src, angle, autoFix) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (angle === 90 || angle === 270) {
                        canvas.width = img.height;
                        canvas.height = img.width;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }

                    if (autoFix) {
                        ctx.filter = "contrast(1.08) brightness(1.06) saturate(1.12)";
                    }

                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate((angle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
