<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100%;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #1F2937;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        /* 부드러운 스크롤 */
        #feed-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #feed-container::-webkit-scrollbar {
            width: 4px;
        }
        #feed-container::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        #lightbox-modal, #auth-modal, #write-modal, #confirm-modal, #save-confirm-modal, #edit-confirm-modal, #comments-popup-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }
        #lightbox-img {
            transition: transform 0.15s ease-out;
            transform-origin: center center;
        }

        /* 하나의 테두리 안에 여러 사진이 부드럽게 이어지는 연속 프레임 */
        .continuous-photo-container {
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .continuous-photo-item {
            width: 100%;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .continuous-photo-item:active {
            opacity: 0.92;
        }
        
        /* 사진 사이의 1px 실선 구분 */
        .photo-block-item:not(:last-child) {
            border-bottom: 1px solid #E5E7EB;
        }

        /* 사진별 개별 이야기 캡션 말풍선 상자 */
        .photo-caption-text {
            font-size: 13.5px;
            line-height: 1.5;
            color: #374151;
            background-color: #F9FAFB;
            padding: 8px 12px;
            border-top: 1px dashed #E5E7EB;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* 터치 시 점선 테두리 포커스 */
        .touch-dashed-focus:focus {
            border-style: dashed !important;
            border-width: 2px !important;
            border-color: #3B5D50 !important;
            outline: none !important;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [메인 헤더] -->
    <header class="h-[48px] shrink-0 bg-white border-b church-border shadow-2xs px-3 flex items-center justify-between w-full z-30">
        <div class="flex items-center space-x-2 overflow-hidden">
            <div class="w-7 h-7 church-primary rounded-full flex items-center justify-center p-0.5 shadow-xs border border-emerald-100 overflow-hidden bg-white shrink-0">
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                    <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                    <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                    <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                    <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                </svg>
            </div>
            <div class="overflow-hidden leading-tight">
                <h1 class="text-xs font-bold text-gray-800 truncate whitespace-nowrap" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                <p class="text-[10px] text-gray-500 truncate whitespace-nowrap" id="header-user-display">로그인 중...</p>
            </div>
        </div>
        
        <div class="shrink-0 flex items-center space-x-2">
            <!-- 클라우드 연동 램프 -->
            <button type="button" onclick="openDbStatusModal()" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors focus:outline-none" title="서버 연동 상태">
                <span id="db-status-lamp" class="w-2.5 h-2.5 rounded-full bg-emerald-400 transition-all inline-block"></span>
            </button>
            <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-semibold flex items-center space-x-1.5 shadow-2xs hover:bg-emerald-100/70 active:scale-95 transition-all">
                <i class="fa-solid fa-camera text-[11px]"></i>
                <span>글쓰기</span>
            </button>
        </div>
    </header>

    <!-- [피드 메인 컨테이너 (스크롤 뷰)] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-1" id="feed-container">
        <!-- 게시글 목록이 동적으로 들어옵니다 -->
    </main>

    <!-- [댓글 전용 팝업 스크린 모달] -->
    <div id="comments-popup-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex flex-col justify-end hidden">
        <div class="bg-white rounded-t-2xl w-full max-w-md mx-auto max-h-[75vh] flex flex-col shadow-2xl border-t church-border overflow-hidden">
            <div class="flex items-center justify-between px-3.5 py-3 border-b church-border shrink-0 bg-gray-50/80">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-regular fa-comment-dots church-primary-text text-sm"></i>
                    <h3 class="text-xs font-bold text-gray-800">댓글 <span id="comments-modal-count" class="text-emerald-700 font-semibold">0</span></h3>
                </div>
                <button onclick="closeCommentsModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-200 text-xs">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- 댓글 목록 스크롤 -->
            <div id="comments-modal-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs"></div>

            <!-- 하단 작성 인풋 -->
            <div class="p-2.5 border-t church-border bg-white shrink-0 flex items-center space-x-1.5">
                <input type="text" id="comments-modal-input" maxlength="200" placeholder="댓글을 입력하세요..." 
                       onkeydown="if(event.key==='Enter') addCommentFromModal()" 
                       class="flex-1 px-3 py-2 text-xs bg-gray-50 border church-border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                <button onclick="addCommentFromModal()" class="px-3.5 py-2 church-primary text-white text-xs font-semibold rounded-lg whitespace-nowrap shadow-2xs active:scale-95 transition-transform">
                    등록
                </button>
            </div>
        </div>
    </div>

    <!-- [글쓰기 / 수정 모달] -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl border church-border max-h-[90vh] flex flex-col overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b church-border shrink-0">
                <h3 class="text-sm font-bold text-gray-800" id="modal-title-text"><i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <div class="space-y-3 flex-1 overflow-y-auto pt-3">
                <input type="hidden" id="editing-post-id" value="">
                
                <!-- 사진 첨부 영역 -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center text-[11px]">
                        <label class="font-medium text-gray-700">사진 추가 (최대 5장)</label>
                        <span id="image-count-indicator" class="text-gray-400">0 / 5장</span>
                    </div>

                    <!-- 숨김 처리 파일 인풋 -->
                    <input type="file" id="post-multi-file-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">

                    <!-- 사진 썸네일 & '+' 추가 버튼 중앙 정렬 -->
                    <div id="selected-images-grid" class="flex flex-wrap items-center justify-center gap-2 py-1.5"></div>
                </div>

                <!-- 본문 내용 입력 영역 -->
                <div class="w-full" id="post-content-container">
                    <div class="flex justify-between items-center mb-1 text-[11px]">
                        <span class="font-medium text-gray-700">내용 입력</span>
                        <span id="char-count-indicator" class="text-gray-400">0 / 200자</span>
                    </div>
                    <!-- 포커스 시 점선 테두리 변환 -->
                    <textarea id="post-content" rows="4" maxlength="200" oninput="updateCharCount(this)" placeholder="목장 가족들과 나눌 따뜻한 이야기를 입력하세요..." 
                              class="w-full px-3 py-2 rounded-xl border border-[#E5E7EB] text-sm focus:border-2 focus:border-dashed focus:border-[#3B5D50] focus:outline-none resize-none bg-white block transition-all"></textarea>
                </div>

                <!-- 등록하기 버튼: 문자 사이즈에 맞게 아담하게 줄이고 중앙 정렬 -->
                <div class="pt-2 flex justify-center">
                    <button type="button" onclick="requestSavePost()" class="px-6 py-2.5 church-primary text-white rounded-xl font-semibold text-xs shadow-md active:scale-95 transition-all inline-flex items-center space-x-1.5" id="submit-btn-text">
                        <i class="fa-solid fa-check"></i>
                        <span>등록하기</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- [저장 확인 모달] -->
    <div id="save-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 저장</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">이 이야기를 목장 피드에 올리시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeSaveConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button onclick="executeSubmitPost()" class="py-2 church-primary text-white rounded-lg text-xs font-semibold">저장하기</button>
            </div>
        </div>
    </div>

    <!-- [수정 확인 모달] -->
    <div id="edit-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 수정</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">이 이야기를 수정하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeEditConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button id="edit-confirm-yes-btn" class="py-2 church-primary text-white rounded-lg text-xs font-semibold">수정하기</button>
            </div>
        </div>
    </div>

    <!-- [삭제 확인 모달] -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 삭제</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">정말 이 이야기를 삭제하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeConfirmModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">취소</button>
                <button id="confirm-yes-btn" class="py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-semibold">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- [라이트박스: 사진 확대 및 90도 회전 영구 저장] -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-between hidden p-2">
        <!-- 상단 툴바 -->
        <div class="w-full flex items-center justify-between p-2 z-50">
            <span class="text-white/70 text-xs px-2" id="lightbox-counter"></span>
            <div class="flex items-center space-x-2">
                <button type="button" onclick="rotateLightboxImage()" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 active:scale-95 text-white rounded-lg text-xs font-medium flex items-center space-x-1 transition-all">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>90° 회전</span>
                </button>
                <button type="button" onclick="saveRotatedImagePermanent()" class="px-3 py-1.5 church-primary active:scale-95 text-white rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-md transition-all">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>각도 저장</span>
                </button>
                <button onclick="closeLightbox()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/20 text-white text-sm hover:bg-white/30 transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- 이미지 뷰어 -->
        <div class="overflow-hidden w-full flex-1 flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 사진" class="max-w-full max-h-full object-contain select-none">
        </div>

        <!-- 하단 팁 바 -->
        <div class="w-full py-2 text-center text-white/50 text-[10px]">
            회전 후 [각도 저장]을 누르면 사진 방향이 영구 저장됩니다.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let currentUser = "목장가족";
        let currentMokjang = "세종꿈의교회 23목장";
        let selectedImagesList = [];
        let postToDeleteId = null;
        let isAuthReady = false;
        let currentDbStatus = 'connecting';
        let currentActivePopupPostId = null;
        let cachedPosts = [];

        // 라이트박스 회전 제어 변수
        let currentLightboxPostId = null;
        let currentLightboxPhotoIdx = null;
        let currentLightboxRotationAngle = 0;

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDKD5LUQL84ZuPH5UJrHBj7yAYDTabDWVA",
            authDomain: "dream-data-146a4.firebaseapp.com",
            projectId: "dream-data-146a4",
            storageBucket: "dream-data-146a4.firebasestorage.app",
            messagingSenderId: "812415684377",
            appId: "1:812415684377:web:de8859d1502b3c05acbf88"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        // 안정적인 루트 컬렉션
        function getPostsCollection() {
            return collection(db, 'mokjang_posts');
        }
        function getPostDocRef(postId) {
            return doc(db, 'mokjang_posts', postId);
        }

        function setDbStatus(status) {
            currentDbStatus = status;
            const lamp = document.getElementById('db-status-lamp');
            if (lamp) {
                lamp.className = "w-2.5 h-2.5 rounded-full inline-block transition-all";
                if (status === 'connecting') lamp.classList.add('bg-sky-400', 'animate-pulse');
                else if (status === 'connected') lamp.classList.add('bg-emerald-400');
                else if (status === 'saving') lamp.classList.add('bg-emerald-300', 'animate-ping');
                else lamp.classList.add('bg-rose-400');
            }
        }

        function showNotification(msg) {
            const existing = document.getElementById('app-notification-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'app-notification-toast';
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-3.5 py-2 rounded-xl shadow-xl z-50 flex items-center space-x-1.5 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center font-medium';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 shrink-0"></i><span>${escapeHtml(msg)}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        async function initAuth() {
            setDbStatus('connecting');
            if (!auth) { setDbStatus('error'); return; }
            try {
                await signInAnonymously(auth);
                isAuthReady = true;
                setDbStatus('connected');
                document.getElementById('header-user-display').innerText = `${currentUser} 님 환영합니다`;
                document.getElementById('header-mokjang-title').innerText = currentMokjang;
                loadMokjangFeed();
            } catch (e) {
                console.warn("익명 인증 경고:", e);
                isAuthReady = true;
                setDbStatus('connected');
                document.getElementById('header-user-display').innerText = `${currentUser} 님 환영합니다`;
                loadMokjangFeed();
            }
        }
        initAuth();

        // 모바일 초경량 최적화 이미지 압축 (최대 640px, JPEG 0.6)
        function processImageFile(file, callback) {
            if (!file) return callback(null);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 640;

                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressed = canvas.toDataURL('image/jpeg', 0.6);
                        callback(compressed);
                    } catch (err) {
                        console.warn("Canvas 압축 대체:", err);
                        callback(e.target.result);
                    }
                };
                img.onerror = () => callback(e.target.result);
                img.src = e.target.result;
            };
            reader.onerror = () => callback(null);
            reader.readAsDataURL(file);
        }

        window.triggerFilePicker = function() {
            if (selectedImagesList.length >= 5) {
                showNotification('사진은 최대 5장까지 선택 가능합니다.');
                return;
            }
            document.getElementById('post-multi-file-input').click();
        };

        window.handleFilesSelect = function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remaining = 5 - selectedImagesList.length;
            if (remaining <= 0) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            const toProcess = Array.from(files).slice(0, remaining);
            let done = 0;
            toProcess.forEach(file => {
                processImageFile(file, (result) => {
                    if (result) selectedImagesList.push(result);
                    done++;
                    if (done === toProcess.length) {
                        renderImagePreviews();
                        showNotification(`사진 ${done}장이 등록되었습니다.`);
                    }
                });
            });
            event.target.value = '';
        };

        window.removeSelectedImage = function(idx) {
            selectedImagesList.splice(idx, 1);
            renderImagePreviews();
        };

        function renderImagePreviews() {
            const grid = document.getElementById('selected-images-grid');
            const ind = document.getElementById('image-count-indicator');
            grid.innerHTML = "";
            ind.innerText = `${selectedImagesList.length} / 5장`;

            selectedImagesList.forEach((src, idx) => {
                const thumb = document.createElement('div');
                thumb.className = "relative bg-gray-100 rounded-xl w-18 h-18 overflow-hidden border church-border flex items-center justify-center shrink-0 shadow-2xs";
                thumb.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeSelectedImage(${idx})" class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center hover:bg-red-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                `;
                grid.appendChild(thumb);
            });

            if (selectedImagesList.length < 5) {
                const addBtn = document.createElement('button');
                addBtn.type = "button";
                addBtn.onclick = triggerFilePicker;
                addBtn.className = "w-18 h-18 border-2 border-dashed church-border rounded-xl flex flex-col items-center justify-center text-gray-500 hover:bg-emerald-50 active:scale-95 transition-all bg-gray-50/70 shrink-0";
                addBtn.innerHTML = `
                    <i class="fa-solid fa-plus text-lg mb-0.5 church-primary-text"></i>
                    <span class="text-[10px] font-medium text-gray-600">사진 추가</span>

        window.updateCharCount = function(textarea) {
            document.getElementById('char-count-indicator').innerText = `${textarea.value.length} / 200자`;
        };

        window.openWriteModal = function(postId = null, existingContent = "", existingImages = []) {
            document.getElementById('editing-post-id').value = postId || "";
            const contentEl = document.getElementById('post-content');
            contentEl.value = existingContent || "";
            updateCharCount(contentEl);

            selectedImagesList = Array.isArray(existingImages) ? [...existingImages] : (existingImages ? [existingImages] : []);
            renderImagePreviews();

            if (postId) {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-pen-to-square church-primary-text mr-1.5"></i>목장 이야기 수정하기`;
                document.getElementById('submit-btn-text').innerHTML = `<i class="fa-solid fa-check"></i><span>수정 완료</span>`;
            } else {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기`;
                document.getElementById('submit-btn-text').innerHTML = `<i class="fa-solid fa-check"></i><span>등록하기</span>`;
            }
            document.getElementById('write-modal').classList.remove('hidden');
        };

        window.closeWriteModal = function() {
            document.getElementById('write-modal').classList.add('hidden');
            selectedImagesList = [];
            document.getElementById('post-content').value = '';
            document.getElementById('editing-post-id').value = '';
        };

        window.requestSavePost = function() {
            const content = document.getElementById('post-content').value.trim();
            if (!content && selectedImagesList.length === 0) {
                showNotification('이야기 내용이나 사진을 등록해 주세요.');
                return;
            }
            document.getElementById('save-confirm-modal').classList.remove('hidden');
        };

        window.closeSaveConfirmModal = function() {
            document.getElementById('save-confirm-modal').classList.add('hidden');
        };

        window.executeSubmitPost = async function() {
            closeSaveConfirmModal();
            const postId = document.getElementById('editing-post-id').value;
            const content = document.getElementById('post-content').value.trim();
            const finalImages = [...selectedImagesList];

            closeWriteModal();
            setDbStatus('saving');

            try {
                if (postId) {
                    await updateDoc(getPostDocRef(postId), {
                        content: content,
                        images: finalImages,
                        imageUrl: finalImages.length > 0 ? finalImages[0] : "",
                        updatedAt: new Date()
                    });
                    showNotification("게시글이 수정되었습니다.");
                } else {
                    await addDoc(getPostsCollection(), {
                        mokjangName: currentMokjang,
                        author: currentUser,
                        content: content,
                        images: finalImages,
                        imageUrl: finalImages.length > 0 ? finalImages[0] : "",
                        likes: 0,
                        likedUsers: [],
                        thumbsUp: 0,
                        thumbedUsers: [],
                        comments: [],
                        photoCaptions: {},
                        createdAt: new Date()
                    });
                    showNotification("새로운 목장 이야기가 등록되었습니다!");
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("게시글 저장 오류:", err);
                showNotification("저장 실패: " + err.message);
                setDbStatus('error');
            }
        };

        // 관리 '+' 팝오버 토글
        window.toggleActionMenu = function(postId, event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById(`action-menu-${postId}`);
            const btn = document.getElementById(`action-btn-${postId}`);
            if (!menu) return;

            const isClosed = menu.classList.contains('hidden');
            // 다른 열린 메뉴 닫기
            document.querySelectorAll('[id^="action-menu-"]').forEach(m => m.classList.add('hidden'));
            document.querySelectorAll('[id^="action-btn-"]').forEach(b => b.classList.remove('rotate-45', 'text-rose-600'));

            if (isClosed) {
                menu.classList.remove('hidden');
                if (btn) btn.classList.add('rotate-45', 'text-rose-600');
            }
        };

        // 수정 재확인
        window.requestEditPost = function(postId, content, imagesJson) {
            const menu = document.getElementById(`action-menu-${postId}`);
            if (menu) menu.classList.add('hidden');

            const yesBtn = document.getElementById('edit-confirm-yes-btn');
            yesBtn.onclick = function() {
                closeEditConfirmModal();
                openWriteModal(postId, content, imagesJson);
            };
            document.getElementById('edit-confirm-modal').classList.remove('hidden');
        };

        window.closeEditConfirmModal = function() {
            document.getElementById('edit-confirm-modal').classList.add('hidden');
        };

        // 삭제 재확인
        window.confirmDeletePost = function(postId) {
            const menu = document.getElementById(`action-menu-${postId}`);
            if (menu) menu.classList.add('hidden');

            postToDeleteId = postId;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };

        window.closeConfirmModal = function() {
            postToDeleteId = null;
            document.getElementById('confirm-modal').classList.add('hidden');
        };

        document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
            if (!postToDeleteId) return;
            setDbStatus('saving');
            try {
                await deleteDoc(getPostDocRef(postToDeleteId));
                closeConfirmModal();
                setDbStatus('connected');
                showNotification("이야기가 삭제되었습니다.");
            } catch (err) {
                console.error("삭제 에러:", err);
                showNotification("삭제 실패: " + err.message);
                setDbStatus('error');
            }
        });

        window.togglePhotoCaptionEditor = function(postId, photoIdx) {
            const editor = document.getElementById(`caption-editor-${postId}-${photoIdx}`);
            if (!editor) return;
            const isHidden = editor.classList.contains('hidden');
            editor.classList.toggle('hidden');
            if (isHidden) {
                const input = document.getElementById(`caption-input-${postId}-${photoIdx}`);
                if (input) input.focus();
            }
        };

        window.savePhotoCaption = async function(postId, photoIdx) {
            const input = document.getElementById(`caption-input-${postId}-${photoIdx}`);
            if (!input) return;
            const text = input.value.trim();

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const updated = { ...(post.photoCaptions || {}) };
            if (text) updated[photoIdx] = text;
            else delete updated[photoIdx];

            setDbStatus('saving');
            try {
                await updateDoc(getPostDocRef(postId), { photoCaptions: updated });
                setDbStatus('connected');
                showNotification("사진 이야기가 저장되었습니다.");
                const editor = document.getElementById(`caption-editor-${postId}-${photoIdx}`);
                if (editor) editor.classList.add('hidden');
            } catch (err) {
                console.error("사진 이야기 저장 오류:", err);
                showNotification("저장 실패: " + err.message);
                setDbStatus('error');
            }
        };

        async function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            if (!db) return;

            onSnapshot(getPostsCollection(), (snapshot) => {
                feedContainer.innerHTML = "";
                const posts = [];

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    // 외국인 더미 사진 영구 삭제 및 배제
                    const rawImg = data.imageUrl || "";
                    const rawImgs = Array.isArray(data.images) ? data.images.join(" ") : "";
                    if (rawImg.includes("unsplash") || rawImgs.includes("unsplash")) {
                        try { deleteDoc(getPostDocRef(docSnap.id)); } catch(e) {}
                        return;
                    }
                    posts.push({ id: docSnap.id, ...data });
                });

                cachedPosts = posts;

                if (currentActivePopupPostId) {
                    renderCommentsModalList(currentActivePopupPostId);
                }

                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="h-64 flex flex-col items-center justify-center p-4 text-center">
                            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-xs border church-border mb-2.5 text-gray-300">
                                <i class="fa-solid fa-camera-retro text-xl opacity-60"></i>
                            </div>

                            <p class="text-[10px] text-gray-400 mt-1">상단의 글쓰기 버튼을 눌러 첫 소식을 나눠주세요.</p>
                        </div>

                    return;
                }

                posts.sort((a, b) => {
                    const tA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
                    const tB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
                    return tB - tA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const thumbsCount = post.thumbsUp || 0;
                    const hasThumbed = post.thumbedUsers && post.thumbedUsers.includes(currentUser);

                    const card = document.createElement('article');

                    const photoCaptions = post.photoCaptions || {};

                    // 한 번에 올린 사진들은 한 테두리 안에 실선으로 구분되어 연속 배치

                                        <!-- 왼쪽 모서리 원형 연필 버튼 -->
                                        <button type="button" onclick="event.stopPropagation(); togglePhotoCaptionEditor('${post.id}', ${i})" 
                                                class="absolute top-2.5 left-2.5 w-7 h-7 rounded-full bg-white/90 hover:bg-white text-emerald-800 shadow-md flex items-center justify-center text-xs active:scale-90 transition-all border border-emerald-100/60 z-10" 
                                                title="이 사진 이야기 작성">
                                            <i class="fa-solid fa-pencil text-[11px]"></i>

                                        <div class="flex items-start space-x-1.5">
                                            <i class="fa-regular fa-comment-dots text-emerald-600 text-xs mt-0.5 shrink-0"></i>
                                            <span class="flex-1 whitespace-pre-wrap">${escapeHtml(caption)}</span>
                                        </div>

                                    <!-- 클릭 시 열리는 점선 테두리 글쓰기 창 -->
                                    <div id="caption-editor-${post.id}-${i}" class="hidden p-2.5 bg-emerald-50/40 border-2 border-dashed border-[#3B5D50] rounded-b-xl m-1">
                                        <div class="flex justify-between items-center mb-1 text-[11px] text-emerald-800 font-semibold">
                                            <span><i class="fa-solid fa-pencil mr-1"></i>이 사진 이야기 쓰기</span>
                                            <button type="button" onclick="togglePhotoCaptionEditor('${post.id}', ${i})" class="text-gray-400 hover:text-gray-600">
                                                <i class="fa-solid fa-xmark text-xs"></i>
                                            </button>
                                        </div>
                                        <textarea id="caption-input-${post.id}-${i}" rows="2" maxlength="150" placeholder="이 사진에 담긴 이야기를 입력해 보세요..."

                                        <div class="flex justify-end mt-1.5 space-x-1">
                                            <button type="button" onclick="togglePhotoCaptionEditor('${post.id}', ${i})" class="px-2.5 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-600 rounded">취소</button>
                                            <button type="button" onclick="savePhotoCaption('${post.id}', ${i})" class="px-3 py-1 text-[11px] church-primary text-white font-medium rounded shadow-2xs">저장</button>

                    const imagesParam = JSON.stringify(imgArray).replace(/"/g, '&quot;');
                    const commentCount = post.comments ? post.comments.length : 0;

                    card.innerHTML = `
                        <div class="w-full bg-white rounded-2xl border church-border shadow-xs flex flex-col p-3 box-border relative">
                            <!-- 작성자 헤더 & 도톰한 '+' 메뉴 토글 -->
                            <div class="flex items-center justify-between pb-1.5">
                                <div class="flex items-center space-x-2">

                                        <button onclick="requestEditPost('${post.id}', \`${escapeHtml(post.content || '')}\`, ${imagesParam})" class="w-full text-left px-2 py-1 text-xs text-gray-700 hover:bg-emerald-50 hover:text-emerald-800 rounded font-medium flex items-center space-x-1.5">
                                            <i class="fa-solid fa-pen text-[10px]"></i>
                                            <span>수정</span>
                                        </button>

                                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                                            <span>삭제</span>

                            <!-- 본문 텍스트: 창 밖 이탈 방지 줄바꿈 + 16px 폰트 확대 + 상하여백 축소 -->

        window.openCommentsModal = function(postId) {
            currentActivePopupPostId = postId;
            renderCommentsModalList(postId);
            document.getElementById('comments-popup-modal').classList.remove('hidden');
            setTimeout(() => {
                const input = document.getElementById('comments-modal-input');
                if (input) input.focus();
            }, 100);
        };

        window.closeCommentsModal = function() {
            currentActivePopupPostId = null;
            document.getElementById('comments-popup-modal').classList.add('hidden');
        };

        function renderCommentsModalList(postId) {
            const listEl = document.getElementById('comments-modal-list');
            const countEl = document.getElementById('comments-modal-count');
            if (!listEl) return;

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const comments = post.comments || [];
            countEl.innerText = comments.length;

            if (comments.length === 0) {
                listEl.innerHTML = `
                    <div class="py-12 text-center text-gray-400">
                        <i class="fa-regular fa-comments text-2xl mb-1.5 opacity-40"></i>
                        <p class="text-xs">아직 작성된 댓글이 없습니다.</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">첫 댓글로 사랑과 은혜를 나눠보세요!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="bg-gray-50 rounded-xl p-2.5 border border-gray-100 flex flex-col space-y-0.5">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-800 text-xs">${escapeHtml(c.author)}</span>
                        <span class="text-[9px] text-gray-400">${c.time || ''}</span>
                    </div>
                    <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap">${escapeHtml(c.text)}</p>
                </div>
            `).join('');

            setTimeout(() => { listEl.scrollTop = listEl.scrollHeight; }, 50);
        }

        window.addCommentFromModal = async function() {
            if (!currentActivePopupPostId) return;
            const input = document.getElementById('comments-modal-input');
            const text = input.value.trim();
            if (!text) return;

            await submitComment(currentActivePopupPostId, text);
            input.value = '';
        };

        window.toggleInlineCommentInput = function(postId) {
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) {
                row.classList.toggle('hidden');
                if (!row.classList.contains('hidden')) {
                    const input = document.getElementById(`inline-comment-input-${postId}`);
                    if (input) input.focus();
                }
            }
        };

        window.addCommentInline = async function(postId) {
            const input = document.getElementById(`inline-comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            await submitComment(postId, text);
            input.value = '';
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) row.classList.add('hidden');
        };

        async function submitComment(postId, text) {
            const now = new Date();
            const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            if (!db) return;
            setDbStatus('saving');
            try {
                await updateDoc(getPostDocRef(postId), { comments: arrayUnion(commentObj) });
                setDbStatus('connected');
                showNotification("댓글이 등록되었습니다.");
            } catch (err) {
                console.error("댓글 등록 오류:", err);
                setDbStatus('error');
            }
        }

        window.toggleLike = async function(postId, hasLiked) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasLiked) {
                    await updateDoc(getPostDocRef(postId), { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("좋아요 오류:", err);
                setDbStatus('error');
            }
        };

        window.toggleThumbsUp = async function(postId, hasThumbed) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasThumbed) {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(-1), thumbedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(1), thumbedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("엄지척 오류:", err);
                setDbStatus('error');
            }
        };

        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        window.openLightbox = function(postId, photoIdx, url) {
            currentLightboxPostId = postId;
            currentLightboxPhotoIdx = photoIdx;
            currentLightboxRotationAngle = 0;

            lightboxImg.src = url;
            lightboxImg.style.transform = `rotate(${currentLightboxRotationAngle}deg)`;
            lightboxModal.classList.remove('hidden');
        };

        window.closeLightbox = function() {
            lightboxModal.classList.add('hidden');
            currentLightboxPostId = null;
            currentLightboxPhotoIdx = null;
            currentLightboxRotationAngle = 0;
        };

        window.rotateLightboxImage = function() {
            currentLightboxRotationAngle = (currentLightboxRotationAngle + 90) % 360;
            lightboxImg.style.transform = `rotate(${currentLightboxRotationAngle}deg)`;
        };

        window.saveRotatedImagePermanent = async function() {
            if (!currentLightboxPostId || currentLightboxPhotoIdx === null) return;
            if (currentLightboxRotationAngle === 0) {
                showNotification("회전 각도를 변경한 후 저장해 주세요.");
                return;
            }

            const post = cachedPosts.find(p => p.id === currentLightboxPostId);
            if (!post) return;

            setDbStatus('saving');
            showNotification("사진 회전 각도를 저장 중입니다...");

            try {
                const rotatedDataUrl = await getRotatedDataUrl(lightboxImg.src, currentLightboxRotationAngle);
                const updatedImages = [...(post.images || [post.imageUrl])];
                updatedImages[currentLightboxPhotoIdx] = rotatedDataUrl;

                await updateDoc(getPostDocRef(currentLightboxPostId), {
                    images: updatedImages,
                    imageUrl: updatedImages[0] || ""
                });

                setDbStatus('connected');
                showNotification("🎉 사진 회전 각도가 영구 저장되었습니다!");
                closeLightbox();
            } catch (err) {
                console.error("회전 각도 영구 저장 실패:", err);
                showNotification("회전 저장 실패: " + err.message);
                setDbStatus('error');
            }
        };

        function getRotatedDataUrl(src, angle) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (angle === 90 || angle === 270) {
                        canvas.width = img.height;
                        canvas.height = img.width;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate((angle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        // 바깥 터치 시 열린 팝오버 메뉴 닫기
        document.addEventListener('click', function(e) {
            if (!e.target.closest('[id^="action-menu-"]') && !e.target.closest('[id^="action-btn-"]')) {
                document.querySelectorAll('[id^="action-menu-"]').forEach(m => m.classList.add('hidden'));
                document.querySelectorAll('[id^="action-btn-"]').forEach(b => b.classList.remove('rotate-45', 'text-rose-600'));
            }
        });

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
