<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 꿈의 목장</title>
    <!-- [모바일 속도 최적화: 외부 리소스 사전 연결 & DNS 프리페치] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B5D50'/%3E%3Cpath d='M16 7v18M10 13h12' stroke='%23ffffff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3B5D50">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 폰트 20종 클래스 */
        .font-pretendard { font-family: 'Pretendard', sans-serif !important; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif !important; }
        .font-pen { font-family: 'Nanum Pen Script', cursive !important; font-size: 1.15em; }
        .font-gowun-dodum { font-family: 'Gowun Dodum', sans-serif !important; }
        .font-gowun-batang { font-family: 'Gowun Batang', serif !important; }
        .font-jua { font-family: 'Jua', sans-serif !important; }
        .font-dongle { font-family: 'Dongle', sans-serif !important; font-size: 1.25em; }
        .font-songmyung { font-family: 'Song Myung', serif !important; }
        .font-dohyeon { font-family: 'Do Hyeon', sans-serif !important; }
        .font-gamja { font-family: 'Gamja Flower', cursive !important; }
        .font-roboto { font-family: 'Roboto', sans-serif !important; }
        .font-montserrat { font-family: 'Montserrat', sans-serif !important; }
        .font-poppins { font-family: 'Poppins', sans-serif !important; }
        .font-playfair { font-family: 'Playfair Display', serif !important; }
        .font-cinzel { font-family: 'Cinzel', serif !important; }
        .font-oswald { font-family: 'Oswald', sans-serif !important; }
        .font-dancing { font-family: 'Dancing Script', cursive !important; }
        .font-caveat { font-family: 'Caveat', cursive !important; }
        .font-pacifico { font-family: 'Pacifico', cursive !important; }
        .font-greatvibes { font-family: 'Great Vibes', cursive !important; }

        html, body {
            width: 100%; height: 100%; max-width: 100%; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; color: #222222;
            -webkit-tap-highlight-color: transparent; touch-action: pan-y;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        header { padding-top: max(env(safe-area-inset-top, 0px), 0px); }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes dreamShimmerSlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .dream-shimmer-text {
            background: linear-gradient(90deg, #111827 0%, #1f2937 32%, #ffffff 50%, #1f2937 68%, #111827 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: dreamShimmerSlow 7s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes swayWelcome {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-2deg) translateY(-0.5px); }
            75% { transform: rotate(2deg) translateY(0.5px); }
        }
        .animate-sway-welcome { display: inline-block; animation: swayWelcome 3.5s ease-in-out infinite; transform-origin: center center; }

        @keyframes penLiveMotion {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-14deg) translateY(-2px) scale(1.08); }
            30% { transform: rotate(8deg) translateY(1px) scale(0.96); }
            45% { transform: rotate(-6deg) translateY(-1px) scale(1.03); }
            60% { transform: rotate(0deg) scale(1); }
        }
        .animate-pen-live { animation: penLiveMotion 4s ease-in-out infinite; transform-origin: bottom right; }

        /* [IMG_1035.png 기반 제스처 인증 게이트 & 중앙 가로 갈라짐 + 빛 + 코드박스 애니메이션] */
        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background-image: url('IMG_1035.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; transition: opacity 0.6s ease;
        }

        /* 중앙 가로 갈라지는 분할 컨테이너 */
        .gate-split-container {
            position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }
        .gate-half {
            position: absolute. width: 100%; height: 50%; left: 0; overflow: hidden; transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
            background-image: url('IMG_1035.png'); background-size: cover; background-repeat: no-repeat;
        }
        .gate-top-half { top: 0; background-position: center top; border-bottom: 1.5px solid rgba(255,255,255,0.4); }
        .gate-bottom-half { bottom: 0; background-position: center bottom; border-top: 1.5px solid rgba(255,255,255,0.4); }

        /* 열릴 때 상하로 갈라지는 클래스 */
        .gate-split-active .gate-top-half { transform: translateY(-100%); }
        .gate-split-active .gate-bottom-half { transform: translateY(100%); }

        /* 중앙 가로 빛 광채 (가르면서 빛 발산) */
        #gate-center-beam {
            position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #ffffff;
            box-shadow: 0 0 35px 15px rgba(255, 255, 255, 0.85), 0 0 70px 30px rgba(139, 92, 246, 0.6);
            opacity: 0; z-index: 25; transition: all 0.5s ease;
        }
        .gate-split-active #gate-center-beam { opacity: 1; height: 12px; transform: scaleY(3); }

        /* 안에서 벌어지며 나타나는 사각 박스 (코드박스, 이름) */
        #code-auth-box {
            position: absolute. z-index: 30; opacity: 0; transform: scale(0.5) translateY(20px); pointer-events: none;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }
        #code-auth-box.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        /* 가이드 텍스트 및 터치 영역 */
        .gate-guide-overlay {
            position: absolute; bottom: 48px; left: 0; right: 0; z-index: 20; text-align: center; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .gate-guide-badge {
            display: inline-block; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fef08a; padding: 8px 18px; border-radius: 9999px; font-size: 12px; font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(250, 204, 21, 0.7); }
        }

        /* 기타 UI 스타일 */
        #feed-container { -webkit-overflow-scrolling: touch; overflow-y: auto; scrollbar-width: thin; }
        #feed-container::-webkit-scrollbar { width: 4px; }
        #feed-container::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.15); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [IMG_1035.png 배경 기반 3단계 제스처 & 중앙 가로 갈라짐 인증 게이트] -->
    <div id="auth-gate">
        <div class="gate-split-container" id="gate-container">
            <!-- 상단 분할 영역 (IMG_1035.png 상단 배경) -->
            <div class="gate-half gate-top-half" id="gate-top"></div>
            <!-- 하단 분할 영역 (IMG_1035.png 하단 배경) -->
            <div class="gate-half gate-bottom-half" id="gate-bottom"></div>

            <!-- 중앙 가로 빛 광채 라인 -->
            <div id="gate-center-beam"></div>

            <!-- 중앙 가로 갈라진 틈에서 빛과 함께 벌어져 나오는 사각 박스 (코드박스, 이름) -->
            <div id="code-auth-box" class="w-[90%] max-w-xs bg-white/92 backdrop-blur-2xl p-6 rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.9)] border-2 border-white/80 text-gray-800">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
                    <div class="flex items-center space-x-1.5">
                        <span class="text-lg">🌿</span>
                        <h3 class="text-sm font-black text-emerald-900 tracking-tight">꿈의 목장 인증</h3>
                    </div>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">23목장</span>
                </div>

                <div class="space-y-3 text-left">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1">목장 코드 (예: 23목장)</label>
                        <input type="text" id="input-mokjang-code" placeholder="코드를 입력하세요" class="w-full px-3 py-2 rounded-xl border border-emerald-200 text-xs bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-2xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1">목원 이름</label>
                        <input type="text" id="input-member-name" placeholder="성함을 입력하세요" class="w-full px-3 py-2 rounded-xl border border-emerald-200 text-xs bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-2xs">
                    </div>
                    <button type="button" onclick="handleMemberLogin()" class="w-full py-2.5 church-primary hover:opacity-95 text-white rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all mt-1 flex items-center justify-center space-x-1">
                        <span>목장 이야기 입장하기</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- 하단 제스처 가이드 배지 (두 손가락 벌리기 또는 터치) -->
            <div class="gate-guide-overlay" id="gate-guide-badge-box">
                <div class="gate-guide-badge">
                    ✨ 두 손가락으로 벌리거나 터치하여 목장을 열어주세요
                </div>
            </div>
        </div>
    </div>

    <!-- [상단 헤더] -->
    <header class="h-[52px] shrink-0 bg-white border-b church-border shadow-2xs px-4 flex items-center justify-between w-full z-30 relative max-w-md mx-auto">
        <div class="w-8 shrink-0 flex items-center justify-start"></div>
        <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center">
            <h1 class="text-[17.5px] font-black tracking-tight leading-tight truncate whitespace-nowrap dream-shimmer-text" id="header-mokjang-title">
                세종꿈의교회 23목장
            </h1>
            <p class="text-[10px] text-gray-500 font-medium truncate whitespace-nowrap leading-none mt-0.5 animate-sway-welcome select-none" id="header-user-display">목장 가족님 환영합니다</p>
        </div>
        <div class="shrink-0 relative flex items-center justify-end w-8">
            <button onclick="openHelpModal()" class="w-7 h-7 rounded-full flex items-center justify-center church-accent church-primary-text border border-emerald-200/80 shadow-2xs text-xs font-bold" title="도움말">
                <i class="fa-solid fa-question text-xs"></i>
            </button>
        </div>
    </header>

    <!-- [메인 피드 영역] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-0.5" id="feed-container">
        <div class="w-full px-2 pt-4 pb-2 text-center space-y-2">
            <div class="bg-white rounded-2xl border church-border p-4 shadow-2xs">
                <h3 class="text-sm font-bold text-gray-800">🌿 꿈의 목장 피드</h3>
                <p class="text-xs text-gray-500 mt-1">로그인이 완료되었습니다. 따뜻한 이야기를 나눠보세요.</p>
            </div>
        </div>
    </main>

    <script>
        // [제스처 및 중앙 가로 갈라짐 + 빛 + 사각 박스 등장 인터랙션]
        const authGate = document.getElementById('auth-gate');
        const gateContainer = document.getElementById('gate-container');
        const codeAuthBox = document.getElementById('code-auth-box');
        const guideBadgeBox = document.getElementById('gate-guide-badge-box');

        let isGateOpened = false;

        function triggerGateOpen() {
            if (isGateOpened) return;
            isGateOpened = true;

            // 1. 가이드 배지 페이드아웃
            if (guideBadgeBox) guideBadgeBox.style.opacity = '0';

            // 2. 상하 분할 및 중앙 빛 광채 애니메이션 클래스 부여
            gateContainer.classList.add('gate-split-active');

            // 3. 중앙 틈새에서 사각 박스(코드 및 이름)가 빛과 함께 벌어져 등장
            setTimeout(() => {
                codeAuthBox.classList.add('active');
            }, 350);
        }

        // 화면 터치 또는 클릭 시 열림 트리거 (테스트 및 모바일 편의성)
        authGate.addEventListener('click', (e) => {
            if (!codeAuthBox.contains(e.target)) {
                triggerGateOpen();
            }
        });

        // 두 손가락 핀치-줌(벌리기) 제스처 감지
        let initialPinchDist = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (currentDist - initialPinchDist > 65) {
                    triggerGateOpen();
                    initialPinchDist = 0;
                }
            }
        });

        function handleMemberLogin() {
            const code = document.getElementById('input-mokjang-code').value.trim();
            const name = document.getElementById('input-member-name').value.trim();
            if (!code || !name) {
                alert("목장 코드와 이름을 모두 입력해 주세요.");
                return;
            }

            // 인증 완료 후 게이트 페이드아웃
            authGate.style.opacity = '0';
            setTimeout(() => {
                authGate.style.display = 'none';
            }, 600);

            const displayEl = document.getElementById('header-user-display');
            if (displayEl) {
                displayEl.innerHTML = `${escapeHtml(name)}님 <span class="text-emerald-500 font-semibold">환영합니다</span>`;
            }
        }

        function openHelpModal() {
            alert("📖 [꿈의 목장 사용설명서]\n- 배경의 교회 로고와 문구를 두 손가락으로 벌리거나 터치하면 중앙에서 인증 박스가 나타납니다.\n- 코드와 이름을 입력하고 입장해 주세요.");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
