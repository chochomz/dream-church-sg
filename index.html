<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8F9FA;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
        }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #D4DCD7; }

        /* 이미지 확대/축소 라이트박스 스타일 */
        #lightbox-modal {
            touch-action: none;
        }
        #lightbox-img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ========================================== -->
    <!-- 1. 시크릿 입장 화면 (실제 교회 로고 적용, 7번 터치) -->
    <!-- ========================================== -->
    <div id="secret-gate-screen" class="fixed inset-0 z-50 church-primary flex flex-col items-center justify-center p-6 text-white">
        <div class="text-center cursor-pointer select-none group" id="secret-logo-btn" title="빠르게 7번 터치하세요">
            <div class="w-64 h-24 bg-white rounded-2xl flex items-center justify-center p-3 mx-auto mb-6 shadow-2xl group-active:scale-95 transition-transform border border-white/20">
                <!-- 실제 교회 로고 이미지 (선명도 및 비율 최적화) -->
                <img src="image0.jpeg" alt="세종꿈의교회 로고" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl font-bold tracking-wider mb-2">세종꿈의교회 23목장</h1>
            <p class="text-sm text-emerald-100/80 font-light">우리들의 목장 이야기</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. 사용자 인증 모달 -->
    <!-- ========================================== -->
    <div id="auth-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border church-border">
            <div class="text-center mb-5">
                <div class="w-12 h-12 church-accent church-primary-text rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">목장 멤버 인증</h3>
                <p class="text-xs text-gray-500 mt-1">목자/부목자님이 사전에 지정한 성함만 입력해 주세요.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">참여 직분 / 성함</label>
                    <input type="text" id="auth-username-input" placeholder="예: 김목자, 이부목자, 홍길동" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">현재 목장 이름</label>
                    <input type="text" id="auth-mokjang-input" value="세종꿈의교회 23목장" placeholder="목장 이름 입력" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <button onclick="handleUserLogin()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md hover:opacity-95 transition-opacity">
                    입장하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. 메인 피드 화면 -->
    <!-- ========================================== -->
    <div id="main-feed-screen" class="flex flex-col flex-1 hidden">
        <!-- 상단 고정 헤더 -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b church-border shadow-xs px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-24 bg-white rounded-lg flex items-center justify-center p-1 border church-border shadow-2xs">
                    <!-- 상단 헤더 로고 -->
                    <img src="image0.jpeg" alt="세종꿈의교회 로고" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-bold text-gray-800" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                    <p class="text-[10px] text-gray-500" id="header-user-display">로그인 정보 없음</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-medium flex items-center space-x-1 shadow-xs hover:bg-[#d8e8e0] transition-colors">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <span>사진 이야기 올리기</span>
                </button>
            </div>
        </header>

        <!-- 피드 목록 영역 (인피니트 스크롤 구조) -->
        <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4 pb-24" id="feed-container">
            <!-- 동적 피드 카드가 이곳에 렌더링 됩니다 -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 4. 게시글(사진 이야기) 작성 모달 -->
    <!-- ========================================== -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl border church-border">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-gray-800"><i class="fa-solid fa-camera church-primary-text mr-2"></i>사역 및 야유회 사진 이야기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">목장 이름 (구분 기준)</label>
                    <input type="text" id="post-mokjang-name" value="세종꿈의교회 23목장" class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">사진 링크 (URL) 또는 첨부 설명</label>
                    <input type="text" id="post-image-url" placeholder="이미지 주소(URL)를 입력하세요 (예: 식당 봉사, 야유회 사진)" class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none">
                    <p class="text-[10px] text-gray-400 mt-1">💡 핸드폰 갤러리의 사진 링크나 웹 이미지 주소를 붙여넣어 주세요.</p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">간단한 이야기 (식당 봉사, 야유회 등)</label>
                    <textarea id="post-content" rows="3" placeholder="예: 은혜로운 교회 식당 사역 후기, 즐거웠던 목장 야유회 나눔입니다!" class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none resize-none"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="post-display-check" checked class="w-4 h-4 text-[#3B5D50] rounded border-gray-300 focus:ring-[#3B5D50]">
                    <label for="post-display-check" class="text-xs text-gray-700 font-medium">관리자 체크 (현재 피드 화면에 디스플레이)</label>
                </div>
                <button onclick="submitNewPost()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md hover:opacity-95 transition-opacity">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. 사진 확대보기 (핀치 줌 및 슬라이드 최적화 라이트박스) -->
    <!-- ========================================== -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center hidden">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-2xl p-2 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="overflow-hidden w-full h-full flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 이미지" class="max-w-full max-h-full object-contain select-none">
        </div>
        <div class="absolute bottom-6 text-white text-xs bg-black/50 px-3 py-1 rounded-full pointer-events-none">
            손가락 두 개로 확대/축소 및 드래그가 가능합니다
        </div>
    </div>

    <!-- 푸터 안내 -->
    <footer class="text-center py-6 text-xs text-gray-400 border-t church-border bg-white mt-auto">
        <p>그리스도의 은혜를 나누는 마음</p>
        <p class="mt-1">세종꿈의교회 23목장</p>
    </footer>

    <!-- ========================================== -->
    <!-- Firebase SDK 및 연동 로직 (dream-data) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "dream-data.firebaseapp.com",
            projectId: "dream-data",
            storageBucket: "dream-data.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let tapCount = 0;
        let tapTimer = null;
        let currentUser = null;
        let currentMokjang = "세종꿈의교회 23목장";

        // 1. 시크릿 게이트 (로고 7번 터치)
        const logoBtn = document.getElementById('secret-logo-btn');
        logoBtn.addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 7) {
                tapCount = 0;
                document.getElementById('secret-gate-screen').classList.add('hidden');
                document.getElementById('auth-modal').classList.remove('hidden');
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 800);
            }
        });

        // 2. 사용자 로그인
        window.handleUserLogin = function() {
            const usernameInput = document.getElementById('auth-username-input').value.trim();
            const mokjangInput = document.getElementById('auth-mokjang-input').value.trim();

            if (!usernameInput) { alert('참여하실 성함이나 직분을 입력해 주세요.'); return; }
            if (!mokjangInput) { alert('목장 이름을 입력해 주세요.'); return; }

            currentUser = usernameInput;
            currentMokjang = mokjangInput;

            document.getElementById('header-user-display').innerText = `${currentUser} 님`;
            document.getElementById('header-mokjang-title').innerText = currentMokjang;
            document.getElementById('post-mokjang-name').value = currentMokjang;

            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-feed-screen').classList.remove('hidden');

            loadMokjangFeed();
        };

        // 3. 모달 제어
        window.openWriteModal = function() { document.getElementById('write-modal').classList.remove('hidden'); };
        window.closeWriteModal = function() { document.getElementById('write-modal').classList.add('hidden'); };

        // 4. 사진 이야기 등록 (식당 사역, 야유회 등)
        window.submitNewPost = async function() {
            const mokjangName = document.getElementById('post-mokjang-name').value.trim();
            const imageUrl = document.getElementById('post-image-url').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const isChecked = document.getElementById('post-display-check').checked;

            if (!imageUrl && !content) {
                alert('사진 링크 또는 간단한 이야기를 입력해 주세요.');
                return;
            }

            try {
                await addDoc(collection(db, "mokjang_posts"), {
                    mokjangName: mokjangName,
                    author: currentUser,
                    imageUrl: imageUrl || "image0.jpeg",
                    content: content,
                    isChecked: isChecked,
                    likes: 0,
                    likedUsers: [],
                    comments: [],
                    createdAt: new Date()
                });

                document.getElementById('post-image-url').value = '';
                document.getElementById('post-content').value = '';
                closeWriteModal();
            } catch (error) {
                console.error("등록 오류:", error);
                alert("등록 중 오류가 발생했습니다.");
            }
        };

        // 5. 실시간 피드 로드 및 목장 격리
        function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            const q = query(
                collection(db, "mokjang_posts"),
                where("mokjangName", "==", currentMokjang),
                where("isChecked", "==", true)
            );

            onSnapshot(q, (snapshot) => {
                feedContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    feedContainer.innerHTML = `
                        <div class="text-center py-16 text-gray-400">
                            <i class="fa-solid fa-camera-retro text-4xl mb-3 opacity-40"></i>
                            <p class="text-sm">등록된 사역 및 야유회 사진 이야기가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                const posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                    return timeB - timeA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden shadow-xs border church-border space-y-3 pb-3";
                    
                    let commentsHtml = '';
                    if (post.comments && post.comments.length > 0) {
                        commentsHtml = post.comments.map(c => `
                            <div class="bg-gray-50 rounded-xl p-2.5 text-xs flex justify-between items-start">
                                <div>
                                    <span class="font-bold text-gray-700 mr-2">${c.author}</span>
                                    <span class="text-gray-600">${c.text}</span>
                                </div>
                                <span class="text-[10px] text-gray-400">${c.time || ''}</span>
                            </div>
                        `).join('');
                    }

                    card.innerHTML = `
                        <div class="flex items-center justify-between px-4 pt-4">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full church-accent church-primary-text flex items-center justify-center font-bold text-xs">
                                    ${post.author.charAt(0)}
                                </div>
                                <div>
                                    <span class="text-xs font-bold text-gray-800">${post.author}</span>
                                    <span class="text-[10px] text-gray-400 ml-1">(${post.mokjangName})</span>
                                </div>
                            </div>
                            <span class="text-[11px] text-gray-400">${formatDate(post.createdAt)}</span>
                        </div>

                        <!-- 사진 영역 -->
                        <div class="w-full bg-black/5 overflow-hidden cursor-pointer" onclick="openLightbox('${post.imageUrl}')">
                            <img src="${post.imageUrl}" alt="목장 사역 및 야유회 사진" class="w-full max-h-96 object-cover hover:scale-102 transition-transform duration-300">
                        </div>

                        <div class="px-4 space-y-2">
                            <div class="text-sm text-gray-700 leading-relaxed">${escapeHtml(post.content)}</div>
                            
                            <!-- 하트 및 반응 바 -->
                            <div class="flex items-center justify-between pt-2 border-t church-border">
                                <button onclick="toggleLike('${post.id}', ${hasLiked})" class="flex items-center space-x-1.5 text-xs font-medium ${hasLiked ? 'text-rose-500' : 'text-gray-500 hover:text-rose-500'} transition-colors">
                                    <i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-base"></i>
                                    <span>${post.likes || 0}</span>
                                </button>
                                <span class="text-xs text-gray-400"><i class="fa-regular fa-comment-dots mr-1"></i>댓글 ${post.comments ? post.comments.length : 0}</span>
                            </div>

                            <!-- 댓글 목록 및 입력 -->
                            <div class="space-y-2 pt-2">
                                <div class="space-y-1.5 max-h-32 overflow-y-auto">${commentsHtml}</div>
                                <div class="flex space-x-2 pt-1">
                                    <input type="text" id="comment-input-${post.id}" placeholder="응원 댓글을 남겨주세요..." class="flex-1 px-3 py-1.5 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none">
                                    <button onclick="addComment('${post.id}')" class="px-3 py-1.5 church-primary text-white rounded-xl text-xs font-medium">등록</button>
                                </div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            });
        }

        // 6. 좋아요 토글
        window.toggleLike = async function(postId, hasLiked) {
            const postRef = doc(db, "mokjang_posts", postId);
            try {
                if (hasLiked) {
                    await updateDoc(postRef, { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(postRef, { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
            } catch (error) { console.error("좋아요 오류:", error); }
        };

        // 7. 응원 댓글 추가
        window.addComment = async function(postId) {
            const inputEl = document.getElementById(`comment-input-${postId}`);
            const text = inputEl.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            const postRef = doc(db, "mokjang_posts", postId);
            try {
                await updateDoc(postRef, { comments: arrayUnion(commentObj) });
                inputEl.value = '';
            } catch (error) { console.error("댓글 오류:", error); }
        };

        // ==========================================
        // 8. 모바일 최적화 사진 뷰어 (핀치 줌 & 슬라이드 기능)
        // ==========================================
        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;

        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        window.openLightbox = function(url) {
            lightboxImg.src = url;
            scale = 1;
            pointX = 0;
            pointY = 0;
            updateImageTransform();
            lightboxModal.classList.remove('hidden');
        };

        window.closeLightbox = function() {
            lightboxModal.classList.add('hidden');
        };

        function updateImageTransform() {
            lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        let initialDistance = null;

        lightboxModal.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        });

        lightboxModal.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = currentDistance / initialDistance;
                scale = Math.min(Math.max(1, scale * zoomFactor), 4);
                initialDistance = currentDistance;
                updateImageTransform();
            } else if (panning && e.touches.length === 1) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                updateImageTransform();
            }
        });

        lightboxModal.addEventListener('touchend', () => {
            initialDistance = null;
            panning = false;
            if (scale === 1) {
                pointX = 0;
                pointY = 0;
                updateImageTransform();
            }
        });

        let lastTapTime = 0;
        lightboxImg.addEventListener('click', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTapTime < 300) {
                scale = scale > 1 ? 1 : 2.5;
                pointX = 0;
                pointY = 0;
                updateImageTransform();
            }
            lastTapTime = currentTime;
        });

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
