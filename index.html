<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8F9FA;
            color: #222222;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #secret-gate-screen {
            user-select: none;
            -webkit-user-select: none;
        }

        #secret-logo-img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes divine-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(59, 93, 80, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px 10px rgba(59, 93, 80, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
                transform: scale(1.02);
            }
        }

        .glowing-logo {
            animation: divine-glow 4s ease-in-out infinite;
        }

        /* 1화면 1카드 상하 스냅 스크롤 */
        #feed-container {
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            height: calc(100dvh - 46px);
            scrollbar-width: none;
            touch-action: pan-y;
        }
        #feed-container::-webkit-scrollbar {
            display: none;
        }
        .feed-card-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            height: calc(100dvh - 46px);
            min-height: calc(100dvh - 46px);
            box-sizing: border-box;
        }

        #lightbox-modal, #auth-modal, #write-modal, #confirm-modal, #save-confirm-modal, #db-status-modal, #comments-popup-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }
        #lightbox-img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        /* 가로 스와이프 이미지 컨테이너 */
        .image-snap-row {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .image-snap-row::-webkit-scrollbar {
            display: none;
        }
        .image-snap-item {
            scroll-snap-align: center;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [비밀 게이트 인트로] -->
    <div id="secret-gate-screen" class="fixed inset-0 z-50 church-primary flex flex-col items-center justify-center p-4 text-white text-center w-full h-full">
        <div class="cursor-pointer select-none group relative inline-block" id="secret-login-area">
            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center p-2.5 mx-auto mb-5 shadow-2xl group-active:scale-95 transition-transform border-4 border-white/40 overflow-hidden glowing-logo relative z-10">
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain" id="secret-logo-img">
                    <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1" filter="blur(10px)" />
                    <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                    <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                    <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                    <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                </svg>
            </div>
            <div class="absolute inset-0 w-full h-full rounded-full z-20 cursor-pointer" id="secret-tap-overlay"></div>
        </div>

        <div class="select-none space-y-1">
            <h1 class="text-3xl font-extrabold tracking-wider text-white whitespace-nowrap">세종꿈의교회</h1>
            <h2 class="text-xl font-semibold text-emerald-100 tracking-wide whitespace-nowrap mt-1">23목장</h2>
            <div class="h-4"></div>
            <p class="text-xs text-emerald-100/90 font-light whitespace-nowrap">우리들의 목장 이야기</p>
        </div>
    </div>

    <!-- [목장원 인증 모달] -->
    <div id="auth-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-5 shadow-2xl border church-border">
            <div class="text-center mb-4">
                <div class="w-10 h-10 church-accent church-primary-text rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fa-solid fa-user-shield text-base"></i>
                </div>
                <h3 class="text-base font-bold text-gray-800 whitespace-nowrap">목장 멤버 인증</h3>
                <p class="text-[11px] text-gray-500 mt-0.5 whitespace-nowrap">성함과 목장 이름을 입력해 주세요.</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1 whitespace-nowrap">성함 / 직분</label>
                    <input type="text" id="auth-username-input" placeholder="예: 김목자, 홍길동" class="w-full px-3 py-2 rounded-lg border church-border text-xs focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1 whitespace-nowrap">목장 이름</label>
                    <input type="text" id="auth-mokjang-input" value="세종꿈의교회 23목장" class="w-full px-3 py-2 rounded-lg border church-border text-xs focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                </div>
                <button onclick="handleUserLogin()" class="w-full py-2.5 church-primary text-white rounded-lg font-medium text-xs shadow-xs whitespace-nowrap">
                    입장하기
                </button>
            </div>
        </div>
    </div>

    <!-- [메인 화면] -->
    <div id="main-feed-screen" class="flex flex-col h-full w-full max-w-full overflow-hidden hidden">
        <header class="h-[46px] shrink-0 bg-white border-b church-border shadow-xs px-2.5 flex items-center justify-between w-full z-30">
            <div class="flex items-center space-x-1.5 overflow-hidden">
                <div class="w-7 h-7 church-primary rounded-full flex items-center justify-center p-0.5 shadow-xs border border-emerald-100 overflow-hidden bg-white shrink-0">
                    <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                        <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                        <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                        <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                        <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                    </svg>
                </div>
                <div class="overflow-hidden leading-tight">
                    <h1 class="text-[11px] font-bold text-gray-800 truncate whitespace-nowrap" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                    <p class="text-[9px] text-gray-500 truncate whitespace-nowrap" id="header-user-display">로그인 정보 없음</p>
                </div>
            </div>
            
            <div class="shrink-0 flex items-center space-x-2">
                <!-- 상부 연동 램프 (설명 텍스트 없음, 연한 파스텔 톤) -->
                <button type="button" onclick="openDbStatusModal()" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors focus:outline-none">
                    <span id="db-status-lamp" class="w-2.5 h-2.5 rounded-full bg-sky-300 animate-pulse transition-all"></span>
                </button>
                <button onclick="openWriteModal()" class="px-2.5 py-1 church-accent church-primary-text rounded text-[11px] font-medium flex items-center space-x-1 shadow-2xs whitespace-nowrap">
                    <i class="fa-solid fa-camera text-[10px]"></i>
                    <span>글쓰기</span>
                </button>
            </div>
        </header>

        <!-- 피드 메인 컨테이너: 상하 1화면 리미티드 스크롤 (Snap) -->
        <main class="w-full max-w-md mx-auto overflow-hidden bg-[#F8F9FA]" id="feed-container">
            <!-- 동적 피드 카드가 1화면씩 렌더링됩니다 -->
        </main>
    </div>

    <!-- 심플 연동 상태 팝업 모달 -->
    <div id="db-status-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-xl border church-border text-center space-y-3">
            <div class="flex items-center justify-between pb-1 border-b church-border">
                <span class="text-xs font-bold text-gray-700">시스템 연동 상태</span>
                <button onclick="closeDbStatusModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="py-2 flex flex-col items-center justify-center space-y-2">
                <div id="modal-status-badge" class="w-10 h-10 rounded-full flex items-center justify-center text-white bg-emerald-300 shadow-xs">
                    <i id="modal-status-icon" class="fa-solid fa-cloud-check text-lg text-emerald-800"></i>
                </div>
                <div>
                    <h4 id="modal-status-title" class="text-xs font-bold text-gray-800">정상 연동됨</h4>
                    <p id="modal-status-desc" class="text-[10px] text-gray-500 mt-0.5">Firebase 클라우드와 실시간 동기화 중입니다.</p>
                </div>
            </div>
            <div class="bg-gray-50 p-2 rounded text-[10px] text-gray-600 text-left space-y-1">
                <div class="flex justify-between">
                    <span class="text-gray-400">데이터베이스:</span>
                    <span class="font-medium">Cloud Firestore</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">컬렉션:</span>
                    <span class="font-medium text-emerald-700">mokjang_posts</span>
                </div>
            </div>
            <button onclick="closeDbStatusModal()" class="w-full py-1.5 church-primary text-white rounded text-xs font-medium">닫기</button>
        </div>
    </div>

    <!-- [댓글 전용 팝업 스크린 모달 (상하 스크롤)] -->
    <div id="comments-popup-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex flex-col justify-end hidden">
        <div class="bg-white rounded-t-2xl w-full max-w-md mx-auto max-h-[75vh] flex flex-col shadow-2xl border-t church-border overflow-hidden">
            <!-- 팝업 헤더 -->
            <div class="flex items-center justify-between px-3 py-2.5 border-b church-border shrink-0 bg-gray-50/70">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-regular fa-comment-dots church-primary-text text-sm"></i>
                    <h3 class="text-xs font-bold text-gray-800">댓글 <span id="comments-modal-count" class="text-emerald-700 font-semibold">0</span></h3>
                </div>
                <button onclick="closeCommentsModal()" class="w-6 h-6 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-200 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 팝업 상하 스크롤 댓글 목록 -->
            <div id="comments-modal-list" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
                <!-- 댓글 항목들이 상하 스크롤 형태로 여기에 렌더링됩니다 -->
            </div>

            <!-- 팝업 하단 작성 영역 -->
            <div class="p-2 border-t church-border bg-white shrink-0 flex items-center space-x-1.5">
                <input type="text" id="comments-modal-input" maxlength="200" placeholder="댓글을 입력하세요..." 
                       onkeydown="if(event.key==='Enter') addCommentFromModal()" 
                       class="flex-1 px-2.5 py-1.5 text-xs bg-gray-50 border church-border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                <button onclick="addCommentFromModal()" class="px-3 py-1.5 church-primary text-white text-xs font-medium rounded-lg whitespace-nowrap shadow-2xs">
                    등록
                </button>
            </div>
        </div>
    </div>

    <!-- [글쓰기 모달] -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-2 hidden">
        <div class="bg-white rounded-xl w-full max-w-sm p-3 shadow-2xl border church-border max-h-[85vh] flex flex-col overflow-y-auto">
            <div class="flex items-center justify-between pb-1.5 border-b church-border shrink-0">
                <h3 class="text-xs font-bold text-gray-800 whitespace-nowrap" id="modal-title-text"><i class="fa-solid fa-camera church-primary-text mr-1"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-0.5"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <div class="space-y-2.5 flex-1 overflow-y-auto pt-2">
                <input type="hidden" id="editing-post-id" value="">
                
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-[10px]">
                        <label class="font-medium text-gray-600 whitespace-nowrap">사진 추가 (최대 5장)</label>
                        <span id="image-count-indicator" class="text-gray-400 whitespace-nowrap">0 / 5장</span>
                    </div>

                    <!-- 사진/파일 단독 업로드 버튼 (URL 버튼 삭제) -->
                    <label class="w-full border border-dashed church-border rounded-lg py-2.5 px-2 text-center cursor-pointer hover:bg-emerald-50 text-[11px] flex items-center justify-center space-x-1.5 transition-colors bg-gray-50/50">
                        <i class="fa-solid fa-images church-primary-text text-sm shrink-0"></i>
                        <span class="font-medium text-gray-700 whitespace-nowrap">앨범 / 카메라에서 사진 선택</span>
                        <input type="file" id="post-multi-file-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">
                    </label>

                    <div id="selected-images-grid" class="grid grid-cols-3 gap-1.5 mt-1">
                        <!-- 선택된 썸네일 -->
                    </div>
                </div>

                <div class="w-full" id="post-content-container">
                    <div class="flex justify-between items-center mb-0.5 text-[10px]">
                        <span class="font-medium text-gray-600 whitespace-nowrap">내용 입력</span>
                        <span id="char-count-indicator" class="text-gray-400 whitespace-nowrap">0 / 200자</span>
                    </div>
                    <textarea id="post-content" rows="3" maxlength="200" onfocus="scrollToContentInput()" oninput="updateCharCount(this)" placeholder="내용을 입력하세요..." class="w-full px-2 py-1.5 rounded-lg border border-[#E5E7EB] text-xs focus:ring-1 focus:ring-[#3B5D50] focus:border-[#3B5D50] focus:outline-none resize-none bg-white block"></textarea>
                </div>
                <div class="flex items-center space-x-1.5">
                    <input type="checkbox" id="post-display-check" checked class="w-3.5 h-3.5 text-[#3B5D50] rounded border-gray-300">
                    <label for="post-display-check" class="text-[11px] text-gray-700 font-medium whitespace-nowrap">피드에 즉시 노출</label>
                </div>
                <button onclick="requestSavePost()" class="w-full py-2 church-primary text-white rounded-lg font-medium text-xs shadow-xs whitespace-nowrap" id="submit-btn-text">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <!-- [저장 확인 모달] -->
    <div id="save-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800 whitespace-nowrap">게시글 저장</h3>
                <p class="text-[11px] text-gray-500 mt-0.5 whitespace-nowrap">저장 하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
                <button onclick="closeSaveConfirmModal()" class="py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-medium whitespace-nowrap">취소</button>
                <button onclick="executeSubmitPost()" class="py-2 church-primary text-white rounded-lg text-xs font-medium whitespace-nowrap">저장하기</button>
            </div>
        </div>
    </div>

    <!-- [삭제 확인 모달] -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800 whitespace-nowrap">게시글 삭제</h3>
                <p class="text-[11px] text-gray-500 mt-0.5 whitespace-nowrap">정말 이 이야기를 삭제하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
                <button onclick="closeConfirmModal()" class="py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-medium whitespace-nowrap">취소</button>
                <button id="confirm-yes-btn" class="py-2 bg-rose-500 text-white rounded-lg text-xs font-medium whitespace-nowrap">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- [라이트박스 모달] -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center hidden">
        <button onclick="closeLightbox()" class="absolute top-3 right-3 text-white text-lg p-2 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="overflow-hidden w-full h-full flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 이미지" class="max-w-full max-h-full object-contain select-none">
        </div>
        <div class="absolute bottom-4 text-white text-[10px] bg-black/60 px-2.5 py-0.5 rounded-full pointer-events-none whitespace-nowrap">
            두 손가락으로 확대/축소 가능
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let tapCount = 0;
        let tapTimer = null;
        let currentUser = null;
        let currentMokjang = "세종꿈의교회 23목장";
        let selectedImagesList = [];
        let postToDeleteId = null;
        let isAuthReady = false;
        let currentDbStatus = 'connecting';
        let currentActivePopupPostId = null;
        let cachedPosts = [];

        // Firebase 프로젝트 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDKD5LUQL84ZuPH5UJrHBj7yAYDTabDWVA",
            authDomain: "dream-data-146a4.firebaseapp.com",
            projectId: "dream-data-146a4",
            storageBucket: "dream-data-146a4.firebasestorage.app",
            messagingSenderId: "812415684377",
            appId: "1:812415684377:web:de8859d1502b3c05acbf88"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        // 상부 연동 램프 상태 반영 함수 (연한 파스텔 톤)
        function setDbStatus(status) {
            currentDbStatus = status;
            const lamp = document.getElementById('db-status-lamp');
            const badge = document.getElementById('modal-status-badge');
            const icon = document.getElementById('modal-status-icon');
            const title = document.getElementById('modal-status-title');
            const desc = document.getElementById('modal-status-desc');

            if (lamp) {
                lamp.className = "w-2.5 h-2.5 rounded-full inline-block transition-all";
                if (status === 'connecting') {
                    lamp.classList.add('bg-sky-300', 'animate-pulse');
                } else if (status === 'connected') {
                    lamp.classList.add('bg-emerald-300');
                } else if (status === 'saving') {
                    lamp.classList.add('bg-emerald-300', 'animate-pulse');
                } else if (status === 'error') {
                    lamp.classList.add('bg-rose-300');
                }
            }

            if (badge && icon && title && desc) {
                if (status === 'connected') {
                    badge.className = "w-10 h-10 rounded-full flex items-center justify-center bg-emerald-300 shadow-xs";
                    icon.className = "fa-solid fa-cloud-check text-lg text-emerald-800";
                    title.innerText = "정상 연동됨";

        // 모바일 2x 최적화 이미지 리사이징 & 압축 함수 (최대 한 변 840px, JPEG 0.75)
        function compressImageSource(src, callback) {
            const img = new Image();
            // 외부 사이트 CORS 제한에 의한 스크립트 중단 방지
            img.crossOrigin = "anonymous";
            let hasCalledBack = false;

            img.onload = function () {
                if (hasCalledBack) return;
                hasCalledBack = true;
                try {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 840; // 모바일 2x 레티나 핏 기준 최적 규격

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    callback(dataUrl);
                } catch (canvasErr) {
                    // CORS 보안으로 캔버스 추출 차단 시 원본 URL 그대로 사용
                    console.warn("캔버스 추출 실패, 원본 유지:", canvasErr);
                    callback(src);
                }
            };

            img.onerror = function() {
                if (hasCalledBack) return;
                hasCalledBack = true;
                // 외부 URL 오류 시에도 원본 주소를 보존하여 넘김
                callback(src);
            };

            // 타임아웃 방어 (네트워크 지연 시에도 멈추지 않음)
            setTimeout(() => {
                if (!hasCalledBack) {
                    hasCalledBack = true;
                    callback(src);
                }
            }, 3000);

            img.src = src;
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function (e) {
                compressImageSource(e.target.result, callback);
            };
            reader.readAsDataURL(file);
        }

        window.handleFilesSelect = function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remainingSlots = 5 - selectedImagesList.length;
            if (remainingSlots <= 0) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            const filesToProcess = Array.from(files).slice(0, remainingSlots);
            let processed = 0;
            filesToProcess.forEach(file => {
                compressImage(file, function(compressedDataUrl) {
                    if (compressedDataUrl) {
                        selectedImagesList.push(compressedDataUrl);
                    }
                    processed++;
                    if (processed === filesToProcess.length) {
                        renderImagePreviews();
                    }
                });
            });
            event.target.value = '';
        };

            onSnapshot(postsCol, (snapshot) => {
                feedContainer.innerHTML = "";
                
                const posts = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.mokjangName === currentMokjang && data.isChecked !== false) {
                        posts.push({ id: docSnap.id, ...data });
                    }

                cachedPosts = posts;

                });
            }, (error) => {
                console.error("피드 스냅샷 오류:", error);
                setDbStatus('error');
            });
        }

        // 댓글수 터치 시 상하 스크롤 팝업 모달 열기
        window.openCommentsModal = function(postId) {
            currentActivePopupPostId = postId;
            renderCommentsModalList(postId);
            document.getElementById('comments-popup-modal').classList.remove('hidden');
            setTimeout(() => {
                const input = document.getElementById('comments-modal-input');
                if (input) input.focus();
            }, 100);
        };

        window.closeCommentsModal = function() {
            currentActivePopupPostId = null;
            document.getElementById('comments-popup-modal').classList.add('hidden');
        };

        function renderCommentsModalList(postId) {
            const listEl = document.getElementById('comments-modal-list');
            const countEl = document.getElementById('comments-modal-count');
            if (!listEl) return;

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const comments = post.comments || [];
            countEl.innerText = comments.length;

            if (comments.length === 0) {
                listEl.innerHTML = `
                    <div class="py-12 text-center text-gray-400">
                        <i class="fa-regular fa-comments text-2xl mb-1.5 opacity-40"></i>
                        <p class="text-[11px]">아직 작성된 댓글이 없습니다.</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">첫 댓글로 따뜻한 은혜와 안부를 나눠보세요!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="bg-gray-50 rounded-xl p-2 border border-gray-100 flex flex-col space-y-0.5">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-800 text-[11px]">${escapeHtml(c.author)}</span>
                        <span class="text-[9px] text-gray-400">${c.time || ''}</span>
                    </div>
                    <p class="text-gray-700 text-[11px] leading-relaxed whitespace-pre-wrap">${escapeHtml(c.text)}</p>
                </div>
            `).join('');

            // 스크롤을 항상 가장 최근 댓글이 있는 맨 아래로 이동
            setTimeout(() => {
                listEl.scrollTop = listEl.scrollHeight;
            }, 50);
        }

        // 팝업 모달 안에서 댓글 등록
        window.addCommentFromModal = async function() {
            if (!currentActivePopupPostId) return;
            const inputEl = document.getElementById('comments-modal-input');
            const text = inputEl.value.trim();
            if (!text) return;

            await submitComment(currentActivePopupPostId, text);
            inputEl.value = '';
        };

        // '+' 버튼 클릭 시 라인별 인라인 입력창 토글
        window.toggleInlineCommentInput = function(postId) {
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) {
                row.classList.toggle('hidden');
                if (!row.classList.contains('hidden')) {
                    const input = document.getElementById(`inline-comment-input-${postId}`);
                    if (input) input.focus();
                }
            }
        };

        // 인라인 입력창에서 댓글 등록
        window.addCommentInline = async function(postId) {
            const inputEl = document.getElementById(`inline-comment-input-${postId}`);
            const text = inputEl.value.trim();
            if (!text) return;

            await submitComment(postId, text);
            inputEl.value = '';
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) row.classList.add('hidden');
        };

        // 댓글 공통 Firebase 저장 로직
        async function submitComment(postId, text) {
            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            if (!db) return;
            const postRef = doc(db, 'mokjang_posts', postId);
            setDbStatus('saving');
            try {
                await updateDoc(postRef, { comments: arrayUnion(commentObj) });
                setDbStatus('connected');
                showNotification("댓글이 등록되었습니다.");
            } catch (error) {
                console.error("댓글 등록 오류:", error);
                setDbStatus('error');
            }
        }

        window.toggleLike = async function(postId, hasLiked) {
            if (!db) return;
            const postRef = doc(db, 'mokjang_posts', postId);
            setDbStatus('saving');
            try {
                if (hasLiked) {
                    await updateDoc(postRef, { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(postRef, { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (error) {
                console.error("좋아요 오류:", error);
                setDbStatus('error');
            }
        };

        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        window.openLightbox = function(url) {
            lightboxImg.src = url;
            scale = 1; pointX = 0; pointY = 0; updateImageTransform();
            lightboxModal.classList.remove('hidden');
        };
        window.closeLightbox = function() { lightboxModal.classList.add('hidden'); };
        function updateImageTransform() { lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        let initialDistance = null;
        lightboxModal.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true; startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY;
            }
        });
        lightboxModal.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const zoomFactor = currentDistance / initialDistance;
                scale = Math.min(Math.max(1, scale * zoomFactor), 4);
                initialDistance = currentDistance; updateImageTransform();
            } else if (panning && e.touches.length === 1) {
                pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY; updateImageTransform();
            }
        });
        lightboxModal.addEventListener('touchend', () => { initialDistance = null; panning = false; });

        // [빈 공간 터치 시 가상 키보드 내리기 (blur 처리)]
        function dismissKeyboardOnOutsideTap(e) {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                // 클릭/터치한 대상이 입력창이나 버튼이 아닌 빈 공간일 때만 키보드 닫기
                if (e.target !== activeEl && !e.target.closest('button') && !e.target.closest('input') && !e.target.closest('textarea') && !e.target.closest('label')) {
                    activeEl.blur();
                }
            }
        }
        document.addEventListener('touchstart', dismissKeyboardOnOutsideTap, { passive: true });
        document.addEventListener('click', dismissKeyboardOnOutsideTap);

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
