<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8F9FA;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
        }
        /* 교회 스타일 따뜻한 파스텔톤 컬러 */
        .church-primary { background-color: #3B5D50; } /* 딥 세이지 그린 */
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #D4DCD7; }

        /* 십자가 중앙에서 빛이 천천히 환하게 비추고 흐려지는 애니메이션 */
        @keyframes divine-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px 18px rgba(255, 255, 255, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.7);
                transform: scale(1.04);
            }
        }

        .glowing-logo {
            animation: divine-glow 4s ease-in-out infinite;
        }

        /* 이미지 확대/축소 라이트박스 스타일 */
        #lightbox-modal {
            touch-action: none;
        }
        #lightbox-img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ========================================== -->
    <!-- 1. 시크릿 입장 화면 (원본 시안 둥근 로고 및 빛나는 애니메이션 적용) -->
    <!-- ========================================== -->
    <div id="secret-gate-screen" class="fixed inset-0 z-50 church-primary flex flex-col items-center justify-center p-6 text-white">
        <div class="text-center cursor-pointer select-none group" id="secret-logo-btn" title="빠르게 7번 터치하세요">
            <!-- 둥근 로고 컨테이너 + 빛나는 애니메이션 -->
            <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center p-4 mx-auto mb-6 shadow-2xl group-active:scale-95 transition-transform border-4 border-white/40 overflow-hidden glowing-logo relative">
                <!-- 원본 시안과 일치하는 SVG 그래픽 -->
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain">
                    <!-- 왼쪽 하늘색 파도/삼각형 영역 -->
                    <polygon points="50,115 100,115 100,60" fill="#5B9BD5" />
                    <!-- 오른쪽 진한 남색 파도 영역 (물결 곡선 포함) -->
                    <path d="M 100,115 C 120,115 145,100 175,70 C 140,120 110,145 95,160 C 97,145 98,130 100,115 Z" fill="#203E78" />
                    <!-- 파도 위 하얀 곡선 라인 -->
                    <path d="M 95,122 Q 130,105 170,70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
                    <!-- 중앙 십자가 (세로, 가로) -->
                    <rect x="91" y="32" width="18" height="85" fill="#203E78" rx="2" />
                    <rect x="73" y="48" width="54" height="16" fill="#203E78" rx="2" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wider mb-2">세종꿈의교회 23목장</h1>
            <p class="text-sm text-emerald-100/80 font-light">우리들의 목장 이야기</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. 사용자 인증 모달 -->
    <!-- ========================================== -->
    <div id="auth-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border church-border">
            <div class="text-center mb-5">
                <div class="w-12 h-12 church-accent church-primary-text rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">목장 멤버 인증</h3>
                <p class="text-xs text-gray-500 mt-1">목자/부목자님이 사전에 지정한 성함만 입력해 주세요.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">참여 직분 / 성함</label>
                    <input type="text" id="auth-username-input" placeholder="예: 김목자, 이부목자, 홍길동" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">현재 목장 이름</label>
                    <input type="text" id="auth-mokjang-input" value="세종꿈의교회 23목장" placeholder="목장 이름 입력" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <button onclick="handleUserLogin()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md hover:opacity-95 transition-opacity">
                    입장하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. 메인 피드 화면 -->
    <!-- ========================================== -->
    <div id="main-feed-screen" class="flex flex-col flex-1 hidden">
        <!-- 상단 고정 헤더 -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b church-border shadow-xs px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- 둥근 형태의 헤더 로고 -->
                <div class="w-10 h-10 church-primary rounded-full flex items-center justify-center p-1 shadow-sm border-2 border-emerald-100 overflow-hidden bg-white">
                    <svg viewBox="0 0 200 200" class="w-full h-full object-contain">
                        <polygon points="50,115 100,115 100,60" fill="#5B9BD5" />
                        <path d="M 100,115 C 120,115 145,100 175,70 C 140,120 110,145 95,160 C 97,145 98,130 100,115 Z" fill="#203E78" />
                        <path d="M 95,122 Q 130,105 170,70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
                        <rect x="91" y="32" width="18" height="85" fill="#203E78" rx="2" />
                        <rect x="73" y="48" width="54" height="16" fill="#203E78" rx="2" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-gray-800" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                    <p class="text-[11px] text-gray-500" id="header-user-display">로그인 정보 없음</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-medium flex items-center space-x-1 shadow-xs hover:bg-[#d8e8e0] transition-colors">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <span>사진 이야기 올리기</span>
                </button>
            </div>
        </header>

        <!-- 피드 목록 영역 -->
        <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4 pb-24" id="feed-container">
            <!-- 동적 피드 카드가 이곳에 렌더링 됩니다 -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 4. 게시글 작성 모달 -->
    <!-- ========================================== -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl border church-border">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-gray-800"><i class="fa-solid fa-camera church-primary-text mr-2"></i>목장 사진 이야기 남기기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">목장 이름 (구분 기준)</label>
                    <input type="text" id="post-mokjang-name" value="세종꿈의교회 23목장" class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">사진 링크 (URL) 또는 설명</label>
                    <input type="text" id="post-image-url" placeholder="사진 이미지 주소(URL)를 입력하세요" class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none">
                    <p class="text-[10px] text-gray-400 mt-1">💡 핸드폰 갤러리의 사진 링크나 웹 이미지 주소를 붙여넣어 주세요.</p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">간단한 이야기</label>
                    <textarea id="post-content" rows="3" placeholder="즐거웠던 목장 모임이나 사역 이야기를 적어주세요..." class="w-full px-3 py-2 rounded-xl border church-border text-sm focus:ring-2 focus:ring-[#3B5D50] focus:outline-none resize-none"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="post-display-check" checked class="w-4 h-4 text-[#3B5D50] rounded border-gray-300 focus:ring-[#3B5D50]">
                    <label for="post-display-check" class="text-xs text-gray-700 font-medium">관리자 체크 (현재 피드 화면에 디스플레이)</label>
                </div>
                <button onclick="submitNewPost()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md hover:opacity-95 transition-opacity">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. 사진 확대보기 라이트박스 -->
    <!-- ========================================== -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center hidden">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-2xl p-2 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="overflow-hidden w-full h-full flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 이미지" class="max-w-full max-h-full object-contain select-none">
        </div>
        <div class="absolute bottom-6 text-white text-xs bg-black/50 px-3 py-1 rounded-full pointer-events-none">
            손가락 두 개로 확대/축소 및 드래그가 가능합니다
        </div>
    </div>

    <!-- 푸터 안내 -->
    <footer class="text-center py-6 text-xs text-gray-400 border-t church-border bg-white mt-auto">
        <p>그리스도의 은혜를 나누는 마음</p>
        <p class="mt-1">세종꿈의교회 23목장</p>
    </footer>

    <!-- ========================================== -->
    <!-- Firebase SDK 및 연동 로직 (dream-data) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "dream-data.firebaseapp.com",
            projectId: "dream-data",
            storageBucket: "dream-data.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let tapCount = 0;
        let tapTimer = null;
        let currentUser = null;
        let currentMokjang = "세종꿈의교회 23목장";

        // 1. 로고 7번 터치 시크릿 게이트
        const logoBtn = document.getElementById('secret-logo-btn');
        logoBtn.addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 7) {
                tapCount = 0;
                document.getElementById('secret-gate-screen').classList.add('hidden');
                document.getElementById('auth-modal').classList.remove('hidden');
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 800);
            }
        });

        // 2. 사용자 로그인
        window.handleUserLogin = function() {
            const usernameInput = document.getElementById('auth-username-input').value.trim();
            const mokjangInput = document.getElementById('auth-mokjang-input').value.trim();

            if (!usernameInput) { alert('참여하실 성함이나 직분을 입력해 주세요.'); return; }
            if (!mokjangInput) { alert('목장 이름을 입력해 주세요.'); return; }

            currentUser = usernameInput;
            currentMokjang = mokjangInput;

            document.getElementById('header-user-display').innerText = `${currentUser} 님`;
            document.getElementById('header-mokjang-title').innerText = currentMokjang;
            document.getElementById('post-mokjang-name').value = currentMokjang;

            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-feed-screen').classList.remove('hidden');

            loadMokjangFeed();
        };

        // 3. 모달 제어
        window.openWriteModal = function() { document.getElementById('write-modal').classList.remove('hidden'); };
        window.closeWriteModal = function() { document.getElementById('write-modal').classList.add('hidden'); };

        // 4. 새 글 작성
        window.submitNewPost = async function() {
            const mokjangName = document.getElementById('post-mokjang-name').value.trim();
            const imageUrl = document.getElementById('post-image-url').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const isChecked = document.getElementById('post-display-check').checked;

            if (!imageUrl && !content) {
                alert('사진 링크 또는 간단한 이야기를 입력해 주세요.');
                return;
            }

            try {
                await addDoc(collection(db, "mokjang_posts"), {
                    mokjangName: mokjangName,
                    author: currentUser,
                    imageUrl: imageUrl || "https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=800&q=80",
                    content: content,
                    isChecked: isChecked,
                    likes: 0,
                    likedUsers: [],
                    comments: [],
                    createdAt: new Date()
                });

                document.getElementById('post-image-url').value = '';
                document.getElementById('post-content').value = '';
                closeWriteModal();
            } catch (error) {
                console.error("등록 오류:", error);
                alert("등록 중 오류가 발생했습니다.");
            }
        };

        // 5. 실시간 피드 로드 및 목장 격리
        function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            const q = query(
                collection(db, "mokjang_posts"),
                where("mokjangName", "==", currentMokjang),
                where("isChecked", "==", true)
            );

            onSnapshot(q, (snapshot) => {
                feedContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    feedContainer.innerHTML = `
                        <div class="text-center py-16 text-gray-400">
                            <i class="fa-solid fa-camera-retro text-4xl mb-3 opacity-40"></i>
                            <p class="text-sm">등록된 목장 사진 이야기가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                const posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                    return timeB - timeA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden shadow-xs border church-border space-y-3 pb-3";
                    
                    let commentsHtml = '';
                    if (post.comments && post.comments.length > 0) {
                        commentsHtml = post.comments.map(c => `
                            <div class="bg-gray-50 rounded-xl p-2.5 text-xs flex justify-between items-start">
                                <div>
                                    <span class="font-bold text-gray-
