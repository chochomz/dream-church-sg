<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세종꿈의교회 목장 게이트</title>
    <script>
        (function() {
            try {
                if (window.location.protocol !== 'file:') {
                    var cleanPath = window.location.pathname.replace(/\/index\.html$/i, '/');
                    window.history.replaceState(null, document.title, cleanPath);
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 스마트폰/태블릿/PC 모두 원본 비율을 그대로 유지하는 중앙 프레임 */
        #gate-stage {
            position: relative;
            width: 100%;
            max-width: 460px;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* 원본 index0.png에서 측정한 상(tlogo) · 중(ttitle) · 하(tname) 정밀 좌표 */
        .gate-piece {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            height: auto;
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
        }
        /* 상: 로고 (tlogo.png) */
        .piece-tlogo {
            top: 38.3%;
            width: 25.8%;
        }
        /* 중: 타이틀 (ttitle.png) */
        .piece-ttitle {
            top: 53.0%;
            width: 56.0%;
        }
        /* 하: 꿈의 목장 (tname.png) */
        .piece-tname {
            top: 77.7%;
            width: 31.8%;
        }

        /* 우측 상단 10회 터치 히든 영역 (관리자 페이지 이동) */
        #admin-secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
