<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 꿈의 목장</title>
    <!-- [모바일 속도 최적화: 외부 리소스 사전 연결 & DNS 프리페치] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B5D50'/%3E%3Cpath d='M16 7v18M10 13h12' stroke='%23ffffff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3B5D50">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 폰트 20종 클래스 */
        .font-pretendard { font-family: 'Pretendard', sans-serif !important; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif !important; }
        .font-pen { font-family: 'Nanum Pen Script', cursive !important; font-size: 1.15em; }
        .font-gowun-dodum { font-family: 'Gowun Dodum', sans-serif !important; }
        .font-gowun-batang { font-family: 'Gowun Batang', serif !important; }
        .font-jua { font-family: 'Jua', sans-serif !important; }
        .font-dongle { font-family: 'Dongle', sans-serif !important; font-size: 1.25em; }
        .font-songmyung { font-family: 'Song Myung', serif !important; }
        .font-dohyeon { font-family: 'Do Hyeon', sans-serif !important; }
        .font-gamja { font-family: 'Gamja Flower', cursive !important; }

        html, body {
            width: 100%; height: 100%; max-width: 100%; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; color: #222222;
            -webkit-tap-highlight-color: transparent; touch-action: pan-y;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        header { padding-top: max(env(safe-area-inset-top, 0px), 0px); }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes dreamShimmerSlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .dream-shimmer-text {
            background: linear-gradient(90deg, #111827 0%, #1f2937 32%, #ffffff 50%, #1f2937 68%, #111827 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: dreamShimmerSlow 7s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes swayWelcome {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-2deg) translateY(-0.5px); }
            75% { transform: rotate(2deg) translateY(0.5px); }
        }
        .animate-sway-welcome { display: inline-block; animation: swayWelcome 3.5s ease-in-out infinite; transform-origin: center center; }

        /* [IMG_1035.png 전체 화면 Contain + 실시간 두 손가락 핀치 스플릿 인증 게이트] */
        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background-color: #0b0718; /* 레터박스 여백 어두운 톤 */
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none; transition: opacity 0.5s ease;
        }

        .gate-img-layer {
            position: absolute; inset: 0;
            background-image: url('IMG_1035.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #gate-top {
            clip-path: inset(0 0 50% 0);
        }
        #gate-bottom {
            clip-path: inset(50% 0 0 0);
        }

        /* 중앙 가로 빛 광채 (벌어질 때 나타남) */
        #gate-center-beam {
            position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #ffffff;
            box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.8), 0 0 60px 25px rgba(139, 92, 246, 0.5);
            opacity: 0; z-index: 25; pointer-events: none; transform: translateY(-50%);
            transition: opacity 0.2s ease;
        }

        /* 벌어진 사이에 정확히 위치하는 사각 로그인 박스 */
        #code-auth-box {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            z-index: 30; opacity: 0; pointer-events: none; width: 88%; max-width: 320px;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(16px);
            padding: 22px; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        /* 제스처 안내 가이드 */
        .gate-guide-overlay {
            position: absolute; bottom: 36px; left: 0; right: 0; z-index: 20; text-align: center; pointer-events: none;
        }
        .gate-guide-badge {
            display: inline-block; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fef08a; padding: 7px 16px; border-radius: 9999px; font-size: 11.5px; font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(250, 204, 21, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px rgba(250, 204, 21, 0.7); }
        }

        #feed-container { -webkit-overflow-scrolling: touch; overflow-y: auto; scrollbar-width: thin; }
        #feed-container::-webkit-scrollbar { width: 4px; }
        #feed-container::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.15); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [제스처 인증 게이트 (IMG_1035.png 전체 화면 Contain + 두 손가락 핀치 스플릿)] -->
    <div id="auth-gate">
        <!-- 상단 이미지 반쪽 -->
        <div class="gate-img-layer" id="gate-top"></div>
        <!-- 하단 이미지 반쪽 -->
        <div class="gate-img-layer" id="gate-bottom"></div>

        <!-- 중앙 가로 빛 -->
        <div id="gate-center-beam"></div>

        <!-- 벌어진 사이에 나타나는 로그인 박스 -->
        <div id="code-auth-box">
            <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-gray-100">
                <div class="flex items-center space-x-1.5">
                    <span class="text-base">🌿</span>
                    <h3 class="text-sm font-black text-emerald-900 tracking-tight">꿈의 목장 로그인</h3>
                </div>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">23목장</span>
            </div>

            <div class="space-y-3 text-left">
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">목장 코드 (예: 23목장)</label>
                    <input type="text" id="input-mokjang-code" placeholder="코드를 입력하세요" class="w-full px-3 py-2 rounded-xl border border-emerald-200 text-xs bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-2xs">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">목원 이름</label>
                    <input type="text" id="input-member-name" placeholder="성함을 입력하세요" class="w-full px-3 py-2 rounded-xl border border-emerald-200 text-xs bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-2xs">
                </div>
                <button type="button" onclick="handleMemberLogin()" class="w-full py-2.5 church-primary hover:opacity-95 text-white rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all mt-1 flex items-center justify-center space-x-1">
                    <span>목장 이야기 입장하기</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- 하단 안내 배지 -->
        <div class="gate-guide-overlay" id="gate-guide-badge-box">
            <div class="gate-guide-badge">
                ✨ 두 손가락으로 문구를 터치한 뒤 살짝 벌려주세요 (조금 벌리다 놓으면 합쳐집니다)
            </div>
        </div>
    </div>

    <!-- [상단 헤더] -->
    <header class="h-[52px] shrink-0 bg-white border-b church-border shadow-2xs px-4 flex items-center justify-between w-full z-30 relative max-w-md mx-auto">
        <div class="w-8 shrink-0 flex items-center justify-start"></div>
        <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center">
            <h1 class="text-[17.5px] font-black tracking-tight leading-tight truncate whitespace-nowrap dream-shimmer-text" id="header-mokjang-title">
                세종꿈의교회 23목장
            </h1>
            <p class="text-[10px] text-gray-500 font-medium truncate whitespace-nowrap leading-none mt-0.5 animate-sway-welcome select-none" id="header-user-display">목장 가족님 환영합니다</p>
        </div>
        <div class="shrink-0 relative flex items-center justify-end w-8">
            <button onclick="openHelpModal()" class="w-7 h-7 rounded-full flex items-center justify-center church-accent church-primary-text border border-emerald-200/80 shadow-2xs text-xs font-bold" title="도움말">
                <i class="fa-solid fa-question text-xs"></i>
            </button>
        </div>
    </header>

    <!-- [메인 피드 영역] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-0.5" id="feed-container">
        <div class="w-full px-2 pt-4 pb-2 text-center space-y-2">
            <div class="bg-white rounded-2xl border church-border p-4 shadow-2xs">
                <h3 class="text-sm font-bold text-gray-800">🌿 꿈의 목장 피드</h3>
                <p class="text-xs text-gray-500 mt-1">로그인이 완료되었습니다. 따뜻한 이야기를 나눠보세요.</p>
            </div>
        </div>
    </main>

    <script>
        // [실시간 두 손가락 핀치 스플릿 & 스냅백(합쳐짐) 인터랙션]
        const authGate = document.getElementById('auth-gate');
        const gateTop = document.getElementById('gate-top');
        const gateBottom = document.getElementById('gate-bottom');
        const centerBeam = document.getElementById('gate-center-beam');
        const codeAuthBox = document.getElementById('code-auth-box');
        const guideBadgeBox = document.getElementById('gate-guide-badge-box');

        let initialPinchDist = 0;
        let currentProgress = 0; // 0 (닫힘) ~ 1 (완전 열림)
        let isSuccessfullyOpen = false;

        authGate.addEventListener('touchstart', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        authGate.addEventListener('touchmove', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length === 2 && initialPinchDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = currentDist - initialPinchDist;
                // 벌린 거리(최대 130px)를 0~1 진행도로 매핑
                currentProgress = Math.max(0, Math.min(1, diff / 130));
                updateGateTransform(currentProgress);
            }
        });

        authGate.addEventListener('touchend', (e) => {
            if (isSuccessfullyOpen) return;
            if (e.touches.length < 2 && initialPinchDist > 0) {
                initialPinchDist = 0;
                // 임계치(0.45) 이상 벌리지 못하고 손을 떼면 -> 다시 합쳐짐 (스냅백)
                if (currentProgress < 0.45) {
                    animateSnapBack();
                } else {
                    // 임계치 이상 벌리고 놓으면 -> 완전히 열림 상태 고정
                    animateFullyOpen();
                }
            }
        });

        function updateGateTransform(progress) {
            const maxSplitPx = 110; // 최대 상하 벌어짐 픽셀
            const translateY = progress * maxSplitPx;

            gateTop.style.transform = `translateY(-${translateY}px)`;
            gateBottom.style.transform = `translateY(${translateY}px)`;

            centerBeam.style.opacity = progress;
            codeAuthBox.style.opacity = progress;
            codeAuthBox.style.transform = `translate(-50%, -50%) scale(${0.8 + 0.2 * progress})`;

            if (guideBadgeBox) {
                guideBadgeBox.style.opacity = `${1 - progress}`;
            }
        }

        function animateSnapBack() {
            gateTop.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
            gateBottom.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
            codeAuthBox.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            centerBeam.style.transition = 'opacity 0.25s ease';

            currentProgress = 0;
            updateGateTransform(0);

            setTimeout(() => {
                gateTop.style.transition = 'none';
                gateBottom.style.transition = 'none';
                codeAuthBox.style.transition = 'none';
                centerBeam.style.transition = 'none';
            }, 350);
        }

        function animateFullyOpen() {
            isSuccessfullyOpen = true;
            gateTop.style.transition = 'transform 0.4s ease';
            gateBottom.style.transition = 'transform 0.4s ease';
            codeAuthBox.style.transition = 'all 0.4s ease';

            const maxSplitPx = 110;
            gateTop.style.transform = `translateY(-${maxSplitPx}px)`;
            gateBottom.style.transform = `translateY(${maxSplitPx}px)`;
            centerBeam.style.opacity = '1';
            codeAuthBox.style.opacity = '1';
            codeAuthBox.style.transform = 'translate(-50%, -50%) scale(1)';
            if (guideBadgeBox) guideBadgeBox.style.opacity = '0';
        }

        function handleMemberLogin() {
            const code = document.getElementById('input-mokjang-code').value.trim();
            const name = document.getElementById('input-member-name').value.trim();
            if (!code || !name) {
                alert("목장 코드와 이름을 모두 입력해 주세요.");
                return;
            }

            authGate.style.opacity = '0';
            setTimeout(() => {
                authGate.style.display = 'none';
            }, 500);

            const displayEl = document.getElementById('header-user-display');
            if (displayEl) {
                displayEl.innerHTML = `${escapeHtml(name)}님 <span class="text-emerald-500 font-semibold">환영합니다</span>`;
            }
        }

        function openHelpModal() {
            alert("📖 [꿈의 목장 사용설명서]\n- 배경 이미지를 두 손가락으로 터치한 뒤 바깥쪽으로 살짝 벌려보세요.\n- 조금 벌리다 손을 떼면 원위치로 합쳐지고, 충분히 벌리면 로그인창이 고정됩니다.");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
