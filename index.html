<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas & jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Pretendard 웹폰트 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #222222;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        /* 피드 스크롤 최적화 */
        #feed-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #feed-container::-webkit-scrollbar {
            width: 4px;
        }
        #feed-container::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* 모달 터치 제어: all-pdf-preview-modal은 자유로운 상하 스크롤을 위해 제외 */
        #lightbox-modal, #write-modal, #confirm-modal, #save-confirm-modal, #edit-confirm-modal, #comments-popup-modal, #export-preview-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }

        /* 사진 뷰어 트랙 및 슬라이드 */
        #lightbox-track {
            display: flex;
            height: 100%;
            width: 100%;
            will-change: transform;
        }
        .lightbox-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .lightbox-img-el {
            max-width: 90vw;
            max-height: 75vh;
            object-fit: contain;
            border: 3.5px solid #E5E7EB;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            pointer-events: auto;
            transform-origin: center center;
            transition: filter 0.2s ease-in-out;
            background-color: #ffffff;
        }

        /* 사진 통합 컨테이너: 상하 여백 극단적 밀착 및 꽉 찬 사진 */
        .continuous-photo-container {
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            margin-top: 1px;
            margin-bottom: 1px;
            width: 100%;
        }
        .continuous-photo-item {
            width: 100%;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
            object-fit: cover;
        }
        .continuous-photo-item:active {
            opacity: 0.92;
        }
        
        .photo-block-item:not(:last-child) {
            border-bottom: 1px solid #E5E7EB;
        }

        /* 본문 텍스트: 첫 글자 완벽 왼쪽 밀착 */
        .post-content-body {
            text-align: left !important;
            text-indent: 0 !important;
            margin-left: 0 !important;
            padding-left: 2px !important;
            direction: ltr !important;
            width: 100% !important;
            display: block !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            box-sizing: border-box !important;
        }

        /* 사진별 연필 이야기 텍스트 */
        .photo-caption-text {
            font-size: 13.5px;
            line-height: 1.4;
            color: #374151;
            padding: 2px 6px 2px 6px;
            margin-bottom: 4px;
            background: transparent;
            word-break: break-word;
            overflow-wrap: anywhere;
            text-align: left !important;
            direction: ltr !important;
            width: 100%;
            display: block;
        }

        /* 슬라이드 메뉴 애니메이션 공통 */
        .slide-menu-container, .export-slide-menu, #header-quick-menu {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: right center;
        }
        .menu-closed, .export-menu-closed {
            opacity: 0;
            transform: translateX(12px) scale(0.92);
            pointer-events: none;
        }
        .menu-open, .export-menu-open {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
                background: white;
            }
            .no-print, .no-export { display: none !important; }
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [상단 헤더: 절대 중앙 타이틀(폰트 2pt 확대) + 살살 흔들리는 환영문구 + 살아 움직이는 펜 트리거] -->
    <header class="h-[52px] shrink-0 bg-white border-b church-border shadow-2xs px-3 flex items-center justify-between w-full z-30 relative">
        <!-- 왼쪽 더미 영역 (중앙 밸런스 유지용) -->
        <div class="w-8 shrink-0"></div>

        <!-- 중앙 메인 타이틀 (화면 정중앙 절대 배치 + 폰트 2포인트 확대 + 살랑거리는 환영문구) -->
        <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center pointer-events-auto max-w-[70vw]">
            <div class="flex items-center space-x-1.5 justify-center">
                <h1 class="text-[17.5px] font-black text-gray-800 tracking-tight leading-tight truncate whitespace-nowrap" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                <div class="w-5 h-5 church-primary rounded-full flex items-center justify-center p-0.5 shadow-xs border border-emerald-100 overflow-hidden bg-white shrink-0">
                    <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                        <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                        <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                        <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                        <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                    </svg>
                </div>
            </div>
            <!-- 살살 흔들리는 다정한 서브 환영 문구 -->
            <p class="text-[10px] text-gray-500 font-medium truncate whitespace-nowrap leading-none mt-0.5 animate-sway-welcome select-none" id="header-user-display">목장가족 님 환영합니다</p>
        </div>

        <!-- 오른쪽 살아 움직이는 펜 트리거 & 왼쪽 슬라이드 메뉴 -->
        <div class="shrink-0 relative flex items-center">
            <!-- 왼쪽으로 슬라이드되어 나타나는 헤더 퀵 메뉴 (글쓰기 강조, 연동+용량 및 전체PDF 여백 없이 밀착) -->
            <div id="header-quick-menu" class="menu-closed absolute right-8 bg-[#EBF5EE] border border-[#CDE5D5] text-[#244E3F] rounded-full shadow-md py-1 px-2.5 z-40 flex items-center space-x-1.5 whitespace-nowrap">
                <!-- 1. 글쓰기 버튼: 크기를 키우고 에메랄드 톤으로 약간 강조 -->
                <button onclick="handleHeaderWriteClick()" class="h-[30px] px-3 church-accent church-primary-text rounded-full text-xs font-bold flex items-center space-x-1.5 shadow-2xs hover:bg-emerald-100/90 active:scale-95 transition-all">
                    <i class="fa-solid fa-pen-nib text-[11px]"></i>
                    <span>글쓰기</span>
                </button>

                <!-- 2 & 3: 여백 없이 딱 붙인 일체형 캡슐 (연동+용량 배지 + 전체PDF) -->
                <div class="flex items-center rounded-full bg-white/90 border border-emerald-200/80 shadow-2xs overflow-hidden">
                    <!-- 연동 램프 + 저장용량(%) 통합 배지 -->
                    <div id="combined-cloud-badge" class="h-[27px] px-2 flex items-center space-x-1 text-gray-700 select-none border-r border-emerald-100/80" title="클라우드 실시간 연동 및 1GB 무료 용량 사용 현황">
                        <span id="db-status-lamp" class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block shrink-0"></span>
                        <i id="storage-quota-icon" class="fa-solid fa-battery-quarter text-emerald-600 text-[9px]"></i>
                        <span id="storage-quota-text" class="font-mono font-bold text-[9px] text-gray-700">0%</span>
                    </div>

                    <!-- 전체 PDF 생성 버튼: 붉은색 제거, 은은하고 연한 톤 적용 -->
                    <button onclick="requestAllFeedPdfPreview()" class="h-[27px] px-2.5 hover:bg-emerald-50/80 text-gray-700 hover:text-emerald-900 text-[11px] font-medium flex items-center space-x-1 active:scale-95 transition-all" title="피드 전체 사진과 글(댓글 포함) PDF로 저장/공유">
                        <i class="fa-solid fa-book-open text-[10px] text-gray-500"></i>
                        <span>전체PDF</span>
                    </button>
                </div>
            </div>

            <!-- 우측 끝 펜 선그림 흔적 이모지 버튼 (누르면 왼쪽으로 슬라이드 메뉴 열림) -->
            <button type="button" id="header-pen-btn" onclick="toggleHeaderQuickMenu(event)" 
                    class="w-8 h-8 rounded-full flex items-center justify-center church-accent church-primary-text border border-emerald-200/80 shadow-2xs hover:bg-emerald-100 active:scale-95 transition-all" 
                    title="목장 메뉴 열기">
                <i class="fa-solid fa-pen-fancy text-sm transition-transform duration-200"></i>
            </button>
        </div>
    </header>

    <!-- [피드 메인 컨테이너] -->
    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto px-1 py-0.5" id="feed-container">
        <!-- 게시글 목록이 실시간으로 동적 렌더링됩니다 -->
    </main>

    <!-- [인쇄 전용 숨김 컨테이너] -->
    <div id="print-area" class="hidden"></div>

    <!-- [전체 PDF 다중 페이지 미리보기 & 저장/공유 모달] -->
    <div id="all-pdf-preview-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 hidden" style="touch-action: auto !important;">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[92vh] p-4 shadow-2xl border church-border flex flex-col overflow-hidden">
            <div class="flex items-center justify-between pb-2 border-b church-border shrink-0">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-book-open church-primary-text text-sm"></i>
                    <h3 class="text-xs font-bold text-gray-800">목장 이야기 전체 PDF 미리보기</h3>
                </div>
                <button onclick="closeAllPdfPreviewModal()" class="text-gray-400 hover:text-gray-600 p-0.5"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <!-- 스크롤 뷰포트: 명시적 높이(55vh) 및 강제 스크롤 스타일 적용 -->
            <div id="all-pdf-scroll-viewport" 
                 onscroll="handlePdfViewerScroll(this)" 
                 class="relative my-2 bg-gray-100/80 rounded-xl border border-gray-200/80 p-1.5"
                 style="height: 55vh; min-height: 280px; max-height: 55vh; overflow-y: scroll !important; -webkit-overflow-scrolling: touch !important; touch-action: pan-y !important; overscroll-behavior: contain;">
                
                <!-- 상단 플로팅 고정: 실시간 현재 / 전체 페이지 표시기 -->
                <div class="sticky top-1 z-30 flex justify-end px-1 pointer-events-none mb-1">
                    <span id="all-pdf-page-indicator-text" class="px-2.5 py-0.5 rounded-full bg-slate-900/80 text-white text-[10px] font-mono font-bold shadow-md tracking-wide">
                        1 / 1 페이지
                    </span>
                </div>

                <!-- 최신순 전체 연속 뷰 컨테이너 -->
                <div id="all-pdf-continuous-container" class="w-full flex flex-col items-center select-none" style="touch-action: pan-y !important;">
                    <!-- 생성된 최신순 연속 캔버스 이미지가 1장으로 주입됩니다 -->
                </div>
            </div>

            <div class="text-center pt-0.5 pb-2 shrink-0">
                <p id="all-pdf-status-desc" class="text-xs font-semibold text-gray-800">스크롤하여 확인 후 최종 저장해 개인 파일로 보관하세요.</p>
            </div>

            <!-- 승인 전 액션 버튼 영역 -->
            <div id="all-pdf-action-buttons" class="grid grid-cols-2 gap-2 shrink-0">
                <button type="button" onclick="closeAllPdfPreviewModal()" class="py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-medium active:scale-95 transition-all">취소</button>
                <button type="button" onclick="approveAllPdfGeneration()" class="py-2 church-primary text-white rounded-xl text-xs font-semibold shadow-xs active:scale-95 transition-all">최종 저장 (승인)</button>
            </div>

            <!-- 승인 후 나타나는 공유 및 파일 저장 버튼 영역 (처음엔 숨김) -->
            <div id="all-pdf-download-share-buttons" class="hidden grid-cols-2 gap-2 shrink-0">
                <button type="button" onclick="downloadAllPdfFile()" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md flex items-center justify-center space-x-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-floppy-disk text-xs"></i>
                    <span>휴대폰에 저장</span>
                </button>
                <button type="button" onclick="shareAllPdfFile()" class="py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center justify-center space-x-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-share-nodes text-xs"></i>
                    <span>공유하기</span>
                </button>
            </div>
        </div>
    </div>

    <!-- [댓글 전용 팝업 스크린 모달] -->
    <div id="comments-popup-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex flex-col justify-end hidden">
        <div class="bg-white rounded-t-2xl w-full max-w-md mx-auto max-h-[75vh] flex flex-col shadow-2xl border-t church-border overflow-hidden">
            <div class="flex items-center justify-between px-3.5 py-3 border-b church-border shrink-0 bg-gray-50/80">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-regular fa-comment-dots church-primary-text text-sm"></i>
                    <h3 class="text-xs font-bold text-gray-800">댓글 <span id="comments-modal-count" class="text-emerald-700 font-semibold">0</span></h3>
                </div>
                <button onclick="closeCommentsModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-200 text-xs">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div id="comments-modal-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs"></div>

            <div class="p-2.5 border-t church-border bg-white shrink-0 flex items-center space-x-1.5">
                <input type="text" id="comments-modal-input" maxlength="200" placeholder="댓글을 입력하세요..." 
                       onkeydown="if(event.key==='Enter') addCommentFromModal()" 
                       class="flex-1 px-3 py-2 text-xs bg-gray-50 border church-border rounded-lg focus:outline-none focus:ring-1 focus:ring-[#3B5D50]">
                <button onclick="addCommentFromModal()" class="px-3.5 py-2 church-primary text-white text-xs font-semibold rounded-lg whitespace-nowrap shadow-2xs active:scale-95 transition-transform">
                    등록
                </button>
            </div>
        </div>
    </div>

    <!-- [글쓰기 / 수정 모달] -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl border church-border max-h-[88vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between pb-2 border-b church-border shrink-0">
                <h3 class="text-sm font-bold text-gray-800" id="modal-title-text"><i class="fa-solid fa-pen-nib church-primary-text mr-1.5"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <div class="space-y-2.5 flex-1 overflow-y-auto pt-2 px-0.5">
                <input type="hidden" id="editing-post-id" value="">
                
                <div class="space-y-1">
                    <div class="flex justify-end items-center text-[11px] leading-none pt-0.5">
                        <span id="image-count-indicator" class="text-gray-400 font-medium">0 / 5장</span>
                    </div>

                    <input type="file" id="post-multi-file-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">
                    <div id="selected-images-grid" class="flex flex-wrap items-center justify-center gap-2 py-1.5 bg-gray-50/60 rounded-xl border-0 min-h-[76px]"></div>
                </div>

                <div class="w-full pt-1" id="post-content-container">
                    <div class="flex justify-between items-center mb-1 text-[11px]">
                        <span class="font-medium text-gray-700">내용 입력</span>
                        <span id="char-count-indicator" class="text-gray-400">0 / 200자</span>
                    </div>
                    <textarea id="post-content" rows="3" maxlength="200" oninput="updateCharCount(this)" placeholder="목장 가족들과 나눌 따뜻한 이야기를 입력하세요..." 
                              dir="ltr"
                              class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:border-[#3B5D50] focus:ring-1 focus:ring-[#3B5D50] focus:outline-none resize-none bg-white block transition-all shadow-2xs text-left"></textarea>
                </div>
            </div>

            <div class="pt-2 border-t church-border shrink-0 flex justify-center">
                <button type="button" onclick="requestSavePost()" class="px-6 py-2.5 church-primary text-white rounded-xl font-semibold text-xs shadow-md active:scale-95 transition-all inline-flex items-center space-x-1.5" id="submit-btn-text">
                    <i class="fa-solid fa-check"></i>
                    <span>등록하기</span>
                </button>
            </div>
        </div>
    </div>

    <!-- [저장 확인 모달] -->
    <div id="save-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-3.5 shadow-2xl border church-border text-center space-y-2.5">
            <div class="w-9 h-9 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-sm">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <div>
                <p class="text-xs text-gray-700 font-medium">이 이야기를 목장 피드에 올리시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
                <button onclick="closeSaveConfirmModal()" class="py-1.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-[11px] font-medium active:scale-95 transition-all">취소</button>
                <button onclick="executeSubmitPost()" class="py-1.5 px-3 church-primary text-white rounded-lg text-[11px] font-semibold active:scale-95 transition-all">올리기</button>
            </div>
        </div>
    </div>

    <!-- [수정 확인 모달] -->
    <div id="edit-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-xl w-full max-w-xs p-4 shadow-2xl border church-border text-center space-y-3">
            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-base">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800">게시글 수정</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">이 이야기를 수정하시겠습니까?</p>
            </div>

        // Firebase 무료 용량(1GB) 1일 1회 로컬 캐시 계산
        function updateStorageQuotaDisplay(posts) {
            const STORAGE_QUOTA_KEY = "firebase_daily_quota_cache";
            const ONE_DAY_MS = 24 * 60 * 60 * 1000;
            const FREE_QUOTA_BYTES = 1024 * 1024 * 1024; // 1GB 무료 한도

            let cached = null;
            try {
                const raw = localStorage.getItem(STORAGE_QUOTA_KEY);
                if (raw) cached = JSON.parse(raw);
            } catch (e) {}

            const now = Date.now();
            let percentage = 0;

            if (cached && (now - cached.timestamp < ONE_DAY_MS) && typeof cached.percentage === 'number') {
                percentage = cached.percentage;
            } else if (Array.isArray(posts)) {
                let totalBytes = 0;
                posts.forEach(p => {
                    if (p.content) totalBytes += p.content.length * 2;
                    if (Array.isArray(p.images)) {
                        p.images.forEach(img => {
                            if (typeof img === 'string') totalBytes += img.length;
                        });
                    } else if (p.imageUrl) {
                        totalBytes += p.imageUrl.length;
                    }
                });

                percentage = Math.min(100, Math.max(1, Math.round((totalBytes / FREE_QUOTA_BYTES) * 100)));
                try {
                    localStorage.setItem(STORAGE_QUOTA_KEY, JSON.stringify({
                        percentage: percentage,
                        timestamp: now
                    }));
                } catch (e) {}
            }

            const textEl = document.getElementById('storage-quota-text');
            const iconEl = document.getElementById('storage-quota-icon');
            if (textEl && iconEl) {
                textEl.innerText = `${percentage}%`;
                if (percentage < 25) {
                    iconEl.className = "fa-solid fa-battery-quarter text-emerald-600 text-[10px]";
                } else if (percentage < 55) {
                    iconEl.className = "fa-solid fa-battery-half text-emerald-600 text-[10px]";
                } else if (percentage < 85) {
                    iconEl.className = "fa-solid fa-battery-three-quarters text-amber-500 text-[10px]";
                } else {
                    iconEl.className = "fa-solid fa-battery-full text-rose-500 text-[10px]";
                }
            }
        }

        function processImageFile(file, callback) {
            if (!file) return callback(null);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 960;

                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressed = canvas.toDataURL('image/jpeg', 0.75);
                        callback(compressed);
                    } catch (err) {
                        console.warn("Canvas 압축 대체:", err);
                        callback(e.target.result);
                    }
                };
                img.onerror = () => callback(e.target.result);
                img.src = e.target.result;
            };
            reader.onerror = () => callback(null);
            reader.readAsDataURL(file);
        }

        window.triggerFilePicker = function() {
            if (selectedImagesList.length >= 5) {
                showNotification('사진은 최대 5장까지 선택 가능합니다.');

        window.handleFilesSelect = function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remaining = 5 - selectedImagesList.length;
            if (remaining <= 0) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            const toProcess = Array.from(files).slice(0, remaining);
            let done = 0;
            toProcess.forEach(file => {
                processImageFile(file, (result) => {
                    if (result) selectedImagesList.push(result);
                    done++;
                    if (done === toProcess.length) {
                        renderImagePreviews();
                        showNotification(`사진 ${done}장이 등록되었습니다.`);
                    }
                });
            });
            event.target.value = '';

        async function executeExportPdf(postId) {
            const cardEl = document.getElementById(`post-card-${postId}`);
            if (!cardEl) return;
            showNotification("PDF 문서를 생성 중입니다...");

            const noExportEls = cardEl.querySelectorAll('.no-export');
            noExportEls.forEach(el => el.style.display = 'none');

            try {
                const canvas = await html2canvas(cardEl, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = 210;
                const pageHeight = 297;
                const imgWidth = pageWidth - 20;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'JPEG', 10, 10, imgWidth, Math.min(imgHeight, pageHeight - 20));
                pdf.save(`목장이야기_${postId.substring(0, 6)}_${formatFileDate(new Date())}.pdf`);
                showNotification("댓글이 포함된 PDF 저장이 완료되었습니다!");
            } catch (e) {
                console.error("PDF 저장 오류:", e);
                showNotification("PDF 생성 중 오류가 발생했습니다.");
            } finally {
                noExportEls.forEach(el => el.style.display = '');
            }
        }

        // 스크롤 뷰포트 내 A4 기준 전체 페이지 및 현재 페이지 계산
        function recalculateViewportPages() {
            const viewport = document.getElementById('all-pdf-scroll-viewport');
            const continuousContainer = document.getElementById('all-pdf-continuous-container');
            const indicatorText = document.getElementById('all-pdf-page-indicator-text');
            if (!viewport || !continuousContainer) return;

            // 모바일 뷰포트 폭 기준 A4 비율(1 : 1.414) 세로 1페이지 높이(px) 산정
            const currentWidth = continuousContainer.clientWidth || 300;
            pdfA4PageHeightPx = Math.round(currentWidth * 1.414);

            const totalHeight = continuousContainer.scrollHeight;
            pdfTotalPagesCalculated = Math.max(1, Math.ceil(totalHeight / pdfA4PageHeightPx));

            if (indicatorText) {
                indicatorText.innerText = `1 / ${pdfTotalPagesCalculated} 페이지`;
            }
        }

        // 스크롤 시 실시간 현재 페이지 갱신
        window.handlePdfViewerScroll = function(viewport) {
            if (!viewport || !pdfA4PageHeightPx || pdfA4PageHeightPx <= 0) return;
            const scrollTop = viewport.scrollTop;
            const maxScroll = viewport.scrollHeight - viewport.clientHeight;

            let currentPage = 1;
            if (maxScroll > 0 && scrollTop >= maxScroll - 15) {
                currentPage = pdfTotalPagesCalculated;
            } else {
                currentPage = Math.floor(scrollTop / pdfA4PageHeightPx) + 1;
            }

            if (currentPage > pdfTotalPagesCalculated) currentPage = pdfTotalPagesCalculated;
            if (currentPage < 1) currentPage = 1;

            const indicatorText = document.getElementById('all-pdf-page-indicator-text');
            if (indicatorText) {
                indicatorText.innerText = `${currentPage} / ${pdfTotalPagesCalculated} 페이지`;
            }
        };

        window.closeAllPdfPreviewModal = function() {
            document.getElementById('all-pdf-preview-modal').classList.add('hidden');
            generatedAllPdfBlob = null;
            generatedAllPdfFileName = "";
        };

        // [최종 승인 시에만 안정적으로 백그라운드 PDF 빌드]
        window.approveAllPdfGeneration = async function() {
            const approveBtn = document.getElementById('approve-generate-btn');
            const statusDesc = document.getElementById('all-pdf-status-desc');
            const continuousContainer = document.getElementById('all-pdf-continuous-container');
            if (!continuousContainer) return;

            if (approveBtn) {
                approveBtn.disabled = true;
                approveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i><span>PDF 생성 중...</span>`;
            }
            statusDesc.innerText = "개인 파일용 고화질 PDF 문서를 생성하고 있습니다. 잠시만 기다려주세요...";

            try {
                // 고해상도 캔버스 변환
                const canvas = await html2canvas(continuousContainer, {
                    scale: 1.5,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = 210;
                const pageHeight = 297;
                const margin = 10;
                const contentWidth = pageWidth - (margin * 2);
                const contentHeight = pageHeight - (margin * 2);

                const pxPerMm = canvas.width / contentWidth;
                const pageHeightPx = Math.floor(contentHeight * pxPerMm);
                const totalPages = Math.ceil(canvas.height / pageHeightPx);

                for (let i = 0; i < totalPages; i++) {
                    const pageCanvas = document.createElement('canvas');
                    pageCanvas.width = canvas.width;
                    pageCanvas.height = Math.min(pageHeightPx, canvas.height - i * pageHeightPx);

                    const pCtx = pageCanvas.getContext('2d');
                    pCtx.fillStyle = '#ffffff';
                    pCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
                    pCtx.drawImage(
                        canvas,
                        0, i * pageHeightPx, canvas.width, pageCanvas.height,
                        0, 0, pageCanvas.width, pageCanvas.height
                    );

                    const pageImgData = pageCanvas.toDataURL('image/jpeg', 0.90);

                    if (i > 0) pdf.addPage();
                    const mmHeight = (pageCanvas.height * contentWidth) / canvas.width;
                    pdf.addImage(pageImgData, 'JPEG', margin, margin, contentWidth, mmHeight);
                }

                generatedAllPdfBlob = pdf.output('blob');
                generatedAllPdfFileName = `목장이야기전체_${formatFileDate(new Date())}.pdf`;

                // 승인 후 공유/저장 버튼 활성화
                const actionBox = document.getElementById('all-pdf-action-buttons');
                const downloadShareBox = document.getElementById('all-pdf-download-share-buttons');

                actionBox.classList.add('hidden');
                downloadShareBox.classList.remove('hidden');
                downloadShareBox.classList.add('grid');
                statusDesc.innerText = "생성 완료! 아래 버튼을 눌러 개인 파일로 저장하거나 공유하세요.";
                showNotification("PDF 생성이 완료되었습니다!");
            } catch (err) {
                console.error("PDF 생성 에러:", err);
                statusDesc.innerText = "PDF 생성 중 오류가 발생했습니다. 다시 시도해 주세요.";
                if (approveBtn) {
                    approveBtn.disabled = false;

                }
                showNotification("PDF 생성 실패: " + err.message);
            }
        };

        window.downloadAllPdfFile = function() {
            if (!generatedAllPdfBlob) return;
            const url = URL.createObjectURL(generatedAllPdfBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = generatedAllPdfFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showNotification("전체 목장 이야기가 휴대폰 파일로 저장되었습니다!");
        };

        window.shareAllPdfFile = async function() {
            if (!generatedAllPdfBlob) return;
            try {
                const file = new File([generatedAllPdfBlob], generatedAllPdfFileName, { type: 'application/pdf' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: `${currentMokjang} 이야기 모음`,
                        text: `${currentMokjang}의 모든 사진과 글, 댓글이 담긴 나눔 모음집입니다.`
                    });
                    showNotification("공유창이 호출되었습니다.");
                } else if (navigator.share) {
                    await navigator.share({
                        title: `${currentMokjang} 이야기 모음`,
                        text: `${currentMokjang}의 모든 나눔과 사진이 담긴 PDF입니다.`
                    });
                } else {
                    downloadAllPdfFile();
                    showNotification("공유를 지원하지 않는 브라우저여서 파일 다운로드로 전환했습니다.");
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.warn("공유 오류:", err);
                    downloadAllPdfFile();
                }
            }
        };

        window.openCommentsModal = function(postId) {
            currentActivePopupPostId = postId;
            renderCommentsModalList(postId);

            setTimeout(() => {
                const input = document.getElementById('comments-modal-input');
                if (input) input.focus();

        window.closeCommentsModal = function() {
            currentActivePopupPostId = null;
            document.getElementById('comments-popup-modal').classList.add('hidden');
        };

        function renderCommentsModalList(postId) {
            const listEl = document.getElementById('comments-modal-list');
            const countEl = document.getElementById('comments-modal-count');
            if (!listEl) return;

            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return;

            const comments = post.comments || [];
            countEl.innerText = comments.length;

            if (comments.length === 0) {
                listEl.innerHTML = `
                    <div class="py-12 text-center text-gray-400">
                        <i class="fa-regular fa-comments text-2xl mb-1.5 opacity-40"></i>
                        <p class="text-xs">아직 작성된 댓글이 없습니다.</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">첫 댓글로 사랑과 은혜를 나눠보세요!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="bg-gray-50 rounded-xl p-2.5 border border-gray-100 flex flex-col space-y-0.5 text-left">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-800 text-xs">${escapeHtml(c.author)}</span>
                        <span class="text-[9px] text-gray-400">${c.time || ''}</span>
                    </div>
                    <p class="text-gray-700 text-xs leading-relaxed whitespace-pre-wrap text-left">${escapeHtml(c.text)}</p>
                </div>
            `).join('');

            setTimeout(() => { listEl.scrollTop = listEl.scrollHeight; }, 50);
        }

        window.addCommentFromModal = async function() {
            if (!currentActivePopupPostId) return;
            const input = document.getElementById('comments-modal-input');
            const text = input.value.trim();
            if (!text) return;

            await submitComment(currentActivePopupPostId, text);
            input.value = '';
        };

        window.handleDraftInput = function(postId, val) {
            commentDrafts[postId] = {
                text: val,
                updatedAt: Date.now()
            };
        };

        window.toggleInlineCommentInput = function(postId) {
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (!row) return;

            const isCurrentlyHidden = row.classList.contains('hidden');

            if (isCurrentlyHidden) {
                closeAllInlineCommentInputs();
                row.classList.remove('hidden');

                const input = document.getElementById(`inline-comment-input-${postId}`);
                if (input) {
                    const draft = commentDrafts[postId];
                    if (draft) {
                        const elapsed = Date.now() - draft.updatedAt;
                        if (elapsed <= DRAFT_EXPIRE_MS) {
                            input.value = draft.text;
                        } else {
                            delete commentDrafts[postId];
                            input.value = '';
                        }
                    }
                    input.focus();
                }
            } else {
                const input = document.getElementById(`inline-comment-input-${postId}`);
                if (input && input.value.trim().length > 0) {
                    commentDrafts[postId] = {
                        text: input.value,
                        updatedAt: Date.now()
                    };
                }
                row.classList.add('hidden');
            }
        };

        window.addCommentInline = async function(postId) {
            const input = document.getElementById(`inline-comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            await submitComment(postId, text);
            input.value = '';
            delete commentDrafts[postId];
            const row = document.getElementById(`inline-comment-row-${postId}`);
            if (row) row.classList.add('hidden');
        };

        async function submitComment(postId, text) {
            const now = new Date();
            const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            if (!db) return;
            setDbStatus('saving');
            try {
                await updateDoc(getPostDocRef(postId), { comments: arrayUnion(commentObj) });
                setDbStatus('connected');
                showNotification("댓글이 등록되었습니다.");
            } catch (err) {
                console.error("댓글 등록 오류:", err);
                setDbStatus('error');
            }
        }

        window.toggleLike = async function(postId, hasLiked) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasLiked) {
                    await updateDoc(getPostDocRef(postId), { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("좋아요 오류:", err);
                setDbStatus('error');
            }
        };

        window.toggleThumbsUp = async function(postId, hasThumbed) {
            if (!db) return;
            setDbStatus('saving');
            try {
                if (hasThumbed) {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(-1), thumbedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(getPostDocRef(postId), { thumbsUp: increment(1), thumbedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (err) {
                console.error("엄지척 오류:", err);
                setDbStatus('error');
            }
        };

        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxTrack = document.getElementById('lightbox-track');
        const autoFixBtn = document.getElementById('lightbox-autofix-btn');
        const prevBtn = document.getElementById('lightbox-prev-btn');
        const nextBtn = document.getElementById('lightbox-next-btn');
        const zoomLevelText = document.getElementById('lightbox-zoom-level');

        function getPostImages(postId) {
            const post = cachedPosts.find(p => p.id === postId);
            if (!post) return [];
            if (Array.isArray(post.images) && post.images.length > 0) {
                return post.images.filter(img => typeof img === 'string' && img.trim().length > 0);
            }
            if (post.imageUrl) return [post.imageUrl];
            return [];
        }

        window.openLightbox = function(postId, photoIdx) {
            currentLightboxPostId = postId;
            currentLightboxPhotoIdx = photoIdx;
            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;

            currentLightboxImages = getPostImages(postId);
            if (currentLightboxImages.length === 0) return;

            lightboxTrack.innerHTML = '';
            currentLightboxImages.forEach((src, idx) => {
                const slide = document.createElement('div');
                slide.className = 'lightbox-slide';
                slide.innerHTML = `<img id="lightbox-slide-img-${idx}" src="${src}" alt="사진 ${idx + 1}" class="lightbox-img-el">`;
                lightboxTrack.appendChild(slide);
            });

            lightboxModal.classList.remove('hidden');
            moveToLightboxSlide(photoIdx, false);
            updateActiveImageTransform();
        };

        function moveToLightboxSlide(index, animate = true) {
            if (index < 0) index = 0;
            if (index >= currentLightboxImages.length) index = currentLightboxImages.length - 1;
            currentLightboxPhotoIdx = index;

            const viewWidth = lightboxModal.clientWidth || window.innerWidth;
            trackOffset = -index * viewWidth;

            if (animate) {
                lightboxTrack.style.transition = 'transform 0.32s cubic-bezier(0.25, 1, 0.5, 1)';
            } else {
                lightboxTrack.style.transition = 'none';
            }
            lightboxTrack.style.transform = `translateX(${trackOffset}px)`;

            if (currentLightboxImages.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                prevBtn.style.opacity = currentLightboxPhotoIdx === 0 ? '0.2' : '1';
                nextBtn.style.opacity = currentLightboxPhotoIdx === currentLightboxImages.length - 1 ? '0.2' : '1';
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }

            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;
            updateActiveImageTransform();
        }

        function getActiveImageEl() {
            return document.getElementById(`lightbox-slide-img-${currentLightboxPhotoIdx}`);
        }

        function updateActiveImageTransform() {
            const activeImg = getActiveImageEl();
            if (activeImg) {
                activeImg.style.transform = `scale(${currentLightboxScale}) rotate(${currentLightboxRotationAngle}deg)`;
                
                if (isLightboxAutoFixed) {
                    activeImg.style.filter = "contrast(1.08) brightness(1.06) saturate(1.12)";
                    autoFixBtn.classList.remove('bg-gray-100', 'text-gray-700');
                    autoFixBtn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                } else {
                    activeImg.style.filter = "none";
                    autoFixBtn.classList.remove('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                    autoFixBtn.classList.add('bg-gray-100', 'text-gray-700');
                }
            }
            if (zoomLevelText) {
                zoomLevelText.innerText = `${Math.round(currentLightboxScale * 100)}%`;
            }
        }

        window.toggleLightboxAutoFix = function() {
            isLightboxAutoFixed = !isLightboxAutoFixed;
            updateActiveImageTransform();
            showNotification(isLightboxAutoFixed ? "자동 보정이 적용되었습니다." : "자동 보정이 해제되었습니다.");
        };

        window.rotateLightboxImage = function() {
            currentLightboxRotationAngle = (currentLightboxRotationAngle + 90) % 360;
            updateActiveImageTransform();
        };

        window.zoomLightbox = function(delta) {
            let nextScale = currentLightboxScale + delta;
            if (nextScale < 0.8) nextScale = 0.8;
            if (nextScale > 2.5) nextScale = 2.5;
            currentLightboxScale = parseFloat(nextScale.toFixed(2));
            updateActiveImageTransform();
        };

        window.resetLightboxZoom = function() {
            currentLightboxScale = 1.0;
            currentLightboxRotationAngle = 0;
            updateActiveImageTransform();
        };

        window.slideLightboxPrev = function(e) {
            if (e) e.stopPropagation();
            if (currentLightboxPhotoIdx > 0) {
                moveToLightboxSlide(currentLightboxPhotoIdx - 1, true);
            }
        };

        window.slideLightboxNext = function(e) {
            if (e) e.stopPropagation();
            if (currentLightboxPhotoIdx < currentLightboxImages.length - 1) {
                moveToLightboxSlide(currentLightboxPhotoIdx + 1, true);
            }
        };

        const viewport = document.getElementById('lightbox-viewport');
        if (viewport) {
            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && currentLightboxScale === 1.0) {
                    isDraggingTrack = true;
                    dragStartX = e.touches[0].clientX;
                    dragCurrentX = dragStartX;
                    lightboxTrack.style.transition = 'none';
                } else if (e.touches.length === 2) {
                    isDraggingTrack = false;
                    lightboxInitialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    lightboxInitialScale = currentLightboxScale;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (isDraggingTrack && e.touches.length === 1 && currentLightboxScale === 1.0) {
                    dragCurrentX = e.touches[0].clientX;
                    const diffX = dragCurrentX - dragStartX;
                    
                    let appliedDiff = diffX;
                    if ((currentLightboxPhotoIdx === 0 && diffX > 0) || 
                        (currentLightboxPhotoIdx === currentLightboxImages.length - 1 && diffX < 0)) {
                        appliedDiff = diffX * 0.35;
                    }
                    
                    const viewWidth = lightboxModal.clientWidth || window.innerWidth;
                    const currentOffset = -currentLightboxPhotoIdx * viewWidth + appliedDiff;
                    lightboxTrack.style.transform = `translateX(${currentOffset}px)`;
                } else if (e.touches.length === 2 && lightboxInitialPinchDist > 0) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = currentDist / lightboxInitialPinchDist;
                    let nextScale = lightboxInitialScale * factor;
                    if (nextScale < 0.8) nextScale = 0.8;
                    if (nextScale > 2.5) nextScale = 2.5;
                    currentLightboxScale = parseFloat(nextScale.toFixed(2));
                    updateActiveImageTransform();
                }
            }, { passive: true });

            viewport.addEventListener('touchend', (e) => {
                if (isDraggingTrack && currentLightboxScale === 1.0) {
                    isDraggingTrack = false;
                    const diffX = dragCurrentX - dragStartX;
                    const threshold = 55;

                    if (diffX < -threshold && currentLightboxPhotoIdx < currentLightboxImages.length - 1) {
                        moveToLightboxSlide(currentLightboxPhotoIdx + 1, true);
                    } else if (diffX > threshold && currentLightboxPhotoIdx > 0) {
                        moveToLightboxSlide(currentLightboxPhotoIdx - 1, true);
                    } else {
                        moveToLightboxSlide(currentLightboxPhotoIdx, true);
                    }
                }
                lightboxInitialPinchDist = 0;
            }, { passive: true });
        }

        window.closeLightbox = function() {
            lightboxModal.classList.add('hidden');
            lightboxTrack.innerHTML = '';
            currentLightboxPostId = null;
            currentLightboxPhotoIdx = 0;
            currentLightboxRotationAngle = 0;
            isLightboxAutoFixed = false;
            currentLightboxScale = 1.0;
        };

        window.saveRotatedImagePermanent = async function() {
            if (!currentLightboxPostId || currentLightboxPhotoIdx === null) return;
            const activeImg = getActiveImageEl();
            if (!activeImg) return;

            showNotification("사진을 기기에 저장하는 중입니다...");

            try {
                const finalDataUrl = await getProcessedDataUrl(activeImg.src, currentLightboxRotationAngle, isLightboxAutoFixed);
                
                const link = document.createElement('a');
                link.download = `목장사진_${currentLightboxPostId.substring(0, 5)}_${currentLightboxPhotoIdx + 1}_${Date.now()}.jpg`;
                link.href = finalDataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();

                showNotification("사진이 내 기기에 저장되었습니다.");
            } catch (err) {
                console.error("사진 기기 저장 실패:", err);
                showNotification("사진 저장 실패: " + err.message);
            }
        };

        function getProcessedDataUrl(src, angle, autoFix) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (angle === 90 || angle === 270) {
                        canvas.width = img.height;
                        canvas.height = img.width;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }

                    if (autoFix) {
                        ctx.filter = "contrast(1.08) brightness(1.06) saturate(1.12)";
                    }

                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate((angle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        function formatFileDate(d) {
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
