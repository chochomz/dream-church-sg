<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFFFFF;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overscroll-behavior-y: auto;
        }

        #secret-gate-screen {
            user-select: none;
            -webkit-user-select: none;
        }

        #secret-logo-img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes divine-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(59, 93, 80, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px 10px rgba(59, 93, 80, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
                transform: scale(1.02);
            }
        }

        .glowing-logo {
            animation: divine-glow 4s ease-in-out infinite;
        }

        #lightbox-modal, #auth-modal, #write-modal, #confirm-modal, #save-confirm-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }
        #lightbox-img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-white">

    <div id="secret-gate-screen" class="fixed inset-0 z-50 church-primary flex flex-col items-center justify-center p-6 text-white text-center">
        <div class="cursor-pointer select-none group relative inline-block" id="secret-login-area">
            <div class="w-36 h-36 bg-white rounded-full flex items-center justify-center p-3 mx-auto mb-6 shadow-2xl group-active:scale-95 transition-transform border-4 border-white/40 overflow-hidden glowing-logo relative z-10">
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain" id="secret-logo-img">
                    <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1" filter="blur(10px)" />
                    <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                    <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                    <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                    <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                </svg>
            </div>
            <div class="absolute inset-0 w-full h-full rounded-full z-20 cursor-pointer" id="secret-tap-overlay"></div>
        </div>

        <div class="select-none space-y-1">
            <h1 class="text-4xl font-extrabold tracking-wider text-white whitespace-nowrap">세종꿈의교회</h1>
            <h2 class="text-2xl font-semibold text-emerald-100 tracking-wide whitespace-nowrap mt-2">23목장</h2>
            <div class="h-6"></div>
            <p class="text-sm text-emerald-100/90 font-light whitespace-nowrap">쇼츠로 즐기는 우리들의 목장 이야기</p>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border church-border">
            <div class="text-center mb-5">
                <div class="w-12 h-12 church-accent church-primary-text rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 whitespace-nowrap">목장 멤버 인증</h3>
                <p class="text-xs text-gray-500 mt-1 whitespace-nowrap">성함과 목장 이름을 입력해 주세요.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1 whitespace-nowrap">성함 / 직분</label>
                    <input type="text" id="auth-username-input" placeholder="예: 김목자, 홍길동" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1 whitespace-nowrap">목장 이름</label>
                    <input type="text" id="auth-mokjang-input" value="세종꿈의교회 23목장" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <button onclick="handleUserLogin()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md whitespace-nowrap">
                    입장하기
                </button>
            </div>
        </div>
    </div>

    <div id="main-feed-screen" class="flex flex-col flex-1 hidden bg-white">
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b church-border shadow-xs px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2.5 overflow-hidden">
                <div class="w-9 h-9 church-primary rounded-full flex items-center justify-center p-0.5 shadow-sm border border-emerald-100 overflow-hidden bg-white shrink-0">
                    <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                        <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                        <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                        <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                        <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                    </svg>
                </div>
                <div class="overflow-hidden">
                    <h1 class="text-xs font-bold text-gray-800 truncate whitespace-nowrap" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                    <p class="text-[10px] text-gray-500 truncate whitespace-nowrap" id="header-user-display">로그인 정보 없음</p>
                </div>
            </div>
            <div class="shrink-0 flex items-center space-x-2">
                <!-- Firebase Connection Status Lamp Indicator -->
                <div class="flex items-center space-x-1.5 px-2 py-1 bg-gray-50 border church-border rounded-lg" title="클라우드 파이어베이스 연동 상태">
                    <span id="db-status-lamp" class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse inline-block"></span>
                    <span id="db-status-text" class="text-[10px] text-gray-500 whitespace-nowrap">연동중</span>
                </div>
                <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-medium flex items-center space-x-1 shadow-xs whitespace-nowrap">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <span>글쓰기</span>
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-lg w-full mx-auto p-3 space-y-4 pb-24 bg-white" id="feed-container">
            <!-- Dynamic infinity scroll feed cards rendered here -->
        </main>
    </div>

    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg p-4 shadow-2xl border church-border max-h-[75vh] flex flex-col overflow-y-auto">
            <div class="flex items-center justify-between mb-2 shrink-0">
                <h3 class="text-sm font-bold text-gray-800 whitespace-nowrap" id="modal-title-text"><i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3 flex-1 overflow-y-auto pr-1">
                <input type="hidden" id="editing-post-id" value="">
                
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block text-[11px] font-medium text-gray-600 whitespace-nowrap">사진 추가 (최대 5장)</label>
                        <span id="image-count-indicator" class="text-[10px] text-gray-400 whitespace-nowrap">0 / 5장</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <label class="border church-border rounded-xl py-2 px-1 text-center cursor-pointer hover:bg-emerald-50 text-xs flex items-center justify-center space-x-1 transition-colors overflow-hidden">
                            <i class="fa-solid fa-file-arrow-up church-primary-text shrink-0"></i>
                            <span class="font-medium text-gray-700 whitespace-nowrap truncate text-[11px]">사진/파일</span>
                            <input type="file" id="post-multi-file-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">
                        </label>
                        <button type="button" onclick="toggleUrlInput()" class="border church-border rounded-xl py-2 px-1 text-center hover:bg-emerald-50 text-xs flex items-center justify-center space-x-1 transition-colors overflow-hidden">
                            <i class="fa-solid fa-link church-primary-text shrink-0"></i>
                            <span class="font-medium text-gray-700 whitespace-nowrap truncate text-[11px]">웹주소(URL)</span>
                        </button>
                    </div>

                    <div id="selected-images-grid" class="grid grid-cols-3 gap-2 mt-2">
                        <!-- Dynamic thumbnails -->
                    </div>

                    <div id="url-input-container" class="hidden mt-2 space-y-2">
                        <div class="flex space-x-1.5">
                            <input type="text" id="post-image-url" placeholder="https://..." class="flex-1 px-3 py-2 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none">
                            <button type="button" onclick="addUrlImage()" class="px-3 py-2 church-accent church-primary-text rounded-xl text-xs font-medium whitespace-nowrap">추가</button>
                        </div>
                    </div>
                </div>

                <div class="w-full">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[11px] font-medium text-gray-600 whitespace-nowrap">내용 입력</span>
                        <span id="char-count-indicator" class="text-[10px] text-gray-400 whitespace-nowrap">0 / 200자</span>
                    </div>
                    <textarea id="post-content" rows="3" maxlength="200" oninput="updateCharCount(this)" placeholder="내용을 입력하세요..." class="w-full px-3 py-2.5 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none resize-none bg-white block box-border"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="post-display-check" checked class="w-4 h-4 text-[#3B5D50] rounded border-gray-300">
                    <label for="post-display-check" class="text-xs text-gray-700 font-medium whitespace-nowrap">피드에 즉시 노출</label>
                </div>
                <button onclick="requestSavePost()" class="w-full py-2.5 church-primary text-white rounded-xl font-medium text-xs shadow-md whitespace-nowrap" id="submit-btn-text">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <div id="save-confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl border church-border text-center space-y-4">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-gray-800 whitespace-nowrap">게시글 저장</h3>
                <p class="text-xs text-gray-500 mt-1 whitespace-nowrap">저장 하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeSaveConfirmModal()" class="py-2.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-medium whitespace-nowrap">취소</button>
                <button onclick="executeSubmitPost()" class="py-2.5 church-primary text-white rounded-xl text-xs font-medium whitespace-nowrap">저장하기</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl border church-border text-center space-y-4">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-gray-800 whitespace-nowrap">게시글 삭제</h3>
                <p class="text-xs text-gray-500 mt-1 whitespace-nowrap">정말 이 이야기를 삭제하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeConfirmModal()" class="py-2.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-medium whitespace-nowrap">취소</button>
                <button id="confirm-yes-btn" class="py-2.5 bg-rose-500 text-white rounded-xl text-xs font-medium whitespace-nowrap">삭제하기</button>
            </div>
        </div>
    </div>

    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center hidden">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-xl p-2 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="overflow-hidden w-full h-full flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 이미지" class="max-w-full max-h-full object-contain select-none">
        </div>
        <div class="absolute bottom-6 text-white text-[11px] bg-black/60 px-3 py-1 rounded-full pointer-events-none whitespace-nowrap">
            두 손가락으로 확대/축소 가능
        </div>
    </div>

    <footer class="text-center py-5 text-[11px] text-gray-400 border-t church-border bg-white mt-auto">
        <p class="whitespace-nowrap">그리스도의 은혜를 나누는 마음</p>
        <p class="mt-0.5 whitespace-nowrap">세종꿈의교회 23목장</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let tapCount = 0;
        let tapTimer = null;
        let currentUser = null;
        let currentMokjang = "세종꿈의교회 23목장";
        let selectedImagesList = [];
        let postToDeleteId = null;
        let currentUserUid = null;
        let isAuthReady = false;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDKD5LUQL84ZuPH5UJrHBj7yAYDTabDWVA",
            authDomain: "dream-data-146a4.firebaseapp.com",
            projectId: "dream-data-146a4",
            storageBucket: "dream-data-146a4.firebasestorage.app",
            messagingSenderId: "812415684377",
            appId: "1:812415684377:web:de8859d1502b3c05acbf88"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        function setDbStatus(status) {
            const lamp = document.getElementById('db-status-lamp');
            const text = document.getElementById('db-status-text');
            if (!lamp || !text) return;

            lamp.className = "w-2.5 h-2.5 rounded-full inline-block";
            if (status === 'connecting') {
                lamp.classList.add('bg-blue-500', 'animate-pulse');
                text.innerText = '연동중';
            } else if (status === 'connected') {
                lamp.classList.add('bg-emerald-500');
                text.innerText = '연동됨';
            } else if (status === 'saving') {
                lamp.classList.add('bg-emerald-500', 'animate-pulse');
                text.innerText = '저장중';
            } else if (status === 'error') {
                lamp.classList.add('bg-rose-500');
                text.innerText = '보안규칙오류';
            }
        }

        function showNotification(msg) {
            const existing = document.getElementById('app-notification-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'app-notification-toast';
            toast.className = 'fixed bottom-12 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 flex items-center space-x-2 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center';
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-emerald-400 shrink-0"></i><span>${escapeHtml(msg)}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function initAuth() {
            setDbStatus('connecting');
            if (!auth) {
                setDbStatus('error');
                return;
            }
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUserUid = auth.currentUser?.uid || "anon-user";
                isAuthReady = true;
                setDbStatus('connected');
                console.log("Firebase Auth 성공! UID:", currentUserUid);
            } catch (e) {
                console.warn("익명 로그인 인증 주의 (규칙이 if true인 경우 작동 지속):", e);
                // 콘솔에서 익명 로그인이 안 켜져 있어도 규칙이 true면 쓰기 가능하도록 세팅
                isAuthReady = true;
                setDbStatus('connected');
            }
        }
        initAuth();

        // 7회 탭 잠금해제
        const tapOverlay = document.getElementById('secret-tap-overlay');
        tapOverlay.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 7) {
                tapCount = 0;
                document.getElementById('secret-gate-screen').classList.add('hidden');
                document.getElementById('auth-modal').classList.remove('hidden');
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 800);
            }
        });

        window.handleUserLogin = async function() {
            const usernameInput = document.getElementById('auth-username-input').value.trim();
            const mokjangInput = document.getElementById('auth-mokjang-input').value.trim();

            if (!usernameInput) { showNotification('성함이나 직분을 입력해 주세요.'); return; }
            if (!mokjangInput) { showNotification('목장 이름을 입력해 주세요.'); return; }

            currentUser = usernameInput;
            currentMokjang = mokjangInput;

            document.getElementById('header-user-display').innerText = `${currentUser} 님`;
            document.getElementById('header-mokjang-title').innerText = currentMokjang;

            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-feed-screen').classList.remove('hidden');

            loadMokjangFeed();
        };

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800; // 800px로 최적화하여 1MB 초과 방지

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 0.6 압축률로 Firestore 용량 절약
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.handleFilesSelect = function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remainingSlots = 5 - selectedImagesList.length;
            if (remainingSlots <= 0) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            const filesToProcess = Array.from(files).slice(0, remainingSlots);
            filesToProcess.forEach(file => {
                compressImage(file, function(compressedDataUrl) {
                    selectedImagesList.push(compressedDataUrl);
                    renderImagePreviews();
                });
            });
            event.target.value = '';
        };

        window.addUrlImage = function() {
            const urlInput = document.getElementById('post-image-url');
            const url = urlInput.value.trim();
            if (!url) return;

            if (selectedImagesList.length >= 5) {
                showNotification('사진은 최대 5장까지만 등록할 수 있습니다.');
                return;
            }

            selectedImagesList.push(url);
            urlInput.value = '';
            renderImagePreviews();
        };

        window.removeSelectedImage = function(index) {
            selectedImagesList.splice(index, 1);
            renderImagePreviews();
        };

        window.toggleUrlInput = function() {
            document.getElementById('url-input-container').classList.toggle('hidden');
        };

        window.triggerFilePicker = function() {
            if (selectedImagesList.length >= 5) {
                showNotification('최대 5장까지 선택되었습니다.');
                return;
            }
            document.getElementById('post-multi-file-input').click();
        };

        window.updateCharCount = function(textarea) {
            const len = textarea.value.length;
            document.getElementById('char-count-indicator').innerText = `${len} / 200자`;
        };

        function renderImagePreviews() {
            const grid = document.getElementById('selected-images-grid');
            const indicator = document.getElementById('image-count-indicator');
            grid.innerHTML = "";
            indicator.innerText = `${selectedImagesList.length} / 5장`;

            selectedImagesList.forEach((imgSrc, idx) => {
                const thumb = document.createElement('div');
                thumb.className = "relative bg-gray-100 rounded-xl aspect-square overflow-hidden border church-border flex items-center justify-center";
                thumb.innerHTML = `
                    <img src="${imgSrc}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeSelectedImage(${idx})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center shadow"><i class="fa-solid fa-xmark"></i></button>
                `;
                grid.appendChild(thumb);
            });

            if (selectedImagesList.length < 5) {
                const addBtn = document.createElement('button');
                addBtn.type = "button";
                addBtn.onclick = triggerFilePicker;
                addBtn.className = "border-2 border-dashed church-border rounded-xl aspect-square flex flex-col items-center justify-center text-gray-400 hover:bg-emerald-50 transition-colors";
                addBtn.innerHTML = `
                    <i class="fa-solid fa-plus text-base mb-1 church-primary-text"></i>
                    <span class="text-[10px] whitespace-nowrap">사진 추가</span>
                `;
                grid.appendChild(addBtn);
            }
        }

        window.openWriteModal = function(postId = null, existingContent = "", existingImages = []) {
            document.getElementById('editing-post-id').value = postId || "";
            const contentEl = document.getElementById('post-content');
            contentEl.value = existingContent || "";
            updateCharCount(contentEl);
            
            selectedImagesList = Array.isArray(existingImages) ? [...existingImages] : (existingImages ? [existingImages] : []);
            renderImagePreviews();

            if (postId) {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-pen-to-square church-primary-text mr-1.5"></i>목장 이야기 수정하기`;
                document.getElementById('submit-btn-text').innerText = "수정 완료";
            } else {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기`;
                document.getElementById('submit-btn-text').innerText = "등록하기";
            }

            document.getElementById('write-modal').classList.remove('hidden');
        };

        window.closeWriteModal = function() {
            document.getElementById('write-modal').classList.add('hidden');
            selectedImagesList = [];
            document.getElementById('post-content').value = '';
            document.getElementById('editing-post-id').value = '';
        };

        window.requestSavePost = function() {
            const content = document.getElementById('post-content').value.trim();
            if (!content) {
                showNotification('이야기 내용을 입력해 주세요.');
                return;
            }
            document.getElementById('save-confirm-modal').classList.remove('hidden');
        };

        window.closeSaveConfirmModal = function() {
            document.getElementById('save-confirm-modal').classList.add('hidden');
        };

        window.executeSubmitPost = async function() {
            closeSaveConfirmModal();
            closeWriteModal();
            
            const postId = document.getElementById('editing-post-id').value;
            const mokjangName = currentMokjang;
            const content = document.getElementById('post-content').value.trim();
            const isChecked = document.getElementById('post-display-check').checked;

            // 사진을 등록하지 않았을 경우 외국인 샘플 사진 대신 빈 배열([])로 저장
            const finalImages = [...selectedImagesList];

            setDbStatus('saving');
            try {
                if (!db) {
                    showNotification("데이터베이스가 초기화되지 않았습니다.");
                    setDbStatus('error');
                    return;
                }

                if (!isAuthReady) {
                    await initAuth();
                }

                const postsCol = collection(db, 'mokjang_posts');
                if (postId) {
                    const postRef = doc(db, 'mokjang_posts', postId);
                    await updateDoc(postRef, {
                        content: content,
                        images: finalImages,
                        imageUrl: finalImages.length > 0 ? finalImages[0] : "",
                        isChecked: isChecked
                    });
                } else {
                    await addDoc(postsCol, {
                        mokjangName: mokjangName,
                        author: currentUser,
                        images: finalImages,
                        imageUrl: finalImages.length > 0 ? finalImages[0] : "",
                        content: content,
                        isChecked: isChecked,
                        likes: 0,
                        likedUsers: [],
                        comments: [],
                        createdAt: new Date()
                    });
                }
                setDbStatus('connected');
                showNotification("게시글이 성공적으로 저장되었습니다.");
            } catch (error) {
                console.error("저장 오류:", error);
                showNotification("저장 중 오류가 발생했습니다.");
                setDbStatus('error');
            }
        };

        window.confirmDeletePost = function(postId) {
            postToDeleteId = postId;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };

        window.closeConfirmModal = function() {
            postToDeleteId = null;
            document.getElementById('confirm-modal').classList.add('hidden');
        };

        document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
            if (!postToDeleteId) return;
            setDbStatus('saving');
            try {
                if (!db) { setDbStatus('error'); return; }
                await deleteDoc(doc(db, 'mokjang_posts', postToDeleteId));
                closeConfirmModal();
                setDbStatus('connected');
                showNotification("삭제되었습니다.");
            } catch (error) {
                console.error("삭제 오류:", error);
                showNotification("삭제 중 오류가 발생했습니다.");
                setDbStatus('error');
            }
        });

        async function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            if (!db) return;

            if (!isAuthReady) {
                feedContainer.innerHTML = `
                    <div class="text-center py-16 text-gray-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 church-primary-text"></i>
                        <p class="text-xs">데이터베이스와 안전하게 연결 중입니다...</p>
                    </div>
                `;
                await initAuth();
            }

            const postsCol = collection(db, 'mokjang_posts');

            onSnapshot(postsCol, (snapshot) => {
                feedContainer.innerHTML = "";
                
                const posts = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.mokjangName === currentMokjang && data.isChecked !== false) {
                        posts.push({ id: docSnap.id, ...data });
                    }
                });
                
                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="text-center py-16 text-gray-400">
                            <i class="fa-solid fa-camera-retro text-3xl mb-2 opacity-40"></i>
                            <p class="text-xs whitespace-nowrap">등록된 목장 이야기가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
                    return timeB - timeA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const isAuthor = post.author === currentUser;
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden shadow-xs border church-border space-y-2.5 pb-3";
                    
                    const imgArray = (post.images && Array.isArray(post.images)) 
                        ? post.images.filter(img => img && !img.includes('unsplash.com')) 
                        : (post.imageUrl && !post.imageUrl.includes('unsplash.com') ? [post.imageUrl] : []);
                    let imagesHtml = '';
                    if (imgArray.length === 1) {
                        imagesHtml = `
                            <div class="w-full bg-black/5 overflow-hidden cursor-pointer max-h-72 flex items-center justify-center" onclick="openLightbox('${imgArray[0]}')">
                                <img src="${imgArray[0]}" alt="목장 사진" class="max-w-full max-h-72 object-contain my-auto">
                            </div>
                        `;
                    } else if (imgArray.length > 1) {
                        imagesHtml = `<div class="grid grid-cols-2 gap-1 bg-black/5 p-1 max-h-80 overflow-y-auto">`;
                        imgArray.forEach((imgUrl) => {
                            imagesHtml += `
                                <div class="aspect-square overflow-hidden cursor-pointer rounded-lg bg-black/10 flex items-center justify-center" onclick="openLightbox('${imgUrl}')">
                                    <img src="${imgUrl}" class="w-full h-full object-cover">
                                </div>
                            `;
                        });
                        imagesHtml += `</div>`;
                    }

                    let commentsHtml = '';
                    if (post.comments && post.comments.length > 0) {
                        commentsHtml = post.comments.map(c => `
                            <div class="bg-gray-50 rounded-xl p-2 text-xs flex justify-between items-start">
                                <div>
                                    <span class="font-bold text-gray-700 mr-2 whitespace-nowrap">${escapeHtml(c.author)}</span>
                                    <span class="text-gray-600">${escapeHtml(c.text)}</span>
                                </div>
                                <span class="text-[10px] text-gray-400 shrink-0 ml-2 whitespace-nowrap">${c.time || ''}</span>
                            </div>
                        `).join('');
                    }

                    let authorActionsHtml = '';
                    if (isAuthor) {
                        const imagesParam = JSON.stringify(imgArray).replace(/"/g, '&quot;');
                        authorActionsHtml = `
                            <div class="flex items-center space-x-2 text-[11px]">
                                <button onclick="openWriteModal('${post.id}', \`${escapeHtml(post.content)}\`, ${imagesParam})" class="text-emerald-700 hover:underline whitespace-nowrap">수정</button>
                                <span class="text-gray-300">|</span>
                                <button onclick="confirmDeletePost('${post.id}')" class="text-rose-500 hover:underline whitespace-nowrap">삭제</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex items-center justify-between px-3 pt-3">
                            <div class="flex items-center space-x-2 overflow-hidden">
                                <div class="w-7 h-7 rounded-full church-accent church-primary-text flex items-center justify-center font-bold text-xs shrink-0">
                                    ${escapeHtml((post.author || 'M').charAt(0))}
                                </div>
                                <div class="overflow-hidden">
                                    <span class="text-xs font-bold text-gray-800 truncate block whitespace-nowrap">${escapeHtml(post.author)}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                ${authorActionsHtml}
                                <span class="text-[10px] text-gray-400 shrink-0 whitespace-nowrap">${formatDate(post.createdAt)}</span>
                            </div>
                        </div>

                        ${imagesHtml}

                        <div class="px-3 space-y-2">
                            <div class="flex items-center space-x-3 pt-1">
                                <button onclick="toggleLike('${post.id}', ${hasLiked})" class="flex items-center space-x-1 text-xs font-medium ${hasLiked ? 'text-rose-500' : 'text-gray-600'}">
                                    <i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-base"></i>
                                    <span>${post.likes || 0}</span>
                                </button>
                                <span class="text-xs text-gray-600 font-medium flex items-center space-x-1">
                                    <i class="fa-regular fa-comment-dots text-base"></i>
                                    <span>${post.comments ? post.comments.length : 0}</span>
                                </span>
                                <button onclick="toggleCommentInput('${post.id}')" class="w-6 h-6 rounded-full bg-gray-100 text-gray-700 flex items-center justify-center text-xs hover:bg-gray-200 transition-colors shadow-xs" title="댓글 작성하기">
                                    <i class="fa-solid fa-plus text-[10px]"></i>
                                </button>
                            </div>

                            <div class="text-xs text-gray-700 leading-relaxed font-light">
                                ${escapeHtml(post.content)}
                            </div>

                            <div id="comment-section-${post.id}" class="space-y-1.5 pt-1 hidden">
                                <div class="space-y-1 max-h-28 overflow-y-auto">${commentsHtml}</div>
                                <div class="flex space-x-1.5 pt-1 items-center">
                                    <input type="text" id="comment-input-${post.id}" maxlength="200" placeholder="댓글을 남겨주세요 (200자 이내)..." class="flex-1 px-2 py-1.5 border-b-2 border-emerald-700 bg-transparent text-xs focus:outline-none placeholder-gray-400">
                                    <button onclick="addComment('${post.id}')" class="px-3 py-1.5 church-primary text-white rounded-xl text-xs font-medium whitespace-nowrap shadow-xs">등록</button>
                                </div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            }, (error) => {
                console.error("피드 스냅샷 오류:", error);
                setDbStatus('error');
                if (error.code === 'permission-denied') {
                    showNotification("Firebase Firestore 규칙(Rules) 권한이 거부되었습니다.");
                }
            });
        }

        window.toggleLike = async function(postId, hasLiked) {
            if (!db) return;
            const postRef = doc(db, 'mokjang_posts', postId);
            setDbStatus('saving');
            try {
                if (hasLiked) {
                    await updateDoc(postRef, { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(postRef, { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
                setDbStatus('connected');
            } catch (error) { console.error("좋아요 오류:", error); setDbStatus('error'); }
        };

        window.toggleCommentInput = function(postId) {
            const section = document.getElementById(`comment-section-${postId}`);
            if (section) {
                section.classList.toggle('hidden');
                if (!section.classList.contains('hidden')) {
                    const input = document.getElementById(`comment-input-${postId}`);
                    if (input) input.focus();
                }
            }
        };

        window.addComment = async function(postId) {
            const inputEl = document.getElementById(`comment-input-${postId}`);
            const text = inputEl.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            if (!db) return;
            const postRef = doc(db, 'mokjang_posts', postId);
            setDbStatus('saving');
            try {
                await updateDoc(postRef, { comments: arrayUnion(commentObj) });
                inputEl.value = '';
                setDbStatus('connected');
            } catch (error) { console.error("댓글 오류:", error); setDbStatus('error'); }
        };

        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        window.openLightbox = function(url) {
            lightboxImg.src = url;
            scale = 1; pointX = 0; pointY = 0; updateImageTransform();
            lightboxModal.classList.remove('hidden');
        };
        window.closeLightbox = function() { lightboxModal.classList.add('hidden'); };
        function updateImageTransform() { lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        let initialDistance = null;
        lightboxModal.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true; startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY;
            }
        });
        lightboxModal.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const zoomFactor = currentDistance / initialDistance;
                scale = Math.min(Math.max(1, scale * zoomFactor), 4);
                initialDistance = currentDistance; updateImageTransform();
            } else if (panning && e.touches.length === 1) {
                pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY; updateImageTransform();
            }
        });
        lightboxModal.addEventListener('touchend', () => { initialDistance = null; panning = false; });

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
