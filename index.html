<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세종꿈의교회 목장 게이트</title>
    <script>
        (function() {
            try {
                if (window.location.protocol !== 'file:') {
                    var cleanPath = window.location.pathname.replace(/\/index\.html$/i, '/');
                    window.history.replaceState(null, document.title, cleanPath);
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            /* PC/태블릿 좌우 여백용 은은한 배경 */
            background: radial-gradient(circle at 50% 45%, #f5efe6 0%, #e8dfd1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 모든 기기(폰/태블릿/PC)에서 비율을 고정해 주는 중앙 스테이지 프레임 */
        #gate-stage {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 920px;
            background: linear-gradient(180deg, #fdfbf7 0%, #f8f2e8 55%, #f3eadc 100%);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(60, 45, 30, 0.12);
        }
        @media (min-width: 500px) and (min-height: 740px) {
            #gate-stage {
                height: 94vh;
                border-radius: 28px;
                border: 1px solid rgba(255, 255, 255, 0.85);
            }
        }

        /* 은은한 한지/빛 질감 오버레이 */
        .stage-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 60%),
                radial-gradient(circle at 50% 73%, rgba(226, 200, 175, 0.25) 0%, rgba(255, 255, 255, 0) 55%);
            pointer-events: none;
            z-index: 1;
        }

        /* 상단 로고 + 세종꿈의교회 타이틀 배치 영역 */
        .top-brand-area {
            position: absolute;
            top: 8.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 84%;
            max-width: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 6;
            pointer-events: none;
        }
        .top-brand-logo {
            width: 52px;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(30, 58, 110, 0.08));
        }
        .top-brand-title {
            width: calc(100% - 64px);
            max-width: 245px;
            height: auto;
            object-fit: contain;
        }

        /* 하단 '꿈의목장' 타이틀 이미지 배치 영역 */
        .bottom-mokjang-area {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56%;
            max-width: 215px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 6;
            pointer-events: none;
        }
        .bottom-mokjang-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(143, 91, 93, 0.12));
        }
        .bottom-mokjang-line {
            margin-top: 10px;
            width: 48px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(143, 91, 93, 0.45), transparent);
        }

        /* 유영하는 10개 말씀 레이어 */
        #floating-words-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            overflow: hidden;
            transition: opacity 0.45s ease;
        }
        .floating-grace-word {
            position: absolute;
            left: 50%;
            top: 71%;
            transform: translate(-50%, -50%) scale(0.2);
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 4px 8px;
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.95), 0 1px 4px rgba(143, 91, 93, 0.16);
            white-space: nowrap;
            opacity: 0;
            will-change: left, top, transform, opacity;
        }

        /* 우측 상단 10회 터치 영역 (관리자 보안 페이지 이동) */
        #admin-secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 96px;
            height: 96px;
            z-index: 40;
            background: transparent;
            cursor: default;
        }

        /* 하단 5회 터치 영역 (로그인 캡슐 호출) */
        #bottom-secret-trigger {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36%;
            z-index: 20;
            background: transparent;
            cursor: pointer;
        }

        /* 하단 캡슐형 로그인 바 */
        #capsule-login-wrapper {
            position: absolute;
            bottom: 13%;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            z-index: 30;
            width: 84%;
            max-width: 280px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #capsule-login-wrapper.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .capsule-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 9999px;
            padding: 5px 12px;
            box-shadow: 0 8px 26px rgba(90, 65, 50, 0.16), 0 0 0 1.5px rgba(143, 91, 93, 0.25);
        }
        .capsule-input {
            background: transparent;
            border: none;
            outline: none;
            font-size: 13px;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            padding: 5px 2px;
        }
        .capsule-input::placeholder {
            color: #9ca3af;
            font-weight: 500;
        }
        .capsule-divider {
            width: 1.5px;
            height: 16px;
            background: #e5dcd3;
            margin: 0 4px;
            flex-shrink: 0;
        }

        #toast-msg {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(30, 41, 59, 0.92);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            white-space: nowrap;
        }
        #toast-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 중앙 고정 비율 스테이지 프레임 -->
    <main id="gate-stage">
        <div class="stage-glow"></div>

        <!-- 1. 상단 로고 + 세종꿈의교회 타이틀 (분할 이미지 1, 2) -->
        <header class="top-brand-area">
            <img src="./gate_logo.png"
                 onerror="if(this.src.indexOf('logo30.png')===-1){this.src='./logo30.png';}else if(this.src.indexOf('logo20.png')===-1){this.src='./logo20.png';}"
                 alt="세종꿈의교회 로고"
                 class="top-brand-logo">
            <img src="./gate_title.png"
                 alt="기독교한국침례회 세종꿈의교회"
                 class="top-brand-title">
        </header>

        <!-- 2. 중앙 유영하는 10개의 말씀 레이어 -->
        <div id="floating-words-layer"></div>

        <!-- 3. 하단 '꿈의목장' 타이틀 (분할 이미지 3) -->
        <section class="bottom-mokjang-area">
            <img src="./gate_mokjang.png"
                 alt="꿈의목장"
                 class="bottom-mokjang-img">
            <div class="bottom-mokjang-line"></div>
        </section>

        <!-- 4. 우측 상단 10회 터치 히든 영역 (index1.html 이동) -->
        <div id="admin-secret-trigger" aria-label="관리자 전용 히든 영역"></div>

        <!-- 5. 하단 5회 터치 히든 영역 (로그인 캡슐 호출) -->
        <div id="bottom-secret-trigger" aria-label="목원 입장 터치 영역"></div>

        <!-- 6. 하단 캡슐형 로그인 입력창 -->
        <div id="capsule-login-wrapper">
            <div class="capsule-bar">
                <input type="tel" id="login-code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                       placeholder="코드(4자리)" class="capsule-input w-[44%] tracking-widest">
                <div class="capsule-divider"></div>
                <input type="text" id="login-name-input" maxlength="4"
                       placeholder="이름" class="capsule-input w-[38%]">
                <button type="button" id="login-submit-btn"
                        class="ml-1 px-2.5 py-1 rounded-full bg-[#8f5b5d] text-white text-[11px] font-bold shrink-0 active:scale-95 transition">
                    입장
                </button>
            </div>
        </div>

        <!-- 토스트 알림 -->
        <div id="toast-msg"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 10개의 은혜 말씀 및 은은한 파스텔/로즈 컬러
        const GRACE_WORDS = ['믿음', '소망', '사랑', '감사', '찬송', '기도', '섬김', '양육', '전도', '예배'];
        const WORD_COLORS = [
            '#7c4d50', '#2b4c7e', '#8f5b5d', '#3b5d50', '#6d4c7d',
            '#9c5a4b', '#2d6a6e', '#7a5c3e', '#475569', '#8c4a58'
        ];

        // 스테이지 내부의 균형 잡힌 10개 목표 좌표 (%)
        const TARGET_SPOTS = [
            { x: 24, y: 24 }, { x: 76, y: 24 },
            { x: 50, y: 30 }, { x: 22, y: 38 },
            { x: 78, y: 38 }, { x: 48, y: 43 },
            { x: 28, y: 51 }, { x: 72, y: 51 },
            { x: 36, y: 59 }, { x: 64, y: 59 }
        ];

        let floatingAnimId = null;
        let floatingActive = true;
        const floatingWordItems = [];

        function initFloatingWords() {
            const layer = document.getElementById('floating-words-layer');
            if (!layer) return;
            layer.innerHTML = '';
            floatingWordItems.length = 0;

            const startTime = performance.now();

            GRACE_WORDS.forEach((word, idx) => {
                const el = document.createElement('span');
                el.className = 'floating-grace-word';
                el.textContent = word;
                el.style.color = WORD_COLORS[idx % WORD_COLORS.length];
                el.style.fontSize = `${16 + (idx % 3) * 2}px`;
                layer.appendChild(el);

                const spot = TARGET_SPOTS[idx];
                floatingWordItems.push({
                    el,
                    // 첫 단어부터 마지막 10번째 단어까지 천천히 차례대로 피어나도록 600ms 간격 설정
                    spawnTime: startTime + 300 + idx * 600,
                    spawnDuration: 2800,
                    targetX: spot.x,
                    targetY: spot.y,
                    vx: (idx % 2 === 0 ? 1 : -1) * (0.008 + (idx % 3) * 0.003),
                    vy: (idx % 3 === 0 ? -1 : 1) * (0.006 + (idx % 2) * 0.003),
                    phase: idx * 1.15,
                    speed: 0.0012 + (idx % 4) * 0.0002,
                    ampX: 2.2 + (idx % 3) * 0.6,
                    ampY: 1.8 + (idx % 2) * 0.6
                });
            });

            function animateWords(now) {
                if (!floatingActive) return;

                for (let i = 0; i < floatingWordItems.length; i++) {
                    const item = floatingWordItems[i];
                    const elapsed = now - item.spawnTime;

                    if (elapsed < 0) {
                        item.el.style.opacity = '0';
                        continue;
                    }

                    // 0 -> 1까지 부드럽게 증가하는 진행률 (중간 분기점 없이 연속 수식으로 튕김 현상 원천 제거)
                    const p = Math.min(1, elapsed / item.spawnDuration);
                    const easeOut = 1 - Math.pow(1 - p, 2.4);

                    // 유영 후 서서히 이동하는 드리프트 변화량 (p === 1 이후부터만 아주 미세하게 누적)
                    if (p >= 1) {
                        item.targetX += item.vx;
                        item.targetY += item.vy;

                        if (item.targetX < 18) { item.targetX = 18; item.vx = Math.abs(item.vx); }
                        if (item.targetX > 82) { item.targetX = 82; item.vx = -Math.abs(item.vx); }
                        if (item.targetY < 21) { item.targetY = 21; item.vy = Math.abs(item.vy); }
                        if (item.targetY > 61) { item.targetY = 61; item.vy = -Math.abs(item.vy); }
                    }

                    // 흔들림(sway)도 easeOut에 비례해 0에서부터 서서히 켜지므로 절대 툭 튀지 않음
                    const swayX = Math.sin(now * item.speed + item.phase) * item.ampX * easeOut;
                    const swayY = Math.cos(now * (item.speed * 0.9) + item.phase) * item.ampY * easeOut;

                    // 출발점: 하단 '꿈의목장' 글자 중앙(50%, 71%) -> 목표 지점
                    const curX = 50 + (item.targetX - 50) * easeOut + swayX;
                    const curY = 71 + (item.targetY - 71) * easeOut + swayY;

                    const breath = Math.sin(now * (item.speed * 1.1) + item.phase) * 0.04 * easeOut;
                    const curScale = 0.25 + 0.75 * easeOut + breath;
                    const curOpacity = Math.min(0.92, Math.pow(p, 0.75) * 0.92);

                    item.el.style.left = `${curX.toFixed(2)}%`;
                    item.el.style.top = `${curY.toFixed(2)}%`;
                    item.el.style.opacity = `${curOpacity.toFixed(3)}`;
                    item.el.style.transform = `translate(-50%, -50%) scale(${curScale.toFixed(3)})`;
                }

                floatingAnimId = requestAnimationFrame(animateWords);
            }

            floatingAnimId = requestAnimationFrame(animateWords);
        }

        function stopFloatingWords() {
            floatingActive = false;
            if (floatingAnimId) cancelAnimationFrame(floatingAnimId);
            const layer = document.getElementById('floating-words-layer');
            if (layer) {
                layer.style.opacity = '0';
                setTimeout(() => { layer.innerHTML = ''; }, 450);
            }
        }

        // 페이지 로드 즉시 10개 말씀 유영 시작
        initFloatingWords();

        // 로컬 설정 로드 및 동기화
        const DEFAULT_CONFIG = {
            mokjangName: '23목장',
            mokjangCode: '2323',
            leaderName: '안영준',
            subLeaderName: '',
            members: ['안영준'],
            memberRoles: {}
        };

        function loadConfig() {
            try {
                const saved = localStorage.getItem('mokjang_config_v1');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return {
                        mokjangName: parsed.mokjangName || DEFAULT_CONFIG.mokjangName,
                        mokjangCode: parsed.mokjangCode || DEFAULT_CONFIG.mokjangCode,
                        leaderName: parsed.leaderName || DEFAULT_CONFIG.leaderName,
                        subLeaderName: parsed.subLeaderName || '',
                        members: Array.isArray(parsed.members) && parsed.members.length > 0 ? parsed.members : DEFAULT_CONFIG.members,
                        memberRoles: parsed.memberRoles && typeof parsed.memberRoles === 'object' ? parsed.memberRoles : {}
                    };
                }
            } catch (e) {}
            return { ...DEFAULT_CONFIG };
        }

        let currentConfig = loadConfig();

        // Firebase 실시간 설정 동기화
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        if (firebaseConfig) {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'mokjang_config', 'main');

                const syncFromFirestore = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {}

                    try {
                        const snap = await getDoc(configDocRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            currentConfig = {
                                mokjangName: data.mokjangName || currentConfig.mokjangName,
                                mokjangCode: data.mokjangCode || currentConfig.mokjangCode,
                                leaderName: data.leaderName || currentConfig.leaderName,
                                subLeaderName: data.subLeaderName || currentConfig.subLeaderName || '',
                                members: Array.isArray(data.members) ? data.members : currentConfig.members,
                                memberRoles: data.memberRoles || currentConfig.memberRoles || {}
                            };
                            localStorage.setItem('mokjang_config_v1', JSON.stringify(currentConfig));
                        }
                    } catch (e) {}

                    onSnapshot(configDocRef, (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            currentConfig = {
                                mokjangName: data.mokjangName || currentConfig.mokjangName,
                                mokjangCode: data.mokjangCode || currentConfig.mokjangCode,
                                leaderName: data.leaderName || currentConfig.leaderName,
                                subLeaderName: data.subLeaderName || '',
                                members: Array.isArray(data.members) ? data.members : currentConfig.members,
                                memberRoles: data.memberRoles || {}
                            };
                            localStorage.setItem('mokjang_config_v1', JSON.stringify(currentConfig));
                        }
                    }, () => {});
                };
                syncFromFirestore();
            } catch (e) {}
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.__gateToastTimer);
            window.__gateToastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // 1. 우측 상단 10회 터치 -> 관리자 보안 페이지(index1.html) 이동
        let adminTapCount = 0;
        let adminTapTimer = null;
        const adminTrigger = document.getElementById('admin-secret-trigger');

        adminTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            adminTapCount++;
            clearTimeout(adminTapTimer);

            if (adminTapCount >= 10) {
                adminTapCount = 0;
                sessionStorage.setItem('mokjang_entry_pass', JSON.stringify({
                    target: 'index1.html',
                    authorizedFromIndex: true,
                    issuedAt: Date.now()
                }));
                sessionStorage.setItem('mokjang_authorized_session', 'index_verified');
                window.location.href = './index1.html';
                return;
            }

            adminTapTimer = setTimeout(() => {
                adminTapCount = 0;
            }, 1500);
        });

        // 2. 하단 5회 터치 -> 캡슐형 로그인 입력창 활성화
        let bottomTapCount = 0;
        let bottomTapTimer = null;
        const bottomTrigger = document.getElementById('bottom-secret-trigger');
        const capsuleWrapper = document.getElementById('capsule-login-wrapper');
        const codeInput = document.getElementById('login-code-input');
        const nameInput = document.getElementById('login-name-input');
        const submitBtn = document.getElementById('login-submit-btn');

        bottomTrigger.addEventListener('click', () => {
            if (capsuleWrapper.classList.contains('active')) return;
            bottomTapCount++;
            clearTimeout(bottomTapTimer);

            if (bottomTapCount >= 5) {
                bottomTapCount = 0;
                stopFloatingWords();
                capsuleWrapper.classList.add('active');
                bottomTrigger.style.pointerEvents = 'none';
                setTimeout(() => {
                    codeInput.focus();
                }, 150);
                return;
            }

            bottomTapTimer = setTimeout(() => {
                bottomTapCount = 0;
            }, 1400);
        });

        // 3. 코드(4자리) + 이름(최대4자) 검증 및 목자/부목자/목원 권한 부여 후 입장
        let isRedirecting = false;

        function checkAutoLogin(isManualSubmit = false) {
            if (isRedirecting) return;

            const codeVal = codeInput.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (codeInput.value !== codeVal) codeInput.value = codeVal;

            const nameVal = nameInput.value.trim();

            if (codeVal.length === 4 && document.activeElement === codeInput && nameVal.length === 0) {
                nameInput.focus();
                return;
            }

            if (codeVal.length < 4) {
                if (isManualSubmit) showToast('목장 코드 4자리를 입력해 주세요.');
                return;
            }

            if (nameVal.length < 2) {
                if (isManualSubmit) showToast('성함을 입력해 주세요.');
                return;
            }

            const latestConfig = loadConfig();
            const validCode = (currentConfig.mokjangCode || latestConfig.mokjangCode || '2323').trim();
            const leaderName = (currentConfig.leaderName || latestConfig.leaderName || '').trim();
            const subLeaderName = (currentConfig.subLeaderName || latestConfig.subLeaderName || '').trim();
            const memberRoles = currentConfig.memberRoles || latestConfig.memberRoles || {};
            const members = Array.isArray(currentConfig.members) ? currentConfig.members : (latestConfig.members || []);

            if (codeVal !== validCode) {
                if (isManualSubmit || nameVal.length >= 2) {
                    showToast('목장 코드가 일치하지 않습니다.');
                }
                return;
            }

            const isLeader = leaderName === nameVal || memberRoles[nameVal] === 'leader';
            const isSubLeader = !isLeader && (subLeaderName === nameVal || memberRoles[nameVal] === 'subleader');
            const isRegisteredMember = isLeader || isSubLeader || members.includes(nameVal);

            if (!isRegisteredMember) {
                if (isManualSubmit || nameVal.length >= 3) {
                    showToast('등록된 목원 명단에 없는 성함입니다.');
                }
                return;
            }

            isRedirecting = true;
            const userRole = isLeader ? 'leader' : (isSubLeader ? 'subleader' : 'member');
            const isAdminPrivilege = isLeader || isSubLeader;

            const sessionPayload = {
                name: nameVal,
                role: userRole,
                isAdmin: isAdminPrivilege,
                mokjangCode: validCode,
                mokjangName: currentConfig.mokjangName || latestConfig.mokjangName || '23목장',
                loginAt: Date.now()
            };

            localStorage.setItem('mokjang_active_session', JSON.stringify(sessionPayload));
            localStorage.setItem('mokjang_user_name', nameVal);
            localStorage.setItem('mokjang_user_role', userRole);
            sessionStorage.setItem('mokjang_entry_pass', JSON.stringify({
                target: 'index2.html',
                authorizedFromIndex: true,
                issuedAt: Date.now()
            }));
            sessionStorage.setItem('mokjang_authorized_session', 'index_verified');

            window.location.href = './index2.html';
        }

        codeInput.addEventListener('input', () => checkAutoLogin(false));
        nameInput.addEventListener('input', () => checkAutoLogin(false));
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAutoLogin(true);
            }
        });
        submitBtn.addEventListener('click', () => checkAutoLogin(true));
    </script>
</body>
</html>
