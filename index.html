<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 꿈의 목장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%; height: 100%; max-width: 100%; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #1a103c; color: #ffffff;
            -webkit-tap-highlight-color: transparent; touch-action: pan-y;
        }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        
        /* 제스처 인증 게이트 스타일 */
        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background: radial-gradient(circle at center, #2e1a5e 0%, #0d0821 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; transition: opacity 0.5s ease;
        }
        .gate-bg-img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.85; z-index: 1;
        }
        .gate-content {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; padding: 20px; text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 갈라지는 애니메이션 효과 */
        .split-top, .split-bottom {
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .gate-split-active .split-top { transform: translateY(-120px); opacity: 0; }
        .gate-split-active .split-bottom { transform: translateY(120px); opacity: 0; }
        
        /* 로그인 패널 */
        #login-panel {
            position: absolute; z-index: 20; opacity: 0; pointer-events: none; transform: scale(0.9);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #login-panel.active { opacity: 1; pointer-events: auto; transform: scale(1); }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden">

    <!-- [1단계 & 2단계: 제스처 인증 첫 화면 (IMG_1035.png 배경)] -->
    <div id="auth-gate">
        <!-- 배경 이미지 (제공해주신 IMG_1035.png 또는 그라데이션 조합) -->
        <div class="absolute inset-0 bg-gradient-to-b from-[#2d1b4e] via-[#150a24] to-[#0a0514] z-0"></div>
        <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none z-1">
            <div class="w-72 h-72 rounded-full bg-purple-600/30 blur-3xl animate-pulse"></div>
        </div>

        <div class="gate-content" id="gate-content-box">
            <!-- 상단 십자가 로고 및 세종꿈의교회 (갈라질 때 위로 이동) -->
            <div class="split-top flex flex-col items-center space-y-4 select-none cursor-pointer" id="gesture-target-top" title="십자가와 꿈의 목장을 두 손가락으로 벌려보세요">
                <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 shadow-xl">
                    <i class="fa-solid fa-cross text-3xl text-sky-300"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white drop-shadow-md">기독교한국침례회 세종꿈의교회</h2>
            </div>

            <!-- 중앙 갈라지는 틈새 라인 -->
            <div class="h-16 w-full flex items-center justify-center my-2">
                <p class="text-xs text-purple-300/80 animate-bounce bg-black/40 px-3 py-1 rounded-full border border-purple-500/30 select-none">
                    ✨ 두 손가락으로 터치 후 천천히 벌려주세요 (또는 탭하여 열기)
                </p>
            </div>

            <!-- 하단 꿈의 목장 (갈라질 때 아래로 이동) -->
            <div class="split-bottom flex flex-col items-center select-none cursor-pointer" id="gesture-target-bottom">
                <h1 class="text-3xl font-black tracking-widest text-amber-200 drop-shadow-lg font-serif">꿈의 목장</h1>
                <p class="text-[11px] text-gray-300 mt-1">세종꿈의교회 23목장 공동체</p>
            </div>
        </div>

        <!-- [3단계: 인증 완료 후 나타나는 로그인 입력 패널] -->
        <div id="login-panel" class="w-full max-w-xs bg-white/95 backdrop-blur-xl p-6 rounded-3xl shadow-2xl border border-white/30 text-gray-800">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-black text-emerald-900"><i class="fa-solid fa-shield-halved mr-1.5"></i>목장 로그인</h3>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">안전 인증</span>
            </div>

            <!-- 탭 전환 (목원 로그인 vs 목자 관리자 로그인) -->
            <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl mb-4 text-xs font-bold">
                <button type="button" onclick="switchLoginTab('member')" id="tab-member-btn" class="py-1.5 rounded-lg bg-white text-emerald-900 shadow-2xs transition-all">목원 로그인</button>
                <button type="button" onclick="switchLoginTab('shepherd')" id="tab-shepherd-btn" class="py-1.5 rounded-lg text-gray-500 transition-all">목자(관리자)</button>
            </div>

            <!-- 목원 로그인 폼 (코드 + 이름) -->
            <div id="form-member" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">목장 코드 (예: 23목장)</label>
                    <input type="text" id="input-mokjang-code" placeholder="부여받은 코드를 입력하세요" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">목원 이름</label>
                    <input type="text" id="input-member-name" placeholder="성함을 입력하세요" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="button" onclick="handleMemberLogin()" class="w-full py-2.5 church-primary text-white rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all mt-2">
                    목장 이야기 입장하기 🚀
                </button>
            </div>

            <!-- 목자 관리자 로그인 폼 (구글/카카오/네이버 소셜 인증 모의) -->
            <div id="form-shepherd" class="space-y-2.5 hidden">
                <p class="text-[11px] text-gray-500 mb-2">관리자(목자) 권한으로 앱을 관리하고 공지사항을 발행합니다.</p>
                <button type="button" onclick="handleSocialLogin('구글')" class="w-full py-2.5 bg-white border border-gray-300 rounded-xl text-xs font-bold text-gray-700 hover:bg-gray-50 flex items-center justify-center space-x-2 shadow-2xs">
                    <i class="fa-brands fa-google text-rose-500"></i><span>구글 계정으로 목자 로그인</span>
                </button>
                <button type="button" onclick="handleSocialLogin('카카오')" class="w-full py-2.5 bg-[#FEE500] rounded-xl text-xs font-bold text-gray-900 hover:opacity-90 flex items-center justify-center space-x-2 shadow-2xs">
                    <i class="fa-solid fa-comment text-gray-900"></i><span>카카오 계정으로 목자 로그인</span>
                </button>
                <button type="button" onclick="handleSocialLogin('네이버')" class="w-full py-2.5 bg-[#03C75A] rounded-xl text-xs font-bold text-white hover:opacity-90 flex items-center justify-center space-x-2 shadow-2xs">
                    <i class="fa-solid fa-N text-white"></i><span>네이버 계정으로 목자 로그인</span>
                </button>
            </div>
        </div>
    </div>

    <!-- [메인 앱 화면 (인증 성공 후 노출)] -->
    <header class="h-[52px] shrink-0 bg-white border-b border-gray-200 px-4 flex items-center justify-between w-full z-30 relative max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <h1 class="text-[16px] font-black text-gray-800" id="header-mokjang-title">세종꿈의교회 23목장</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span id="user-role-badge" class="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-full">목원</span>
            <!-- 관리자 모드 버튼 (목자만 노출) -->
            <button id="admin-mode-btn" onclick="openAdminModal()" class="hidden w-7 h-7 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-xs shadow-2xs" title="목자 관리 모드">
                <i class="fa-solid fa-crown"></i>
            </button>
            <button onclick="openHelpModal()" class="w-7 h-7 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center text-xs" title="사용설명서">
                <i class="fa-solid fa-question"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto flex-1 overflow-y-auto p-4 space-y-3 bg-[#F8F9FA]">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 text-center space-y-2">
            <h3 class="text-sm font-bold text-gray-800">🌿 환영합니다!</h3>
            <p class="text-xs text-gray-600" id="welcome-msg">로그인 후 목장 가족들과 따뜻한 교실을 나누세요.</p>
        </div>
    </main>

    <script>
        // 제스처 및 로그인 인터랙션 로직
        const gate = document.getElementById('auth-gate');
        const contentBox = document.getElementById('gate-content-box');
        const loginPanel = document.getElementById('login-panel');

        // 테스트 편의를 위해 상단/하단 영역 클릭 시(또는 핀치 제스처 시) 인증 통과 애니메이션 실행
        document.getElementById('gesture-target-top').addEventListener('click', triggerAuthGateOpen);
        document.getElementById('gesture-target-bottom').addEventListener('click', triggerAuthGateOpen);

        let initialDist = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (currentDist - initialDist > 70) { // 두 손가락을 충분히 벌렸을 때
                    triggerAuthGateOpen();
                    initialDist = 0;
                }
            }
        });

        function triggerAuthGateOpen() {
            contentBox.classList.add('gate-split-active');
            setTimeout(() => {
                loginPanel.classList.add('active');
            }, 400);
        }

        function switchLoginTab(type) {
            const memberBtn = document.getElementById('tab-member-btn');
            const shepherdBtn = document.getElementById('tab-shepherd-btn');
            const formMember = document.getElementById('form-member');
            const formShepherd = document.getElementById('form-shepherd');

            if (type === 'member') {
                memberBtn.className = "py-1.5 rounded-lg bg-white text-emerald-900 shadow-2xs transition-all";
                shepherdBtn.className = "py-1.5 rounded-lg text-gray-500 transition-all";
                formMember.classList.remove('hidden');
                formShepherd.classList.add('hidden');
            } else {
                shepherdBtn.className = "py-1.5 rounded-lg bg-white text-emerald-900 shadow-2xs transition-all";
                memberBtn.className = "py-1.5 rounded-lg text-gray-500 transition-all";
                formShepherd.classList.remove('hidden');
                formMember.classList.add('hidden');
            }
        }

        function handleMemberLogin() {
            const code = document.getElementById('input-mokjang-code').value.trim();
            const name = document.getElementById('input-member-name').value.trim();
            if (!code || !name) {
                alert("목장 코드와 이름을 모두 입력해 주세요.");
                return;
            }
            // 인증 성공 처리 후 게이트 페이드아웃
            completeLogin(name, '목원', false);
        }

        function handleSocialLogin(provider) {
            alert(`${provider} 계정으로 목자(관리자) 인증이 완료되었습니다.`);
            completeLogin('담임목자', '목자(관리자)', true);
        }

        function completeLogin(userName, roleTitle, isShepherd) {
            gate.style.opacity = '0';
            setTimeout(() => {
                gate.style.display = 'none';
            }, 500);

            document.getElementById('user-role-badge').innerText = roleTitle;
            document.getElementById('welcome-msg').innerText = `${userName} (${roleTitle})님, 환영합니다!`;
            if (isShepherd) {
                document.getElementById('admin-mode-btn').classList.remove('hidden');
            }
            
            // 로그인 직후 공지사항 팝업 모의실행
            setTimeout(() => {
                alert("📢 [공지사항] 이번 주 금요일 저녁 8시 온라인 목장 모임이 있습니다.");
            }, 600);
        }

        function openHelpModal() {
            alert("📖 [꿈의 목장 사용설명서]\n- 목자: 목원 관리, 공지 등록\n- 목원: 글쓰기, 댓글, 하트 교제");
        }

        function openAdminModal() {
            alert("👑 [목자 관리 모드]\n- 목원 추가/삭제\n- 목장 이름 변경 및 새 목장 개설\n- 공지사항 발행 관리");
        }
    </script>
</body>
</html>
