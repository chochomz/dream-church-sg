<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리들의 목장 이야기 - 세종꿈의교회 23목장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8F9FA;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        #secret-gate-screen {
            user-select: none;
            -webkit-user-select: none;
        }

        #secret-logo-img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #D4DCD7; }

        @keyframes divine-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px 20px rgba(255, 255, 255, 0.95), inset 0 0 25px rgba(255, 255, 255, 0.7);
                transform: scale(1.04);
            }
        }

        .glowing-logo {
            animation: divine-glow 4s ease-in-out infinite;
        }

        #lightbox-modal, #auth-modal, #write-modal, #confirm-modal {
            touch-action: none;
            overscroll-behavior: contain;
        }
        #lightbox-img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ========================================== -->
    <!-- 1. 시크릿 입장 화면 ("세종꿈의교회" 글자가 "23목장"보다 더 크게 수정) -->
    <!-- ========================================== -->
    <div id="secret-gate-screen" class="fixed inset-0 z-50 church-primary flex flex-col items-center justify-center p-6 text-white text-center">
        <div class="cursor-pointer select-none group relative inline-block" id="secret-login-area">
            <div class="w-36 h-36 bg-white rounded-full flex items-center justify-center p-3 mx-auto mb-6 shadow-2xl group-active:scale-95 transition-transform border-4 border-white/40 overflow-hidden glowing-logo relative z-10">
                <svg viewBox="0 0 200 200" class="w-full h-full object-contain" id="secret-logo-img">
                    <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1" filter="blur(10px)" />
                    <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                    <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                    <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                    <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                </svg>
            </div>
            <div class="absolute inset-0 w-full h-full rounded-full z-20 cursor-pointer" id="secret-tap-overlay"></div>
        </div>

        <!-- 문구 배치: 세종꿈의교회(더 큼) / 23목장 / 두 줄 띄고 / 우리들의 목장 이야기 -->
        <div class="select-none space-y-1">
            <h1 class="text-3xl font-bold tracking-wider text-white whitespace-nowrap">세종꿈의교회</h1>
            <h2 class="text-xl font-semibold text-emerald-100 tracking-wide whitespace-nowrap mt-1">23목장</h2>
            <div class="h-6"></div>
            <p class="text-sm text-emerald-100/90 font-light whitespace-nowrap">우리들의 목장 이야기</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. 사용자 인증 모달 (새로운 목장 입력 확인 기능 포함) -->
    <!-- ========================================== -->
    <div id="auth-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border church-border">
            <div class="text-center mb-5">
                <div class="w-12 h-12 church-accent church-primary-text rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 whitespace-nowrap">목장 멤버 인증</h3>
                <p class="text-xs text-gray-500 mt-1">지정된 성함과 목장 이름을 입력해 주세요.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1 whitespace-nowrap">성함 / 직분</label>
                    <input type="text" id="auth-username-input" placeholder="예: 김목자, 홍길동" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1 whitespace-nowrap">목장 이름</label>
                    <input type="text" id="auth-mokjang-input" value="세종꿈의교회 23목장" class="w-full px-4 py-3 rounded-xl border church-border text-sm focus:outline-none focus:ring-2 focus:ring-[#3B5D50]">
                </div>
                <button onclick="handleUserLogin()" class="w-full py-3 church-primary text-white rounded-xl font-medium text-sm shadow-md whitespace-nowrap">
                    입장하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. 메인 피드 화면 -->
    <!-- ========================================== -->
    <div id="main-feed-screen" class="flex flex-col flex-1 hidden">
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b church-border shadow-xs px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2.5 overflow-hidden">
                <div class="w-9 h-9 church-primary rounded-full flex items-center justify-center p-0.5 shadow-sm border border-emerald-100 overflow-hidden bg-white shrink-0">
                    <svg viewBox="0 0 200 200" class="w-full h-full object-contain scale-110">
                        <polygon points="35,118 100,118 100,58" fill="#5B9BD5" />
                        <path d="M 100,118 L 165,88 C 140,130 110,155 90,173 C 92,158 94,143 96,128 C 98,128 100,128 100,118 Z" fill="#203E78" />
                        <rect x="91" y="40" width="18" height="78" fill="#203E78" rx="2" />
                        <rect x="76" y="55" width="48" height="18" fill="#203E78" rx="2" />
                    </svg>
                </div>
                <div class="overflow-hidden">
                    <h1 class="text-xs font-bold text-gray-800 truncate" id="header-mokjang-title">세종꿈의교회 23목장</h1>
                    <p class="text-[10px] text-gray-500 truncate" id="header-user-display">로그인 정보 없음</p>
                </div>
            </div>
            <div class="shrink-0">
                <button onclick="openWriteModal()" class="px-3 py-1.5 church-accent church-primary-text rounded-lg text-xs font-medium flex items-center space-x-1 shadow-xs whitespace-nowrap">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <span>글쓰기</span>
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-lg w-full mx-auto p-3 space-y-4 pb-24" id="feed-container">
            <!-- 동적 피드 카드가 이곳에 렌더링 됩니다 -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 4. 게시글 작성/수정 모달 -->
    <!-- ========================================== -->
    <div id="write-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg p-5 shadow-2xl border church-border max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-gray-800 whitespace-nowrap" id="modal-title-text"><i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기</h3>
                <button onclick="closeWriteModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3">
                <input type="hidden" id="editing-post-id" value="">
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1 whitespace-nowrap">목장 이름</label>
                    <input type="text" id="post-mokjang-name" value="세종꿈의교회 23목장" class="w-full px-3 py-2 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none" readonly>
                </div>
                
                <div class="space-y-2">
                    <label class="block text-[11px] font-medium text-gray-600 whitespace-nowrap">사진 추가 방식</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border church-border rounded-xl p-2.5 text-center cursor-pointer hover:bg-emerald-50 text-xs flex items-center justify-center space-x-1.5 transition-colors">
                            <i class="fa-solid fa-file-arrow-up church-primary-text"></i>
                            <span class="font-medium text-gray-700">파일/카메라 선택</span>
                            <input type="file" id="post-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                        </label>
                        <button type="button" onclick="toggleUrlInput()" class="border church-border rounded-xl p-2.5 text-center hover:bg-emerald-50 text-xs flex items-center justify-center space-x-1.5 transition-colors">
                            <i class="fa-solid fa-link church-primary-text"></i>
                            <span class="font-medium text-gray-700">웹 주소(URL) 입력</span>
                        </button>
                    </div>

                    <div id="file-preview-container" class="hidden relative mt-2 bg-gray-50 rounded-xl p-2 border church-border text-center">
                        <img id="file-preview-img" src="" alt="미리보기" class="max-h-40 mx-auto rounded-lg object-contain">
                        <button type="button" onclick="clearFileSelection()" class="absolute top-3 right-3 bg-red-500 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center shadow"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div id="url-input-container" class="hidden mt-2">
                        <input type="text" id="post-image-url" placeholder="이미지 주소(https://...)를 입력하세요" class="w-full px-3 py-2 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-1 whitespace-nowrap">이야기 나누기</label>
                    <textarea id="post-content" rows="3" placeholder="즐거웠던 목장 모임이나 사역 소식을 남겨주세요..." class="w-full px-3 py-2 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none resize-none"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="post-display-check" checked class="w-4 h-4 text-[#3B5D50] rounded border-gray-300">
                    <label for="post-display-check" class="text-xs text-gray-700 font-medium whitespace-nowrap">피드에 즉시 노출</label>
                </div>
                <button onclick="submitNewPost()" class="w-full py-2.5 church-primary text-white rounded-xl font-medium text-xs shadow-md whitespace-nowrap" id="submit-btn-text">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. 커스텀 삭제 확인 모달 -->
    <!-- ========================================== -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl border church-border text-center space-y-4">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-gray-800">게시글 삭제</h3>
                <p class="text-xs text-gray-500 mt-1">정말 이 이야기를 삭제하시겠습니까?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeConfirmModal()" class="py-2.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-medium">취소</button>
                <button id="confirm-yes-btn" class="py-2.5 bg-rose-500 text-white rounded-xl text-xs font-medium">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 6. 사진 확대보기 라이트박스 -->
    <!-- ========================================== -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center hidden">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-xl p-2 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="overflow-hidden w-full h-full flex items-center justify-center relative">
            <img id="lightbox-img" src="" alt="확대 이미지" class="max-w-full max-h-full object-contain select-none">
        </div>
        <div class="absolute bottom-6 text-white text-[11px] bg-black/60 px-3 py-1 rounded-full pointer-events-none whitespace-nowrap">
            두 손가락으로 확대/축소 가능
        </div>
    </div>

    <footer class="text-center py-5 text-[11px] text-gray-400 border-t church-border bg-white mt-auto">
        <p class="whitespace-nowrap">그리스도의 은혜를 나누는 마음</p>
        <p class="mt-0.5 whitespace-nowrap">세종꿈의교회 23목장</p>
    </footer>

    <!-- ========================================== -->
    <!-- Firebase SDK 및 연동 로직 -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, deleteDoc, doc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "dream-data.firebaseapp.com",
            projectId: "dream-data",
            storageBucket: "dream-data.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let tapCount = 0;
        let tapTimer = null;
        let currentUser = null;
        let currentMokjang = "세종꿈의교회 23목장";
        let uploadedBase64Image = null;
        let postToDeleteId = null;

        const tapOverlay = document.getElementById('secret-tap-overlay');
        tapOverlay.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 7) {
                tapCount = 0;
                document.getElementById('secret-gate-screen').classList.add('hidden');
                document.getElementById('auth-modal').classList.remove('hidden');
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 800);
            }
        });

        window.handleUserLogin = function() {
            const usernameInput = document.getElementById('auth-username-input').value.trim();
            const mokjangInput = document.getElementById('auth-mokjang-input').value.trim();

            if (!usernameInput) { alert('성함이나 직분을 입력해 주세요.'); return; }
            if (!mokjangInput) { alert('목장 이름을 입력해 주세요.'); return; }

            // 목장 이름이 기존과 다를 경우 새로운 목장으로 입력할 것인지 확인
            if (mokjangInput !== currentMokjang) {
                const isNewMokjang = confirm(`입력하신 목장 이름("${mokjangInput}")이 기존과 다릅니다. 새로운 목장으로 입력할까요?`);
                if (!isNewMokjang) {
                    return; // 사용자가 취소하면 중단
                }
            }

            currentUser = usernameInput;
            currentMokjang = mokjangInput;

            document.getElementById('header-user-display').innerText = `${currentUser} 님`;
            document.getElementById('header-mokjang-title').innerText = currentMokjang;
            document.getElementById('post-mokjang-name').value = currentMokjang;

            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-feed-screen').classList.remove('hidden');

            loadMokjangFeed();
        };

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedBase64Image = e.target.result;
                document.getElementById('file-preview-img').src = uploadedBase64Image;
                document.getElementById('file-preview-container').classList.remove('hidden');
                document.getElementById('url-input-container').classList.add('hidden');
                document.getElementById('post-image-url').value = '';
            };
            reader.readAsDataURL(file);
        };

        window.clearFileSelection = function() {
            uploadedBase64Image = null;
            document.getElementById('file-preview-container').classList.add('hidden');
            document.getElementById('file-preview-img').src = '';
            document.getElementById('post-file-input').value = '';
        };

        window.toggleUrlInput = function() {
            const container = document.getElementById('url-input-container');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                clearFileSelection();
            }
        };

        window.openWriteModal = function(postId = null, existingContent = "", existingImageUrl = "") {
            document.getElementById('editing-post-id').value = postId || "";
            document.getElementById('post-content').value = existingContent || "";
            document.getElementById('post-image-url').value = existingImageUrl && !existingImageUrl.startsWith('data:') ? existingImageUrl : "";
            document.getElementById('post-mokjang-name').value = currentMokjang;
            
            if (existingImageUrl && existingImageUrl.startsWith('data:')) {
                uploadedBase64Image = existingImageUrl;
                document.getElementById('file-preview-img').src = existingImageUrl;
                document.getElementById('file-preview-container').classList.remove('hidden');
            } else {
                clearFileSelection();
            }

            if (postId) {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-pen-to-square church-primary-text mr-1.5"></i>목장 이야기 수정하기`;
                document.getElementById('submit-btn-text').innerText = "수정 완료";
            } else {
                document.getElementById('modal-title-text').innerHTML = `<i class="fa-solid fa-camera church-primary-text mr-1.5"></i>목장 이야기 올리기`;
                document.getElementById('submit-btn-text').innerText = "등록하기";
            }

            document.getElementById('write-modal').classList.remove('hidden');
        };

        window.closeWriteModal = function() {
            document.getElementById('write-modal').classList.add('hidden');
            clearFileSelection();
            document.getElementById('post-content').value = '';
            document.getElementById('post-image-url').value = '';
            document.getElementById('editing-post-id').value = '';
        };

        window.submitNewPost = async function() {
            const postId = document.getElementById('editing-post-id').value;
            const mokjangName = currentMokjang; // 현재 로그인된 목장 이름으로 고정 자동 반영
            const urlInput = document.getElementById('post-image-url').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const isChecked = document.getElementById('post-display-check').checked;

            const finalImageUrl = uploadedBase64Image || urlInput || "https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=800&q=80";

            if (!content) {
                alert('이야기 내용을 입력해 주세요.');
                return;
            }

            try {
                if (postId) {
                    const postRef = doc(db, "mokjang_posts", postId);
                    await updateDoc(postRef, {
                        content: content,
                        imageUrl: finalImageUrl,
                        isChecked: isChecked
                    });
                } else {
                    await addDoc(collection(db, "mokjang_posts"), {
                        mokjangName: mokjangName,
                        author: currentUser, // 로그인한 관리자/멤버 이름 자동 반영
                        imageUrl: finalImageUrl,
                        content: content,
                        isChecked: isChecked,
                        likes: 0,
                        likedUsers: [],
                        comments: [],
                        createdAt: new Date()
                    });
                }
                closeWriteModal();
            } catch (error) {
                console.error("저장 오류:", error);
                alert("저장 중 오류가 발생했습니다.");
            }
        };

        window.confirmDeletePost = function(postId) {
            postToDeleteId = postId;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };

        window.closeConfirmModal = function() {
            postToDeleteId = null;
            document.getElementById('confirm-modal').classList.add('hidden');
        };

        document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
            if (!postToDeleteId) return;
            try {
                await deleteDoc(doc(db, "mokjang_posts", postToDeleteId));
                closeConfirmModal();
            } catch (error) {
                console.error("삭제 오류:", error);
                alert("삭제 중 오류가 발생했습니다.");
            }
        });

        function loadMokjangFeed() {
            const feedContainer = document.getElementById('feed-container');
            const q = query(
                collection(db, "mokjang_posts"),
                where("mokjangName", "==", currentMokjang),
                where("isChecked", "==", true)
            );

            onSnapshot(q, (snapshot) => {
                feedContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    feedContainer.innerHTML = `
                        <div class="text-center py-16 text-gray-400">
                            <i class="fa-solid fa-camera-retro text-3xl mb-2 opacity-40"></i>
                            <p class="text-xs">등록된 목장 이야기가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                const posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                    return timeB - timeA;
                });

                posts.forEach((post) => {
                    const hasLiked = post.likedUsers && post.likedUsers.includes(currentUser);
                    const isAuthor = post.author === currentUser;
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl overflow-hidden shadow-xs border church-border space-y-2.5 pb-3";
                    
                    let commentsHtml = '';
                    if (post.comments && post.comments.length > 0) {
                        commentsHtml = post.comments.map(c => `
                            <div class="bg-gray-50 rounded-xl p-2 text-xs flex justify-between items-start">
                                <div>
                                    <span class="font-bold text-gray-700 mr-2">${c.author}</span>
                                    <span class="text-gray-600">${c.text}</span>
                                </div>
                                <span class="text-[10px] text-gray-400 shrink-0 ml-2">${c.time || ''}</span>
                            </div>
                        `).join('');
                    }

                    let authorActionsHtml = '';
                    if (isAuthor) {
                        authorActionsHtml = `
                            <div class="flex items-center space-x-2 text-[11px]">
                                <button onclick="openWriteModal('${post.id}', \`${escapeHtml(post.content)}\`, '${post.imageUrl}')" class="text-emerald-700 hover:underline">수정</button>
                                <span class="text-gray-300">|</span>
                                <button onclick="confirmDeletePost('${post.id}')" class="text-rose-500 hover:underline">삭제</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex items-center justify-between px-3 pt-3">
                            <div class="flex items-center space-x-2 overflow-hidden">
                                <div class="w-7 h-7 rounded-full church-accent church-primary-text flex items-center justify-center font-bold text-xs shrink-0">
                                    ${post.author.charAt(0)}
                                </div>
                                <div class="overflow-hidden">
                                    <span class="text-xs font-bold text-gray-800 truncate block">${post.author}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                ${authorActionsHtml}
                                <span class="text-[10px] text-gray-400 shrink-0">${formatDate(post.createdAt)}</span>
                            </div>
                        </div>

                        <div class="w-full bg-black/5 overflow-hidden cursor-pointer" onclick="openLightbox('${post.imageUrl}')">
                            <img src="${post.imageUrl}" alt="목장 이야기 사진" class="w-full max-h-80 object-cover">
                        </div>

                        <div class="px-3 space-y-2">
                            <div class="text-xs text-gray-700 leading-relaxed">${escapeHtml(post.content)}</div>
                            
                            <div class="flex items-center justify-between pt-2 border-t church-border">
                                <button onclick="toggleLike('${post.id}', ${hasLiked})" class="flex items-center space-x-1 text-xs font-medium ${hasLiked ? 'text-rose-500' : 'text-gray-500'}">
                                    <i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-sm"></i>
                                    <span>${post.likes || 0}</span>
                                </button>
                                <span class="text-[11px] text-gray-400"><i class="fa-regular fa-comment-dots mr-1"></i>댓글 ${post.comments ? post.comments.length : 0}</span>
                            </div>

                            <div class="space-y-1.5 pt-1">
                                <div class="space-y-1 max-h-28 overflow-y-auto">${commentsHtml}</div>
                                <div class="flex space-x-1.5 pt-1">
                                    <input type="text" id="comment-input-${post.id}" placeholder="댓글을 남겨주세요..." class="flex-1 px-3 py-1.5 rounded-xl border church-border text-xs focus:ring-1 focus:ring-[#3B5D50] focus:outline-none">
                                    <button onclick="addComment('${post.id}')" class="px-3 py-1.5 church-primary text-white rounded-xl text-xs font-medium whitespace-nowrap">등록</button>
                                </div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            });
        }

        window.toggleLike = async function(postId, hasLiked) {
            const postRef = doc(db, "mokjang_posts", postId);
            try {
                if (hasLiked) {
                    await updateDoc(postRef, { likes: increment(-1), likedUsers: arrayRemove(currentUser) });
                } else {
                    await updateDoc(postRef, { likes: increment(1), likedUsers: arrayUnion(currentUser) });
                }
            } catch (error) { console.error("좋아요 오류:", error); }
        };

        window.addComment = async function(postId) {
            const inputEl = document.getElementById(`comment-input-${postId}`);
            const text = inputEl.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const commentObj = { author: currentUser, text: text, time: timeStr };

            const postRef = doc(db, "mokjang_posts", postId);
            try {
                await updateDoc(postRef, { comments: arrayUnion(commentObj) });
                inputEl.value = '';
            } catch (error) { console.error("댓글 오류:", error); }
        };

        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        window.openLightbox = function(url) {
            lightboxImg.src = url;
            scale = 1; pointX = 0; pointY = 0; updateImageTransform();
            lightboxModal.classList.remove('hidden');
        };
        window.closeLightbox = function() { lightboxModal.classList.add('hidden'); };
        function updateImageTransform() { lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        let initialDistance = null;
        lightboxModal.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true; startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY;
            }
        });
        lightboxModal.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const zoomFactor = currentDistance / initialDistance;
                scale = Math.min(Math.max(1, scale * zoomFactor), 4);
                initialDistance = currentDistance; updateImageTransform();
            } else if (panning && e.touches.length === 1) {
                pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY; updateImageTransform();
            }
        });
        lightboxModal.addEventListener('touchend', () => { initialDistance = null; panning = false; });

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }
    </script>
</body>
</html>
