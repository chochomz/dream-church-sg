<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리들의 목장 이야기 - 세종꿈의교회 꿈의 목장</title>
    <!-- [모바일 속도 최적화: 외부 리소스 사전 연결 & DNS 프리페치] -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B5D50'/%3E%3Cpath d='M16 7v18M10 13h12' stroke='%23ffffff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3B5D50">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%; height: 100%; max-width: 100vw; overflow: hidden;
            font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; color: #222222;
            -webkit-tap-highlight-color: transparent; touch-action: pan-y;
            -webkit-text-size-adjust: 100% !important;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        header { padding-top: max(env(safe-area-inset-top, 0px), 0px); }
        .church-primary { background-color: #3B5D50; }
        .church-primary-text { color: #3B5D50; }
        .church-accent { background-color: #E8F0EC; }
        .church-border { border-color: #E5E7EB; }

        @keyframes swayWelcome {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-2deg) translateY(-0.5px); }
            75% { transform: rotate(2deg) translateY(0.5px); }
        }
        .animate-sway-welcome { display: inline-block; animation: swayWelcome 3.5s ease-in-out infinite; transform-origin: center center; }

        /* [게이트 바운드 & 심리스 슬라이드업 모션] */
        @keyframes dipAndSlideUpSeamless {
            0% { transform: translateY(0); }
            22% { transform: translateY(32px); }
            100% { transform: translateY(-100%); }
        }
        .gate-open-active {
            animation: dipAndSlideUpSeamless 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        #auth-gate {
            position: fixed; inset: 0; z-index: 999;
            background-color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
            will-change: transform;
        }

        .gate-img-layer {
            position: absolute; inset: 0;
            background-image: url('img_1042.png'), url('IMG_1042.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #gate-top { clip-path: inset(0 0 50% 0); }
        #gate-bottom { clip-path: inset(50% 0 0 0); cursor: pointer; }

        /* 갈라진 사이에 나타나는 둥근 캡슐형 로그인 창 및 회색 깜빡이는 커서 */
        #code-auth-box {
            position: absolute; left: 50%; top: 70%;
            transform: translate(-50%, -50%);
            z-index: 30; opacity: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
            background-color: #ffffff;
            border: 1px dashed #9ca3af;
            border-radius: 9999px;
            padding: 6px 12px;
        }

        #code-auth-box input {
            font-size: 16px !important;
            -webkit-text-size-adjust: 100% !important;
            caret-color: #6b7280 !important; /* 회색 깜빡이는 커서 */
        }

        #floating-words-layer {
            position: absolute; inset: 0; z-index: 20;
            pointer-events: none; overflow: hidden;
            transition: opacity 0.6s ease;
        }
        .floating-grace-word {
            position: absolute; left: 50%; top: 72%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Song Myung', serif;
            color: #c29ba1;
            font-size: clamp(19px, 5.2vw, 24px);
            font-weight: 400;
            letter-spacing: 0.06em;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.9);
            will-change: transform, left, top, opacity;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            25% { opacity: 0.7; } 
            75% { opacity: 0.4; } 
            100% { transform: translateY(-115vh) scale(1.4); opacity: 0; }
        }
        .floating-heart {
            position: fixed; bottom: -50px; color: #ff7799; 
            filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.8));
            pointer-events: none; z-index: 1000; opacity: 0;
        }

        /* [심리스 연동 백그라운드 메인 피드 컨테이너 미리보기 슬라이드업] */
        #seamless-feed-preview {
            position: fixed; inset: 0; z-index: 900;
            background-color: #F8F9FA;
            display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 3.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        #seamless-feed-preview.slide-up-active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="flex flex-col h-full w-full max-w-full overflow-hidden bg-[#F8F9FA]">

    <!-- [심리스 연동 메인 피드 뷰 (게이트 뒤에서 스르륵 함께 올라옴)] -->
    <div id="seamless-feed-preview" class="w-full max-w-md mx-auto h-full flex flex-col shadow-2xl">
        <header class="h-[52px] shrink-0 bg-white border-b church-border shadow-2xs px-4 flex items-center justify-between w-full z-30 relative">
            <div class="w-8 shrink-0 flex items-center justify-start"></div>
            <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center">
                <div class="relative flex items-center space-x-1.5 justify-center">
                    <h1 class="text-[18.8px] font-black tracking-tight leading-tight text-[#374151]">세종꿈의교회 <span class="text-emerald-700">23목장</span></h1>
                </div>
                <p class="text-[10px] text-gray-500 font-medium mt-0.5 animate-sway-welcome">목장 가족님 환영합니다</p>
            </div>
            <div class="w-8"></div>
        </header>
        <main class="flex-1 p-4 flex items-center justify-center text-center text-gray-500 text-xs">
            <div class="space-y-2">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center mx-auto text-lg animate-bounce">🌿</div>
                <p class="font-bold text-gray-700">목장 나눔방으로 입장 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- [제스처 인증 게이트 (원본 단독 노출 + 십자가/목장 핀치 스플릿)] -->
    <div id="auth-gate">
        <div class="gate-img-layer" id="gate-top"></div>
        <div class="gate-img-layer" id="gate-bottom"></div>

        <!-- 우측 상단 10회 터치 시 관리자(index1.html) 진입 -->
        <div class="absolute top-0 right-0 w-16 h-16 z-40">
            <button type="button" onclick="goToAdminPage()" aria-label="관리자 페이지" class="w-full h-full bg-transparent border-0 focus:outline-none"></button>
        </div>

        <div id="floating-words-layer"></div>

        <!-- 갈라진 사이에 나타나는 둥근 캡슐형 로그인 창 -->
        <div id="code-auth-box">
            <!-- 코드는 숫자 최대 4자리 -->
            <input type="text" id="input-mokjang-code" oninput="handleCodeInput(this)" placeholder="코드" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="w-[55px] bg-transparent text-center text-gray-900 focus:outline-none font-bold">
            <div class="w-px h-3.5 bg-gray-400 mx-1"></div>
            <!-- 이름은 한글 최대 4글자 -->
            <input type="text" id="input-member-name" oninput="handleNameInput(this)" placeholder="이름" maxlength="4" class="w-[55px] bg-transparent text-center text-gray-900 focus:outline-none font-bold">
        </div>
    </div>

    <script>
        const authGate = document.getElementById('auth-gate');
        const gateBottom = document.getElementById('gate-bottom');
        const codeAuthBox = document.getElementById('code-auth-box');
        const floatingWordsLayer = document.getElementById('floating-words-layer');
        const seamlessFeedPreview = document.getElementById('seamless-feed-preview');

        const GRACE_WORDS = ['믿음', '소망', '사랑', '감사', '찬송', '기도', '섬김', '양육', '전도', '예배'];
        const floatingWordItems = [];
        let floatingAnimId = null;
        let isFloatingWordsActive = true;

        function initFloatingWords() {
            if (!floatingWordsLayer) return;
            floatingWordsLayer.innerHTML = '';
            floatingWordItems.length = 0;
            const now = performance.now();

            GRACE_WORDS.forEach((word, idx) => {
                const el = document.createElement('span');
                el.className = 'floating-grace-word';
                el.textContent = word;
                floatingWordsLayer.appendChild(el);

                const targetX = 32 + (idx % 3) * 18 + (Math.random() * 10 - 5);
                const targetY = 61.5 + Math.floor(idx / 3) * 6.5 + (Math.random() * 4 - 2);

                floatingWordItems.push({
                    el,
                    spawnTime: now + idx * 240,
                    spawnDuration: 1500,
                    x: targetX,
                    y: targetY,
                    vx: (Math.random() * 0.022 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
                    vy: (Math.random() * 0.016 + 0.007) * (Math.random() < 0.5 ? 1 : -1),
                    scalePhase: Math.random() * Math.PI * 2,
                    scaleSpeed: 0.0014 + Math.random() * 0.0008,
                    swayPhase: Math.random() * Math.PI * 2,
                    swaySpeed: 0.0011 + Math.random() * 0.0006
                });
            });

            function animateWords(timestamp) {
                if (!isFloatingWordsActive) return;

                floatingWordItems.forEach((item) => {
                    const elapsed = timestamp - item.spawnTime;
                    if (elapsed < 0) return;

                    if (elapsed < item.spawnDuration) {
                        const p = elapsed / item.spawnDuration;
                        const easeOut = 1 - Math.pow(1 - p, 3);
                        const curX = 50 + (item.x - 50) * easeOut;
                        const curY = 72 + (item.y - 72) * easeOut;
                        const curScale = 0.2 + 0.8 * easeOut;
                        item.el.style.left = `${curX}%`;
                        item.el.style.top = `${curY}%`;
                        item.el.style.opacity = `${Math.min(0.88, p * 0.95)}`;
                        item.el.style.transform = `translate(-50%, -50%) scale(${curScale.toFixed(3)})`;
                    } else {
                        item.x += item.vx;
                        item.y += item.vy;

                        if (item.x < 26) { item.x = 26; item.vx = Math.abs(item.vx) * (0.9 + Math.random() * 0.2); }
                        if (item.x > 74) { item.x = 74; item.vx = -Math.abs(item.vx) * (0.9 + Math.random() * 0.2); }

                        if (item.y < 60) { item.y = 60; item.vy = Math.abs(item.vy) * (0.9 + Math.random() * 0.2); }
                        if (item.y > 71.5) { item.y = 71.5; item.vy = -Math.abs(item.vy) * (0.9 + Math.random() * 0.2); }

                        const wave = Math.sin(timestamp * item.scaleSpeed + item.scalePhase);
                        const curScale = 0.94 + wave * 0.18;
                        const curOpacity = 0.78 + wave * 0.14;
                        const swayDeg = Math.sin(timestamp * item.swaySpeed + item.swayPhase) * 3.5;

                        item.el.style.left = `${item.x.toFixed(2)}%`;
                        item.el.style.top = `${item.y.toFixed(2)}%`;
                        item.el.style.opacity = `${curOpacity.toFixed(2)}`;
                        item.el.style.transform = `translate(-50%, -50%) scale(${curScale.toFixed(3)}) rotate(${swayDeg.toFixed(2)}deg)`;
                    }
                });

                floatingAnimId = requestAnimationFrame(animateWords);
            }

            floatingAnimId = requestAnimationFrame(animateWords);
        }

        function stopFloatingWords() {
            if (!isFloatingWordsActive) return;
            isFloatingWordsActive = false;
            if (floatingWordsLayer) {
                floatingWordsLayer.style.opacity = '0';
                setTimeout(() => {
                    if (floatingAnimId) cancelAnimationFrame(floatingAnimId);
                }, 650);
            }
        }

        let tapCount = 0;
        let tapResetTimer = null;

        gateBottom.addEventListener('click', () => {
            tapCount++;
            if (tapCount >= 5) {
                stopFloatingWords();
                codeAuthBox.style.opacity = '1';
                codeAuthBox.style.pointerEvents = 'auto';
                setTimeout(() => {
                    const codeInput = document.getElementById('input-mokjang-code');
                    if (codeInput) codeInput.focus();
                }, 100);
            }

            clearTimeout(tapResetTimer);
            tapResetTimer = setTimeout(() => {
                tapCount = 0;
            }, 1500); 
        });

        // 코드 입력 시 숫자만 허용, 최대 4자리. 코드가 4자리 정확히 맞을 때만 진동 1회 발생 및 이름창으로 커서 이동
        window.handleCodeInput = function(input) {
            let clean = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (input.value !== clean) input.value = clean;
            
            let validCode = window.liveMokjangConfig?.mokjangCode || '1111';
            try {
                const rawCfg = localStorage.getItem('mokjang_config_backup');
                if (rawCfg && !window.liveMokjangConfigLoaded) {
                    const cfg = JSON.parse(rawCfg);
                    if (cfg.mokjangCode) validCode = String(cfg.mokjangCode).trim();
                }
            } catch(e) {}

            const isCodeCorrect = (clean === '1111' || clean === validCode);

            if (clean.length === 4 && isCodeCorrect && document.activeElement === input) {
                // 코드 일치 시 진동 1회 발생
                if (navigator.vibrate) {
                    try { navigator.vibrate(40); } catch(e) {}
                }
                const nameInput = document.getElementById('input-member-name');
                if (nameInput) nameInput.focus();
            }
            checkAutoLogin();
        };

        // 이름 입력 시 한글만 허용, 최대 4글자
        window.handleNameInput = function(input) {
            let clean = input.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣]/g, '').slice(0, 4);
            if (input.value !== clean) input.value = clean;
            checkAutoLogin();
        };

        function checkAutoLogin() {
            const codeInput = document.getElementById('input-mokjang-code');
            const nameInput = document.getElementById('input-member-name');
            const code = codeInput.value.trim();
            const name = nameInput.value.trim();

            let validCode = window.liveMokjangConfig?.mokjangCode || '1111';
            let validMembers = Array.isArray(window.liveMokjangConfig?.members) ? window.liveMokjangConfig.members : ['1111'];
            let mokjangShort = window.liveMokjangConfig?.mokjangName || '23목장';
            let leaderName = window.liveMokjangConfig?.leaderName || '목자';
            try {
                const rawCfg = localStorage.getItem('mokjang_config_backup');
                if (rawCfg && !window.liveMokjangConfigLoaded) {
                    const cfg = JSON.parse(rawCfg);
                    if (cfg.mokjangCode) validCode = String(cfg.mokjangCode).trim();
                    if (Array.isArray(cfg.members) && cfg.members.length > 0) validMembers = cfg.members;
                    if (cfg.mokjangName) mokjangShort = cfg.mokjangName;
                    if (cfg.leaderName) leaderName = cfg.leaderName;
                }
            } catch(e) {}

            const isDefaultMatch = (code === '1111' && name === '1111');
            const isConfigMatch = (code === validCode && validMembers.includes(name));

            // 코드와 이름이 모두 정확히 일치할 때만 자동 로그인 승인
            if (code.length === 4 && name.length >= 3 && (isDefaultMatch || isConfigMatch)) {
                const isAdminFlag = (name === leaderName || name === '목자' || name === '관리자') ? '1' : '0';
                try {
                    localStorage.setItem('mokjang_user_name', name);
                    localStorage.setItem('mokjang_short_name', mokjangShort);
                    localStorage.setItem('mokjang_name', `세종꿈의교회 ${mokjangShort}`);
                    localStorage.setItem('mokjang_is_admin', (isAdminFlag === '1') ? 'true' : 'false');
                } catch(e) {}
                codeInput.blur();
                nameInput.blur();
                handleMemberLogin(name, mokjangShort, isAdminFlag);
            }
        }

        function handleMemberLogin(userName, mokjangShort = '23목장', isAdminFlag = '0') {
            const finalName = userName || document.getElementById('input-member-name').value.trim() || '목장가족';
            const finalMokjang = mokjangShort || '23목장';
            const targetUrl = 'index2.html'
                + '?mokjang=' + encodeURIComponent(finalMokjang)
                + '&user=' + encodeURIComponent(finalName)
                + '&admin=' + encodeURIComponent(isAdminFlag);

            authGate.classList.add('gate-open-active');
            if (seamlessFeedPreview) {
                seamlessFeedPreview.classList.add('slide-up-active');
            }
            
            createHearts();

            setTimeout(() => {
                try {
                    sessionStorage.setItem('mokjang_entry_pass', JSON.stringify({
                        target: 'index2.html',
                        authorizedFromIndex: true,
                        issuedAt: Date.now()
                    }));
                    sessionStorage.setItem('mokjang_authorized_session', 'index_verified');
                } catch (e) {}
                try {
                    if (window.location && typeof window.location.replace === 'function') {
                        window.location.replace(targetUrl);
                    } else {
                        window.location.href = targetUrl;
                    }
                } catch (navErr) {
                    window.location.href = targetUrl;
                }
            }, 3000);
        }

        let adminTapCount = 0;
        let adminTapResetTimer = null;

        function goToAdminPage() {
            adminTapCount++;
            if (adminTapCount >= 10) {
                adminTapCount = 0;
                clearTimeout(adminTapResetTimer);
                try {
                    sessionStorage.setItem('mokjang_entry_pass', JSON.stringify({
                        target: 'index1.html',
                        authorizedFromIndex: true,
                        issuedAt: Date.now()
                    }));
                    sessionStorage.setItem('mokjang_authorized_session', 'index_verified');
                } catch (e) {}
                try {
                    if (window.location && typeof window.location.replace === 'function') {
                        window.location.replace('index1.html');
                    } else {
                        window.location.href = 'index1.html';
                    }
                } catch(navErr) {
                    window.location.href = 'index1.html';
                }
                return;
            }
            clearTimeout(adminTapResetTimer);
            adminTapResetTimer = setTimeout(() => {
                adminTapCount = 0;
            }, 1500);
        }

        function createHearts() {
            const heartCount = 35;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('i');
                heart.className = 'fa-solid fa-heart floating-heart';
                
                const left = Math.random() * 100;
                const size = Math.random() * 16 + 12;
                const duration = Math.random() * 1.2 + 2.8;
                const delay = Math.random() * 0.8;
                
                heart.style.left = `${left}vw`;
                heart.style.fontSize = `${size}px`;
                heart.style.animation = `floatHeart ${duration}s ease-out ${delay}s forwards`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, (duration + delay) * 1000 + 100);
            }
        }

        initFloatingWords();
    </script>

    <!-- [파이어베이스 실시간 목장 설정(mokjang_config/main) 동기화] -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKD5LUQL84ZuPH5UJrHBj7yAYDTabDWVA",
            authDomain: "dream-data-146a4.firebaseapp.com",
            projectId: "dream-data-146a4",
            storageBucket: "dream-data-146a4.firebasestorage.app",
            messagingSenderId: "812415684377",
            appId: "1:812415684377:web:de8859d1502b3c05acbf88"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            signInAnonymously(auth).then(() => {
                onSnapshot(doc(db, 'mokjang_config', 'main'), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        window.liveMokjangConfig = data;
                        window.liveMokjangConfigLoaded = true;
                        try {
                            localStorage.setItem('mokjang_config_backup', JSON.stringify(data));
                        } catch (e) {}
                    }
                });
            }).catch(() => {});
        } catch (e) {}
    </script>
</body>
</html>
