<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>개발자 전용 목장 개설 시스템 - 세종꿈의교회 (tindexdm)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: "Pretendard", sans-serif; background-color: #0F172A; color: #F8FAFC; }
        .dashed-input { background-color: #1E293B !important; color: #F8FAFC !important; border: 1px dashed #64748B !important; outline: none !important; font-size: 14.5px !important; }
        .dashed-input:focus { border: 1px dashed #34D399 !important; }
    </style>
</head>
<body class="min-h-screen py-4 px-3 flex flex-col items-center select-none">
    <div class="w-full max-w-md bg-slate-900 rounded-3xl border border-slate-700 shadow-2xl p-4 space-y-3.5">
        <!-- 상단 타이틀 -->
        <div class="relative flex items-center justify-center min-h-[44px] pb-2.5 border-b border-slate-800">
            <div class="flex items-center space-x-2 px-12 min-w-0">
                <div class="w-8 h-8 rounded-xl border border-slate-700 bg-slate-800 p-1 flex items-center justify-center shrink-0">
                    <img src="logo30.png" alt="로고" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='flogo.png';}else{this.style.display='none';}" class="w-full h-full object-contain">
                </div>
                <h1 class="text-[15px] font-black text-white whitespace-nowrap truncate">세종꿈의교회 - 개발자 목장개설</h1>
            </div>
            <button type="button" onclick="location.href='index.html'" class="absolute right-0 top-1/2 -translate-y-1/2 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-[11px] font-bold">로그인창</button>
        </div>

        <!-- [indexdm.html에서 이동해 온] 목장코드 & 보안 패스코드 확인/조회 박스 -->
        <section class="w-full bg-slate-800/80 rounded-2xl border border-slate-700 p-3.5 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <div class="flex items-center space-x-2 min-w-0">
                    <div class="w-7 h-7 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs"><i class="fa-solid fa-lock-open"></i></div>
                    <div>
                        <h2 class="text-xs font-extrabold text-white">목장별 보안 패스코드 조회 / 개설</h2>
                        <p class="text-[10px] text-slate-400">목장코드(4자리)와 보안 패스코드(초기 0000) 조회 및 생성</p>
                    </div>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">tindexdm</span>
            </div>
            <div class="flex items-center gap-1.5 w-full">
                <div class="w-[88px] shrink-0">
                    <label class="block text-[9.5px] font-bold text-slate-400 mb-0.5 text-center">목장코드</label>
                    <input type="text" id="dev-gate-code" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)" placeholder="코드4자리" class="w-full px-2 py-1.5 rounded-xl font-mono font-black text-center dashed-input">
                </div>
                <div class="flex-1 min-w-0">
                    <label class="block text-[9.5px] font-bold text-slate-400 mb-0.5 text-center">목자 보안 패스코드</label>
                    <input type="text" id="dev-gate-pass" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)" placeholder="패스코드 4자리 (초기 0000)" class="w-full px-2.5 py-1.5 rounded-xl font-mono font-black text-center tracking-widest dashed-input">
                </div>
                <div class="pt-3.5 shrink-0">
                    <button type="button" onclick="lookupMokjang()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-extrabold flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-magnifying-glass text-[10px]"></i><span>조회/개설</span></button>
                </div>
            </div>
        </section>

        <!-- 새로운 목자 & 새 목장코드 & 목자패스코드 입력 생성 폼 -->
        <section class="w-full bg-slate-800/80 rounded-2xl border border-emerald-500/40 p-3.5 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700 pb-1.5">
                <h3 class="text-xs font-extrabold text-emerald-300"><i class="fa-solid fa-user-plus mr-1"></i>새로운 목장 생성 및 권한 부여</h3>
                <button type="button" onclick="resetForm()" class="text-[10px] text-slate-400 hover:text-white underline">초기화</button>
            </div>
            <div>
                <label class="block text-[10.5px] font-bold text-slate-300 mb-1">목장 이름 (타이틀)</label>
                <input type="text" id="new-mokjang-name" maxlength="14" placeholder="예: 25목장, 사랑목장 (목자가 추후 변경가능)" class="w-full px-3 py-1.5 rounded-xl font-bold dashed-input">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10.5px] font-bold text-amber-300 mb-1">새로운 목장코드 (4자리)</label><input type="text" id="new-mokjang-code" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)" placeholder="예: 2501" class="w-full px-2.5 py-1.5 rounded-xl font-mono font-black text-center dashed-input"></div>
                <div><label class="block text-[10.5px] font-bold text-emerald-300 mb-1">목자 패스코드 (4자리)</label><input type="text" id="new-admin-pass" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)" value="0000" class="w-full px-2.5 py-1.5 rounded-xl font-mono font-black text-center dashed-input"></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10.5px] font-bold text-white mb-1">새로운 목자 이름 *</label><input type="text" id="new-leader-name" maxlength="6" placeholder="예: 홍길동" class="w-full px-2.5 py-1.5 rounded-xl font-bold text-center dashed-input"></div>
                <div><label class="block text-[10.5px] font-bold text-slate-300 mb-1">부목자 이름 (선택)</label><input type="text" id="new-sub-name" maxlength="6" placeholder="선택 입력" class="w-full px-2.5 py-1.5 rounded-xl font-bold text-center dashed-input"></div>
            </div>
            <button type="button" onclick="saveNewMokjang()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black shadow-lg transition-all"><i class="fa-solid fa-check mr-1"></i>새 목장 생성 및 권한 저장</button>
            <div id="guide-box" class="hidden bg-slate-950 rounded-xl p-2.5 border border-emerald-500/40 space-y-2">
                <div class="flex items-center justify-between"><span class="text-[11px] font-bold text-emerald-400">✅ 발급 완료 (새 목자 전달용)</span><button type="button" onclick="copyGuide()" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-extrabold">복사하기</button></div>
                <pre id="guide-text" class="text-[11px] text-slate-200 font-sans whitespace-pre-wrap select-all"></pre>
            </div>
        </section>

        <!-- 개설된 전체 목장 리스트 -->
        <section class="w-full bg-slate-800/80 rounded-2xl border border-slate-700 p-3.5 space-y-2">
            <h3 class="text-xs font-extrabold text-white border-b border-slate-700 pb-1.5"><i class="fa-solid fa-list text-sky-400 mr-1.5"></i>개설된 목장 현황 (<span id="total-cnt" class="text-emerald-400">0</span>개)</h3>
            <div id="mokjang-list" class="space-y-1.5 max-h-56 overflow-y-auto"></div>
        </section>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        var firebaseConfig = { apiKey: "AIzaSyDKD5LUQL84ZuPH5UJrHBj7yAYDTabDWVA", authDomain: "dream-data-146a4.firebaseapp.com", projectId: "dream-data-146a4", storageBucket: "dream-data-146a4.firebasestorage.app", messagingSenderId: "812415684377", appId: "1:812415684377:web:de8859d1502b3c05acbf88" };
        var app = initializeApp(firebaseConfig); var auth = getAuth(app); var db = getFirestore(app);
        var configsMap = {};
        function toast(m) { var t = document.createElement("div"); t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-xl z-50"; t.textContent = m; document.body.appendChild(t); setTimeout(function(){t.remove();}, 2200); }
        window.fillForm = function(cfg) {
            document.getElementById("dev-gate-code").value = cfg.mokjangCode || "";
            document.getElementById("dev-gate-pass").value = cfg.adminPasscode || "0000";
            document.getElementById("new-mokjang-name").value = cfg.mokjangName || "";
            document.getElementById("new-mokjang-code").value = cfg.mokjangCode || "";
            document.getElementById("new-admin-pass").value = cfg.adminPasscode || "0000";
            document.getElementById("new-leader-name").value = cfg.leaderName || "";
            document.getElementById("new-sub-name").value = cfg.subLeaderName || "";
        };
        window.resetForm = function() {
            ["dev-gate-code","dev-gate-pass","new-mokjang-name","new-mokjang-code","new-leader-name","new-sub-name"].forEach(function(id){ document.getElementById(id).value = ""; });
            document.getElementById("new-admin-pass").value = "0000";
            document.getElementById("guide-box").classList.add("hidden");
        };
        window.lookupMokjang = async function() {
            var c = document.getElementById("dev-gate-code").value.trim();
            if (!/^[0-9]{4}$/.test(c)) { toast("목장코드 4자리를 입력하세요."); return; }
            await signInAnonymously(auth);
            var snap = await getDoc(doc(db, "mokjang_configs", c));
            if (snap.exists()) { window.fillForm(snap.data()); toast("[" + c + "] 목장 정보를 불러왔습니다."); }
            else { document.getElementById("new-mokjang-code").value = c; document.getElementById("new-admin-pass").value = document.getElementById("dev-gate-pass").value.trim() || "0000"; toast("신규 코드입니다. 아래에서 목자 성함을 입력해 생성하세요."); }
        };
        window.saveNewMokjang = async function() {
            var mName = document.getElementById("new-mokjang-name").value.trim().replace(/^세종꿈의교회\s*/, "");
            var mCode = document.getElementById("new-mokjang-code").value.trim();
            var aPass = document.getElementById("new-admin-pass").value.trim() || "0000";
            var lName = document.getElementById("new-leader-name").value.trim();
            var sName = document.getElementById("new-sub-name").value.trim();
            if (!/^[0-9]{4}$/.test(mCode) || !/^[0-9]{4}$/.test(aPass)) { toast("목장코드와 패스코드는 숫자 4자리여야 합니다."); return; }
            if (!lName || lName.length < 2) { toast("새로운 목자 이름을 2자 이상 입력해 주세요."); return; }
            var existing = configsMap[mCode] || {};
            var members = Array.isArray(existing.members) ? existing.members.slice() : [];
            if (members.indexOf(lName) === -1) members.unshift(lName);
            if (sName && members.indexOf(sName) === -1) members.push(sName);
            var payload = { mokjangName: mName, mokjangCode: mCode, adminPasscode: aPass, leaderName: lName, subLeaderName: sName, subLeaders: sName ? [sName] : [], members: members, memberJoinedAt: existing.memberJoinedAt || {}, updatedAt: Date.now() };
            await signInAnonymously(auth);
            await setDoc(doc(db, "mokjang_configs", mCode), payload, { merge: true });
            if (mCode === "1111") await setDoc(doc(db, "mokjang_config", "main"), payload, { merge: true });
            try { localStorage.setItem("mokjang_config_backup_" + mCode, JSON.stringify(payload)); } catch(e){}
            var gText = "[세종꿈의교회 꿈의목장 개설 안내]\n• 목장명: " + (mName || "꿈의목장") + "\n• 목자 성함(로그인 이름): " + lName + "\n• 목장 입장 코드(4자리): " + mCode + "\n• 목자 관리 패스코드: " + aPass + "\n\n초기 로그인 화면에서 이름(" + lName + ")과 코드(" + mCode + ")를 입력하시면 새로운 빈 목장 웹북이 시작됩니다.";
            document.getElementById("guide-text").textContent = gText;
            document.getElementById("guide-box").classList.remove("hidden");
            toast("[" + mCode + "] 새 목장 생성 및 권한 부여 완료!");
        };
        window.copyGuide = function() {
            var t = document.getElementById("guide-text").textContent;
            navigator.clipboard.writeText(t).then(function(){ toast("안내문이 복사되었습니다. 카톡으로 전달하세요!"); });
        };
        function renderList() {
            var keys = Object.keys(configsMap).sort();
            document.getElementById("total-cnt").textContent = String(keys.length);
            var box = document.getElementById("mokjang-list"); box.innerHTML = "";
            keys.forEach(function(k) {
                var c = configsMap[k];
                var d = document.createElement("div");
                d.className = "flex items-center justify-between px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs cursor-pointer hover:border-emerald-500/50";
                d.onclick = function() { window.fillForm(c); toast("[" + k + "] 목장 선택됨"); };
                d.innerHTML = "<div class=\"flex items-center space-x-2\"><span class=\"px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono font-black\">" + k + "</span><span class=\"font-bold text-white\">" + (c.mokjangName || "꿈의목장") + "</span><span class=\"text-amber-300 font-bold\">목자: " + (c.leaderName || "미지정") + "</span></div><div class=\"text-[11px] font-mono text-slate-400\">패스코드: <strong class=\"text-emerald-400\">" + (c.adminPasscode || "0000") + "</strong></div>";
                box.appendChild(d);
            });
        }
        (async function init() {
            await signInAnonymously(auth);
            onSnapshot(doc(db, "mokjang_config", "main"), function(s) { if (s.exists()) { var d = s.data(); var k = String(d.mokjangCode || "1111").trim(); configsMap[k] = Object.assign({}, configsMap[k] || {}, d); renderList(); } });
            onSnapshot(collection(db, "mokjang_configs"), function(s) { s.forEach(function(docSnap) { var d = docSnap.data(); var k = String(d.mokjangCode || docSnap.id).trim(); configsMap[k] = Object.assign({}, configsMap[k] || {}, d); }); renderList(); });
        })();
    </script>
</body>
</html>
